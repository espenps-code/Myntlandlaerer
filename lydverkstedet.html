<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Lydverkstedet – Myntland</title>
<meta name="description" content="Eleven ser et bilde og skriver bokstaven til første lyd, siste lyd eller vokalen i midten. For interaktiv tavle og iPad – opptil fire elever samtidig.">
<meta name="theme-color" content="#232a3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lydverkstedet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='114' fill='%231e0f52'/%3E%3Ctext x='256' y='360' font-family='Arial Black,sans-serif' font-size='320' font-weight='900' text-anchor='middle' fill='%23EF9F27'%3EM%3C/text%3E%3C/svg%3E" type="image/svg+xml">

<!-- Delt Myntland-styling (palett + fonter). Inline-stilene under bygger videre på denne. -->
<link rel="stylesheet" href="myntland.css">

<style>
:root{
  --navy:#232a3f; --navy-soft:#3b4560;
  --krem:#fbf1d6; --krem-dyp:#f3e2b9; --krem-lys:#fffaeb;
  --amber:#efae2a; --amber-dyp:#c4841a;
  --raud:#e8473f; --gronn:#74c043; --gronn-dyp:#4f8f28; --teal:#2bb3c0;
  --himmel-1:#a6dff0; --himmel-2:#d8f2f8; --bakke:#8cc63f;
  --text:#232a3f; --muted:#6b7690; --border:var(--navy);
  --f1:#E23B2E; --f2:#1F7AE0; --f3:#17A05C; --f4:#EF9F27;
  --skygge:0 4px 0 rgba(35,42,63,.9);
  --skygge-mjuk:0 4px 0 rgba(35,42,63,.18);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; overflow:hidden; }
body{
  font-family:'Nunito',system-ui,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,var(--himmel-1) 0%,var(--himmel-2) 55%,#e9f7ea 78%,var(--bakke) 100%);
  display:flex; flex-direction:column;
  height:100dvh;
  user-select:none; -webkit-user-select:none;
}

/* ---------- topnav ---------- */
.topnav{ background:var(--navy); padding:.45rem 1rem; flex:0 0 auto; }
.topnav-inner{ max-width:1600px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:1rem; }
.topnav-logo{
  font-family:'Fredoka One',cursive; font-size:1.05rem; color:var(--krem); text-decoration:none;
  display:flex; align-items:center; gap:.45rem; letter-spacing:.02em;
}
.topnav-logo::before{ content:"🪙"; }
.topnav-logo span{ font-family:'Nunito',sans-serif; font-weight:800; font-size:.75rem; color:var(--amber); text-transform:uppercase; letter-spacing:.12em; }
.topnav-back{
  font-size:.75rem; font-weight:900; color:var(--navy); text-decoration:none; text-transform:uppercase; letter-spacing:.08em;
  background:var(--amber); border:2px solid var(--navy); border-radius:999px; padding:.25rem .8rem;
}

/* ---------- lærerlinje ---------- */
.laererlinje{
  background:var(--krem); border:4px solid var(--navy); border-radius:20px;
  box-shadow:var(--skygge); margin:.55rem .6rem .2rem;
  padding:.55rem .8rem .65rem; flex:0 0 auto;
  display:flex; flex-direction:column; gap:.5rem; align-items:center;
}
.rad{ display:flex; gap:.4rem; align-items:center; justify-content:center; flex-wrap:wrap; }
.seg{ display:flex; background:var(--krem-dyp); border:3px solid var(--navy); border-radius:999px; padding:3px; gap:3px; }
.seg button{
  border:0; background:transparent; font-family:inherit; font-weight:900; font-size:.78rem;
  padding:.3rem .75rem; border-radius:999px; color:var(--navy); cursor:pointer; opacity:.65;
}
.seg button[aria-pressed="true"]{ background:var(--navy); color:var(--krem); opacity:1; }
.knapp{
  border:3px solid var(--navy); background:var(--krem-lys); border-radius:999px;
  font-family:inherit; font-weight:900; font-size:.78rem; padding:.28rem .7rem; cursor:pointer; color:var(--navy);
  display:inline-flex; align-items:center; gap:.35rem; box-shadow:0 3px 0 var(--navy);
  transition:transform .08s, box-shadow .08s;
}
.knapp:active{ transform:translateY(3px); box-shadow:0 0 0 var(--navy); }
.knapp:hover{ background:#fff; }
.knapp.primary{ background:var(--amber); color:var(--navy); }
.knapp.av{ opacity:.4; }
.knapp.skjult{ display:none; }

/* bokstaver i spill */
.bokstavlinje{ display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; justify-content:center; }
.btittel{ font-weight:900; font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--navy); }
.minik{
  font-family:inherit; font-weight:900; font-size:.72rem; color:var(--navy); cursor:pointer;
  background:var(--krem-lys); border:2px solid var(--navy); border-radius:999px;
  padding:.15rem .65rem; box-shadow:0 2px 0 var(--navy);
}
.minik:hover{ background:#fff; }
.ordtall{ font-weight:900; font-size:.75rem; color:var(--muted); }
.ordtall.tom{ color:var(--amber-dyp); }

.bokstavrad{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; max-width:1500px; }
.btast{
  position:relative; width:2.35rem; height:2.35rem; padding:0; cursor:pointer;
  border:3px solid var(--navy); background:var(--krem-lys); border-radius:.7rem;
  font-family:'Fredoka One',cursive; font-size:1.15rem; line-height:1; color:var(--navy);
  display:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 0 var(--navy);
  transition:opacity .15s, background .15s;
}
.btast:hover{ background:#fff; }
.btast[aria-pressed="true"]{ background:var(--amber); }
.btast[aria-pressed="false"]{ opacity:.4; }
.btast.tom{ opacity:.16; cursor:default; border-style:dashed; box-shadow:none; }
.btast .ant{
  position:absolute; top:-6px; right:-5px;
  font-family:'Nunito',sans-serif; font-weight:900; font-size:.6rem;
  background:var(--navy); color:var(--krem); border-radius:999px; padding:0 4px; min-width:1rem;
}
.btast[aria-pressed="false"] .ant{ background:var(--muted); }

/* ---------- scene ---------- */
.scene{ flex:1 1 auto; min-height:0; position:relative; padding:.6rem; }

/* tur for tur */
.tur{ height:100%; display:flex; flex-direction:column; gap:.5rem; }
.topplinje{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:clamp(.8rem,4vw,3rem); flex-wrap:wrap;
  background:var(--krem); border:4px solid var(--navy); border-radius:18px; box-shadow:var(--skygge-mjuk);
  padding:.35rem .9rem;
}
.oppdrag{
  font-family:'Fredoka One',cursive; font-size:clamp(.95rem,2vw,1.45rem); color:var(--navy);
  text-align:center; line-height:1.15;
}
.oppdrag em{ font-style:normal; color:var(--amber-dyp); }

.elevstripe{ display:flex; gap:.45rem; align-items:center; }
.elevmerke{
  width:46px; height:46px; border-radius:50%; background:var(--krem-lys);
  border:3px solid var(--navy); display:flex; align-items:center; justify-content:center;
  position:relative; opacity:.4; transition:transform .2s, opacity .2s;
}
.elevmerke img{ width:82%; height:82%; object-fit:contain; }
.elevmerke.aktiv{ opacity:1; transform:scale(1.18); box-shadow:0 3px 0 var(--navy); }
.elevmerke.ferdig{ opacity:1; }
.elevmerke.ferdig::after{ content:"✅"; position:absolute; right:-4px; bottom:-4px; font-size:1rem; }

/* teller 1-2-3 */
.teller{ display:flex; gap:.4rem; align-items:center; }
.tellerboks{
  width:34px; height:34px; border-radius:10px; background:var(--krem-lys);
  border:3px dashed var(--navy); display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden; opacity:.75;
}
.tellerboks.full{ border-style:solid; opacity:1; box-shadow:0 2px 0 var(--navy); }
.tellerboks .tallet{ font-family:'Fredoka One',cursive; font-size:1rem; color:var(--muted); }
.tellerboks .hake{ font-size:1.1rem; color:#fff; font-weight:900; text-shadow:0 1px 0 rgba(0,0,0,.3); }

.arena{
  flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; gap:clamp(.5rem,3vw,2.5rem);
  background:var(--krem); border:5px solid var(--navy); border-radius:26px; padding:.7rem;
  box-shadow:var(--skygge); position:relative;
}
.arena .heier{ position:absolute; left:1.5%; top:50%; transform:translateY(-50%); z-index:2;
  width:min(15vw,150px); display:flex; flex-direction:column; align-items:center; gap:.35rem; }
.arena .felt{ width:100%; height:100%; min-width:0; padding-left:min(17vw,168px); padding-right:.6rem;
  display:flex; align-items:center; justify-content:center; }

/* monster */
.monster{ width:100%; max-width:150px; filter:drop-shadow(0 6px 8px rgba(35,42,63,.22)); animation:bob 2.6s ease-in-out infinite; }
.monster.heia{ animation:heia .45s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-7px) } }
@keyframes heia{ 0%,100%{ transform:translateY(0) rotate(-4deg) } 50%{ transform:translateY(-12px) rotate(4deg) } }
.boble{
  background:var(--krem-lys); border:3px solid var(--navy); border-radius:16px; color:var(--navy);
  padding:.32rem .75rem; font-weight:900; font-size:clamp(.8rem,1.5vw,1.05rem); text-align:center;
  position:relative; max-width:100%; box-shadow:0 3px 0 var(--navy);
}
.boble::after{ content:""; position:absolute; bottom:-11px; left:50%; transform:translateX(-50%);
  border:8px solid transparent; border-top-color:var(--navy); }
.navn{
  font-family:'Fredoka One',cursive; font-size:clamp(.85rem,1.6vw,1.15rem); color:var(--navy)!important;
  background:var(--amber); border:3px solid var(--navy); border-radius:999px; padding:.05rem .7rem;
}

/* flere samtidig */
.grid4{ height:100%; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:1fr; gap:.6rem; }
.celle{
  background:var(--krem); border:4px solid var(--navy); border-radius:22px; box-shadow:var(--skygge);
  display:flex; flex-direction:column; align-items:center; gap:.3rem;
  padding:.5rem; min-height:0; min-width:0; position:relative; overflow:hidden;
}
.celle .heier{ flex:0 0 auto; width:100%; max-width:none;
  display:flex; flex-direction:row; align-items:center; justify-content:center; gap:.4rem; }
.celle .monster{ width:auto; max-width:none; height:clamp(38px,7vh,68px); }
.celle .navn{ font-size:clamp(.7rem,1.1vw,.9rem); border-width:2px; }
.celle .boble{ font-size:clamp(.68rem,1.05vw,.85rem); padding:.22rem .5rem; box-shadow:0 2px 0 var(--navy); }
.celle .boble::after{ bottom:auto; top:50%; left:auto; right:-11px;
  transform:translateY(-50%); border-top-color:transparent; border-left-color:var(--navy); }
.celle .felt{ flex:1 1 auto; width:100%; min-height:0; min-width:0; padding:.15rem .2rem .3rem; display:flex; align-items:center; justify-content:center; }
.celle.ferdig{ background:var(--krem-lys); }
.celle .elevnr{
  font-weight:900; font-size:clamp(.62rem,.95vw,.78rem); color:var(--navy)!important; text-transform:uppercase; letter-spacing:.08em;
  background:var(--krem-dyp); border:2px solid var(--navy); border-radius:999px; padding:.05rem .5rem;
}
.celle .teller{ flex:0 0 auto; }
.celle .tellerboks{ width:24px; height:24px; border-width:2px; border-radius:8px; }
.celle .tellerboks .tallet{ font-size:.78rem; }
.cellejubel{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  font-family:'Fredoka One',cursive; color:#fff; font-size:clamp(1rem,2.2vw,1.8rem);
  padding:.5rem 1.1rem; border-radius:18px; z-index:5; text-align:center;
  border:4px solid var(--navy);
  animation:sprett .45s cubic-bezier(.2,1.6,.4,1); box-shadow:0 5px 0 var(--navy);
}

/* ---------- oppgaveflate ---------- */
.oppgave{ width:100%; height:100%; min-height:0; display:flex; gap:clamp(.4rem,2vw,1.6rem); align-items:center; justify-content:center; }
.celle .oppgave{ flex-direction:column; gap:.5rem; justify-content:center; }

.bildeboks{
  flex:0 0 auto; position:relative;
  background:#f9f0d5; border:5px solid var(--navy); border-radius:22px;
  box-shadow:var(--skygge); overflow:hidden;
  height:min(100%, 42vh); aspect-ratio:1/1;
  display:flex; align-items:center; justify-content:center;
}
.celle .bildeboks{ height:46%; width:auto; max-width:94%; flex:0 0 auto; border-width:3px; border-radius:16px; box-shadow:0 3px 0 var(--navy); }
.bildeboks img{ width:100%; height:100%; object-fit:contain; display:block; }
.bildeboks .ordlyd{
  position:absolute; right:5px; bottom:5px; z-index:3;
  width:2.2rem; height:2.2rem; border-radius:50%; cursor:pointer;
  border:3px solid var(--navy); background:var(--amber); color:var(--navy);
  font-size:1.05rem; display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 0 var(--navy); padding:0;
}
.celle .bildeboks .ordlyd{ width:1.7rem; height:1.7rem; font-size:.85rem; border-width:2px; box-shadow:0 2px 0 var(--navy); }
.bildeboks .ordlyd:active{ transform:translateY(3px); box-shadow:0 0 0 var(--navy); }
.bildeboks .ordtekst{
  position:absolute; left:0; right:0; bottom:0; z-index:2; text-align:center;
  font-weight:900; font-size:clamp(.75rem,1.4vw,1rem); letter-spacing:.05em;
  background:rgba(35,42,63,.82); color:var(--krem); padding:.12rem 0;
}

.svarboks{ flex:1 1 auto; min-width:0; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.35rem; }
.celle .svarboks{ width:100%; flex:1 1 auto; min-height:0; }

/* skrivemodus */
.skriveflate{ flex:1 1 auto; width:100%; min-height:0; display:block; touch-action:none; }
.celle .skriveflate{ flex:1 1 auto; min-height:0; }
.skriveflate .hjelpelinje{ stroke:var(--navy-soft); stroke-width:1.2; opacity:.35; }
.skriveflate .hjelpelinje.stiplet{ stroke-dasharray:5 5; }
.skriveflate .modell{ fill:none; stroke:#e6dcc0; stroke-width:15; stroke-linecap:round; stroke-linejoin:round; }
.skriveflate .fasit{ fill:none; stroke:#c9b98d; stroke-width:15; stroke-linecap:round; stroke-linejoin:round;
  stroke-dasharray:var(--len); stroke-dashoffset:var(--len); }
.skriveflate .fasit.tegn{ animation:tegnStrek .9s ease forwards; }
@keyframes tegnStrek{ to{ stroke-dashoffset:0 } }
.skriveflate .blekk{ fill:none; stroke-width:14; stroke-linecap:round; stroke-linejoin:round; }
.skriveflate .blekklag{ transition:opacity .25s; }
.skriveflate .blekklag.dempet{ opacity:.18; }
.skriveflate .startmerke{ transition:opacity .3s; }
.skriveflate .hjelpemerke .prikk{ fill:var(--amber); stroke:var(--navy); stroke-width:2.5; }
.skriveflate .hjelpemerke .puls{ fill:none; stroke:var(--amber-dyp); stroke-width:2.5;
  transform-box:fill-box; transform-origin:center; animation:startpuls 1.7s ease-out infinite; }
@keyframes startpuls{ 0%{ transform:scale(1); opacity:.55 } 100%{ transform:scale(2.3); opacity:0 } }
.skriveflate .hjelpemerke .startpil{ fill:var(--navy); }
.skriveflate .startmerke circle{ fill:var(--amber); stroke:var(--navy); stroke-width:3; }
.skriveflate .startmerke text{ font-family:'Fredoka One',cursive; font-size:13px; fill:var(--navy); text-anchor:middle; dominant-baseline:central; }
.skriveflate .fasit{ stroke:#b7a473; }
.verktoy{ flex:0 0 auto; display:flex; gap:.6rem; justify-content:center; padding-top:.15rem; flex-wrap:wrap; }
.vknapp{
  font-family:inherit; font-weight:900; cursor:pointer; color:var(--navy);
  background:var(--krem-lys); border:3px solid var(--navy); border-radius:999px;
  display:inline-flex; align-items:center; gap:.35rem; box-shadow:0 3px 0 var(--navy);
  font-size:clamp(.8rem,1.5vw,1.05rem); padding:.35rem 1rem;
  transition:transform .08s, box-shadow .08s;
}
.vknapp:active{ transform:translateY(3px); box-shadow:0 0 0 var(--navy); }
.vknapp.ok{ background:var(--gronn); color:#fff; }
/* «Ferdig» puster når verktøyet ikke er sikkert nok til å godkjenne selv */
.vknapp.ok.venter{ animation:venter 1.5s ease-in-out infinite; }
@keyframes venter{ 0%,100%{ transform:none; box-shadow:0 3px 0 var(--navy) }
                   50%{ transform:translateY(-2px) scale(1.05); box-shadow:0 5px 0 var(--navy) } }
.celle .vknapp{ font-size:.75rem; padding:.25rem .6rem; border-width:2px; box-shadow:0 2px 0 var(--navy); }

/* trykkemodus */
.tastatur{ display:flex; flex-wrap:wrap; gap:.4rem; justify-content:center; align-content:center; width:100%; max-width:34rem; }
.tast{
  font-family:'Fredoka One',cursive; color:var(--navy); cursor:pointer;
  background:var(--krem-lys); border:3px solid var(--navy); border-radius:.8rem;
  box-shadow:0 4px 0 var(--navy); transition:transform .08s, box-shadow .08s, background .15s;
  width:clamp(2.8rem,5.6vw,4.6rem); height:clamp(2.8rem,5.6vw,4.6rem);
  font-size:clamp(1.3rem,2.9vw,2.4rem); display:inline-flex; align-items:center; justify-content:center; padding:0;
}
.tast:active{ transform:translateY(4px); box-shadow:0 0 0 var(--navy); }
.celle .tast{ width:clamp(1.9rem,3.2vw,2.6rem); height:clamp(1.9rem,3.2vw,2.6rem); font-size:clamp(.9rem,1.6vw,1.3rem); border-width:2px; box-shadow:0 3px 0 var(--navy); }
.tast.rett{ background:var(--gronn); color:#fff; }
.tast.feil{ background:var(--raud); color:#fff; opacity:.45; animation:rist .35s; }
.tast.hint{ background:var(--amber); }
@keyframes rist{ 0%,100%{ transform:translateX(0) } 25%{ transform:translateX(-6px) } 75%{ transform:translateX(6px) } }
.tastatur.laast .tast{ pointer-events:none; }

/* overlay / jubel */
.jubel{
  position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:.9rem; z-index:40; pointer-events:none;
}
.jubel.vis{ display:flex; }
.jubel .tekst{
  font-family:'Fredoka One',cursive; color:var(--amber); text-align:center; line-height:1.1;
  font-size:clamp(2.2rem,8vw,6rem);
  padding:.35rem 1.6rem; border-radius:26px; background:var(--navy); border:5px solid var(--navy);
  box-shadow:0 8px 0 rgba(35,42,63,.35);
  animation:sprett .5s cubic-bezier(.2,1.6,.4,1);
}
@keyframes sprett{ from{ transform:scale(.4); opacity:0 } to{ transform:scale(1); opacity:1 } }
.jubel .valg{ display:flex; gap:.6rem; pointer-events:auto; flex-wrap:wrap; justify-content:center; }
.jubel .valg button{
  font-family:'Fredoka One',cursive; font-size:clamp(1rem,2.4vw,1.6rem);
  border:4px solid var(--navy); border-radius:999px; padding:.5rem 1.6rem; cursor:pointer;
  background:var(--amber); color:var(--navy); box-shadow:0 5px 0 var(--navy);
}
.jubel .valg button:active{ transform:translateY(5px); box-shadow:0 0 0 var(--navy); }
.jubel .valg button.sek{ background:var(--krem-lys); color:var(--navy); }
#konfetti{ position:fixed; inset:0; pointer-events:none; z-index:60; }

/* skjult lærerlinje */
body.rent .topnav, body.rent .laererlinje{ display:none; }
.flytknapp{
  position:fixed; top:8px; right:8px; z-index:50; display:none;
  border:3px solid var(--navy); background:var(--krem); border-radius:999px; padding:.35rem .8rem;
  font-family:inherit; font-weight:900; color:var(--navy); cursor:pointer; box-shadow:0 3px 0 var(--navy);
}
body.rent .flytknapp{ display:block; }

@media (max-width:900px){
  .oppgave{ flex-direction:column; gap:.4rem; }
  .arena .heier{ width:20vw; }
  .arena .felt{ padding-left:min(22vw,150px); }
  .bildeboks{ height:auto; width:min(100%,32vh); }
}
@media (prefers-reduced-motion:reduce){
  .monster,.monster.heia,.jubel .tekst,.skriveflate .fasit.tegn,.skriveflate .hjelpemerke .puls,.vknapp.ok.venter{ animation:none !important; }
}
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a class="topnav-logo" href="begynneropplaering.html">Lydverkstedet <span>· Myntland</span></a>
    <a class="topnav-back" href="begynneropplaering.html">← Tilbake</a>
  </div>
</nav>

<div class="laererlinje">
  <div class="rad">
    <div class="seg" id="oppgavevelger">
      <button data-oppgave="forste" aria-pressed="true">🔤 Første lyd</button>
      <button data-oppgave="siste" aria-pressed="false">🔚 Siste lyd</button>
      <button data-oppgave="midt" aria-pressed="false">🅰️ Vokal i midten</button>
    </div>
    <div class="seg" id="modusvelger">
      <button data-modus="tur" aria-pressed="true">🙋 Tur for tur</button>
      <button data-modus="flere" aria-pressed="false">👥 Flere samtidig</button>

/* ============================================================
   BOKSTAVGJENKJENNER
   ------------------------------------------------------------
   $P Point-Cloud Recognizer (Vatavu, Anthony & Wobbrock 2012).
   Strekene eleven tegner gjøres om til en punktsky på 32 punkter,
   normaliseres og sammenlignes med maler.

   Hvorfor akkurat denne: den er blind for strekrekkefølge og
   strekretning. En elev som skriver E nedenfra og opp, eller lager
   tverrstreken i A først, får nøyaktig samme svar som en som gjør
   det «riktig». Det er avgjørende på 1. trinn.

   Vi vet dessuten alltid fasiten. Da slipper vi å gjette fritt
   blant 29 bokstaver – vi trenger bare å avgjøre om tegningen
   ligner nok på riktig bokstav. Mye enklere oppgave.

   Ingen data forlater maskina, og ingenting lastes ned.
   ============================================================ */

const P_N = 32;                    /* punkter i skya */
const P_STEG = 0.5;                /* epsilon i greedy-matchingen */

const pkt = (x, y, id) => ({ x, y, id });
const pAvstand = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

function pStiLengde(punkter){
  let d = 0;
  for (let i=1;i<punkter.length;i++) if (punkter[i].id === punkter[i-1].id) d += pAvstand(punkter[i-1], punkter[i]);
  return d;
}
function pRessample(inn, n){
  const punkter = inn.map(p => pkt(p.x, p.y, p.id));
  const I = pStiLengde(punkter) / (n - 1);
  if (!(I > 0)) return null;
  let D = 0;
  const ny = [punkter[0]];
  for (let i=1;i<punkter.length;i++){
    if (punkter[i].id !== punkter[i-1].id) continue;
    const d = pAvstand(punkter[i-1], punkter[i]);
    if (D + d >= I){
      const q = pkt(
        punkter[i-1].x + ((I - D) / d) * (punkter[i].x - punkter[i-1].x),
        punkter[i-1].y + ((I - D) / d) * (punkter[i].y - punkter[i-1].y),
        punkter[i].id);
      ny.push(q);
      punkter.splice(i, 0, q);
      D = 0;
    } else D += d;
  }
  const siste = punkter[punkter.length-1];
  while (ny.length < n) ny.push(pkt(siste.x, siste.y, siste.id));
  return ny.slice(0, n);
}
function pSkaler(punkter){
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (const p of punkter){
    if (p.x<minX) minX=p.x; if (p.x>maxX) maxX=p.x;
    if (p.y<minY) minY=p.y; if (p.y>maxY) maxY=p.y;
  }
  /* Samme skalering i begge retninger, ellers blir I like bred som O */
  const s = Math.max(maxX-minX, maxY-minY) || 1;
  return punkter.map(p => pkt((p.x-minX)/s, (p.y-minY)/s, p.id));
}
function pTilOrigo(punkter){
  let cx=0, cy=0;
  for (const p of punkter){ cx += p.x; cy += p.y; }
  cx /= punkter.length; cy /= punkter.length;
  return punkter.map(p => pkt(p.x-cx, p.y-cy, p.id));
}
function pNormaliser(punkter){
  const r = pRessample(punkter, P_N);
  return r ? pTilOrigo(pSkaler(r)) : null;
}
function pSkyAvstand(A, B, start){
  const n = A.length;
  const brukt = new Array(n).fill(false);
  let sum = 0, i = start;
  do {
    let indeks = -1, min = Infinity;
    for (let j=0;j<n;j++){
      if (brukt[j]) continue;
      const d = pAvstand(A[i], B[j]);
      if (d < min){ min = d; indeks = j; }
    }
    brukt[indeks] = true;
    sum += (1 - ((i - start + n) % n) / n) * min;
    i = (i + 1) % n;
  } while (i !== start);
  return sum;
}
/* Dekning: hvor godt finner HVERT punkt i A et punkt i B?
   pGreedy tar den snilleste av de to retningene, og da får en halvferdig
   bokstav for god score – alle punktene i en Λ ligger jo nær malen for A.
   Denne måler bare veien mal → tegning, og avslører derfor det som mangler. */
function pDekning(A, B){
  /* For hvert punkt i A: hvor langt er det til nærmeste punkt i B?
     Vi bruker 90-persentilen, ikke snittet. Snittet lar en manglende
     tverrstrek drukne blant alle punktene som treffer fint – persentilen
     ser den. Ikke maks heller, for da velter ett eneste rusk lasset. */
  const d = A.map(a => {
    let min = Infinity;
    for (const b of B){ const q = pAvstand(a, b); if (q < min) min = q; }
    return min;
  }).sort((x, y) => x - y);
  return d[Math.floor(0.9 * (d.length - 1))];
}
function pGreedy(A, B){
  const steg = Math.max(1, Math.floor(Math.pow(A.length, 1 - P_STEG)));
  let min = Infinity;
  for (let i=0;i<A.length;i+=steg){
    const a = pSkyAvstand(A, B, i), b = pSkyAvstand(B, A, i);
    if (a < min) min = a;
    if (b < min) min = b;
  }
  return min / P_N;   /* snittavstand per punkt – lettere å sette terskler på */
}

/* Hvor mye blekk gikk med, målt i forhold til hvor stor bokstaven er.
   En A uten tverrstrek har omtrent 80 % av blekket til en hel A. Dette
   er et grovt, men helt uavhengig mål på om noe mangler – det bryr seg
   ikke om form, bare om mengde. */
function blekkforhold(streker){
  let lengde = 0;
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (const strek of streker){
    for (let i=0;i<strek.length;i++){
      const q = strek[i];
      if (q.x<minX) minX=q.x; if (q.x>maxX) maxX=q.x;
      if (q.y<minY) minY=q.y; if (q.y>maxY) maxY=q.y;
      if (i) lengde += Math.hypot(q.x-strek[i-1].x, q.y-strek[i-1].y);
    }
  }
  /* Deler på den største av bredde og høyde – samme normalisering som
     punktskya bruker. Diagonalen ville gjort en smal, høy bokstav
     kunstig «blekkrik». */
  const str = Math.max(maxX-minX, maxY-minY) || 1;
  return lengde / str;
}

/* Har tegningen en kort, vannrett strek inni seg – tverrstreken i A, H, E, F, Æ, Å?
   Punktskya ser den nesten ikke: den er få punkter, og endene ligger uansett
   inntil bena. En A uten tverrstrek er derfor den ene ufullstendige bokstaven
   formsammenligningen ikke klarer å avsløre. Så vi leter etter streken selv. */
function harTverrstrek(streker){
  const alle = streker.flat();
  if (alle.length < 3) return false;
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (const q of alle){
    if (q.x<minX) minX=q.x; if (q.x>maxX) maxX=q.x;
    if (q.y<minY) minY=q.y; if (q.y>maxY) maxY=q.y;
  }
  const W = (maxX-minX) || 1, H = (maxY-minY) || 1;
  for (const strek of streker){
    if (strek.length < 2) continue;
    const a = strek[0], z = strek[strek.length-1];
    const korde = Math.hypot(z.x-a.x, z.y-a.y);
    if (korde < 0.18*W || korde > 1.02*W) continue;
    let len = 0;
    for (let i=1;i<strek.length;i++) len += Math.hypot(strek[i].x-strek[i-1].x, strek[i].y-strek[i-1].y);
    if (len > korde*1.4) continue;                 /* ikke rett nok */
    if (Math.abs(z.y-a.y) > 0.45*korde) continue;  /* ikke vannrett nok */
    const midtY = (a.y + z.y) / 2;
    /* skal ligge inni bokstaven, ikke være topp- eller bunnstreken i E og T */
    if (midtY < minY + 0.15*H || midtY > minY + 0.90*H) continue;
    return true;
  }
  return false;
}

/* ============================================================
   SKRIVEMÅTE – rekkefølge og retning
   ------------------------------------------------------------
   Punktskya over er med vilje blind for rekkefølge og retning, fordi den
   skal kjenne igjen bokstaven uansett hvordan eleven kom dit. Men HVORDAN
   bokstaven blir skrevet er ikke likegyldig: en E skrevet nedenfra og opp
   blir en treg håndskrift senere. Derfor sjekker vi det for seg, etter at
   vi vet hvilken bokstav det er.

   Fasiten er strekdataene fra Skriveverkstedet – samme rekkefølge og samme
   retning som eleven lærer der. Vi bruker bare den kanoniske formen til
   dette, ikke skrivevariantene, så det er Skriveverkstedet som bestemmer.
   ============================================================ */
const SM_K = 14;   /* punkter per strek i sammenligningen */

function smNormaliser(streker){
  const alle = streker.flat();
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (const q of alle){
    if (q.x<minX) minX=q.x; if (q.x>maxX) maxX=q.x;
    if (q.y<minY) minY=q.y; if (q.y>maxY) maxY=q.y;
  }
  const s = Math.max(maxX-minX, maxY-minY) || 1;
  return streker.map(st => st.map(q => ({ x:(q.x-minX)/s, y:(q.y-minY)/s })));
}
function smRessample(strek, k){
  const d = [0];
  let L = 0;
  for (let i=1;i<strek.length;i++){ L += Math.hypot(strek[i].x-strek[i-1].x, strek[i].y-strek[i-1].y); d.push(L); }
  if (!(L > 0)) return Array.from({length:k}, () => ({ x:strek[0].x, y:strek[0].y }));
  const ut = [];
  let j = 1;
  for (let i=0;i<k;i++){
    const mål = L * i / (k-1);
    while (j < d.length-1 && d[j] < mål) j++;
    const spenn = (d[j] - d[j-1]) || 1;
    const t = (mål - d[j-1]) / spenn;
    ut.push({ x: strek[j-1].x + t*(strek[j].x-strek[j-1].x),
              y: strek[j-1].y + t*(strek[j].y-strek[j-1].y) });
  }
  return ut;
}
const smSnitt = (A,B) => { let s=0; for (let i=0;i<A.length;i++) s += Math.hypot(A[i].x-B[i].x, A[i].y-B[i].y); return s/A.length; };
const smLukket = st => Math.hypot(st[st.length-1].x - st[0].x, st[st.length-1].y - st[0].y) < 0.18;

/* Sammenlign ett elevstrøk med ett malstrøk. For lukkede former (O, Ø, Q)
   prøver vi alle startpunkter, så «rundet feil vei» og «begynte feil sted»
   blir to forskjellige beskjeder. */
function smPar(a, b){
  const rev = b.slice().reverse();
  if (smLukket(a) && smLukket(b)){
    let bf = Infinity, bfSkift = 0, br = Infinity;
    for (let sk=0; sk<b.length; sk++){
      const rot  = b.slice(sk).concat(b.slice(0,sk));
      const rrot = rev.slice(sk).concat(rev.slice(0,sk));
      const d1 = smSnitt(a, rot);  if (d1 < bf){ bf = d1; bfSkift = Math.min(sk, b.length-sk) / b.length; }
      const d2 = smSnitt(a, rrot); if (d2 < br) br = d2;
    }
    return { d: Math.min(bf,br), reversert: br < bf - 0.004, skift: bf <= br ? bfSkift : 0, lukket:true };
  }
  const df = smSnitt(a,b), dr = smSnitt(a,rev);
  return { d: Math.min(df,dr), reversert: dr < df - 0.004, skift: 0, lukket:false };
}
function smPermutasjoner(n){
  if (n === 1) return [[0]];
  const ut = [];
  const gå = (rest, bygd) => {
    if (!rest.length){ ut.push(bygd); return; }
    rest.forEach((v,i) => gå(rest.slice(0,i).concat(rest.slice(i+1)), bygd.concat([v])));
  };
  gå(Array.from({length:n}, (_,i) => i), []);
  return ut;
}
function smRetningsmelding(malStrek, lukket){
  if (lukket) return "Riktig bokstav! Men du rundet feil vei – se her.";
  const a = malStrek[0], z = malStrek[malStrek.length-1];
  const dx = z.x - a.x, dy = z.y - a.y;
  if (Math.abs(dy) >= Math.abs(dx))
    return dy > 0 ? "Riktig bokstav! Men husk å starte øverst og dra streken nedover."
                  : "Riktig bokstav! Denne streken skal gå nedenfra og opp.";
  return dx > 0 ? "Riktig bokstav! Men husk å dra streken fra venstre mot høyre."
                : "Riktig bokstav! Denne streken skal gå fra høyre mot venstre.";
}

/* { ok, feil, melding } – feil: 'retning' | 'rekkefolge' | 'start'
   'antall' og 'usikker' betyr at vi ikke har grunnlag for å si noe, og
   da sier vi ingenting. Bedre å tie enn å rette på feil grunnlag. */
function sjekkSkrivemaate(streker, bokstav){
  const mal = MALSTREK && MALSTREK[bokstav];
  if (!mal || !streker.length) return { ok:true, feil:"ukjent" };
  if (streker.length !== mal.length) return { ok:true, feil:"antall" };
  if (mal.length > 6) return { ok:true, feil:"antall" };

  const t = smNormaliser(streker).map(st => smRessample(st, SM_K));
  const n = mal.length;
  let best = null;
  for (const perm of smPermutasjoner(n)){
    let sum = 0; const par = [];
    for (let i=0;i<n;i++){ const r = smPar(t[i], mal[perm[i]]); sum += r.d; par.push(r); }
    if (!best || sum < best.sum) best = { sum, perm, par };
  }
  if (best.sum / n > 0.14) return { ok:true, feil:"usikker" };

  const galRetning = best.par.findIndex(r => r.reversert);
  if (galRetning >= 0)
    return { ok:false, feil:"retning", strek:galRetning,
             melding: smRetningsmelding(mal[best.perm[galRetning]], best.par[galRetning].lukket) };

  if (!best.perm.every((v,i) => v === i))
    return { ok:false, feil:"rekkefolge", melding:"Riktig bokstav! Men husk rekkefølgen på strekene – se her." };

  if (best.par.findIndex(r => r.lukket && r.skift > 0.12) >= 0)
    return { ok:false, feil:"start", melding:"Riktig bokstav! Husk hvor du skal begynne – se her." };

  return { ok:true };
}

let MALER = null;          /* { bokstav: [sky, ...] } – oppreist */
let MALSTREK = null;       /* { bokstav: strøk i riktig rekkefølge og retning } */
let MALTVERR = null;       /* { bokstav: har malen en tverrstrek inni seg? } */
let MALBLEKK = null;       /* { bokstav: minste blekkforhold blant malene } */
let SPEILMALER = null;     /* { bokstav: [sky, ...] } – speilvendt */

function samplePunkter(strekliste){
  /* strekliste = array av path-d-strenger. Returnerer rå punkter med strek-id. */
  const svg = lagSvg("svg", { width:0, height:0, style:"position:absolute;left:-9999px;top:-9999px" });
  document.body.appendChild(svg);
  const ut = [];
  strekliste.forEach((d, id) => {
    const bane = lagSvg("path", { d });
    svg.appendChild(bane);
    const L = bane.getTotalLength();
    const antall = Math.max(4, Math.round(L / 3));
    for (let i=0;i<=antall;i++){
      const q = bane.getPointAtLength(L * i / antall);
      ut.push(pkt(q.x, q.y, id));
    }
  });
  svg.remove();
  return ut;
}
function speilvend(punkter){
  let minX=Infinity, maxX=-Infinity;
  for (const p of punkter){ if (p.x<minX) minX=p.x; if (p.x>maxX) maxX=p.x; }
  return punkter.map(p => pkt(minX + maxX - p.x, p.y, p.id));
}

function byggMaler(){
  MALER = {}; SPEILMALER = {}; MALBLEKK = {}; MALTVERR = {}; MALSTREK = {};
  ALFABET.forEach(b => {
    const former = [];
    if (GLYPHS[b]) former.push(GLYPHS[b].s);
    (ALLOGRAFER[b] || []).forEach(f => former.push(f));
    MALER[b] = []; SPEILMALER[b] = []; MALBLEKK[b] = Infinity; MALTVERR[b] = null;
    former.forEach(f => {
      const raa = samplePunkter(f);
      const sky = pNormaliser(raa);
      if (sky) MALER[b].push(sky);
      const speil = pNormaliser(speilvend(raa));
      if (speil) SPEILMALER[b].push(speil);
      /* grupper råpunktene tilbake i strøk for å måle blekkmengden */
      const grupper = [];
      raa.forEach(q => { (grupper[q.id] = grupper[q.id] || []).push(q); });
      const strøk = grupper.filter(Boolean);
      MALBLEKK[b] = Math.min(MALBLEKK[b], blekkforhold(strøk));
      /* Bare hvis ALLE skrivemåtene har den – Z har en variant med
         midtstrek, men de fleste skriver Z uten, så Z skal ikke kreve den. */
      const har = harTverrstrek(strøk);
      MALTVERR[b] = MALTVERR[b] === null ? har : (MALTVERR[b] && har);
      /* Skrivemåten dømmes bare mot den kanoniske formen fra Skriveverkstedet */
      if (f === former[0]) MALSTREK[b] = smNormaliser(strøk).map(st => smRessample(st, SM_K));
    });
  });
}

/* ---------- Elevens egne godkjente forsøk ----------
   Når læreren trykker «✓ Godkjenn» på noe gjenkjenneren var usikker på,
   husker vi formen på denne maskina. Da blir den gradvis bedre kjent med
   akkurat denne klassens håndskrift. Ingenting sendes noe sted. */
const LAERT_NOKKEL = "myntland-lydverkstedet-laert-v1";
const LAERT_MAKS = 6;
let LAERT = {};
function lastLaert(){
  try { LAERT = JSON.parse(localStorage.getItem(LAERT_NOKKEL) || "{}") || {}; } catch(e){ LAERT = {}; }
}
function lagreLaert(bokstav, sky){
  try {
    if (!LAERT[bokstav]) LAERT[bokstav] = [];
    LAERT[bokstav].push(sky.map(p => [Math.round(p.x*1000)/1000, Math.round(p.y*1000)/1000]));
    if (LAERT[bokstav].length > LAERT_MAKS) LAERT[bokstav].shift();
    localStorage.setItem(LAERT_NOKKEL, JSON.stringify(LAERT));
  } catch(e){}
}
function laerteSkyer(bokstav){
  return (LAERT[bokstav] || []).map(a => a.map(([x,y],i) => pkt(x, y, i)));
}
function glemLaert(){
  LAERT = {};
  try { localStorage.removeItem(LAERT_NOKKEL); } catch(e){}
}

/* ---------- Formtrekk ----------
   Ringen i Å, skråstreken i Ø og bredden på Æ utgjør en liten del av
   punktskya, så $P alene forveksler dem lett med A og O. Vi ser derfor
   etter dem direkte, og justerer avstanden opp eller ned deretter.
   Justeringen er et dytt, ikke et veto – en elev som tegner Ø i ett
   sammenhengende drag skal fortsatt få den godkjent. */
function formtrekk(streker){
  const alle = streker.flat();
  if (alle.length < 3) return null;
  let minX=Infinity, maxX=-Infinity, minY=Infinity, maxY=-Infinity;
  for (const q of alle){
    if (q.x<minX) minX=q.x; if (q.x>maxX) maxX=q.x;
    if (q.y<minY) minY=q.y; if (q.y>maxY) maxY=q.y;
  }
  const W = (maxX-minX) || 1, H = (maxY-minY) || 1, D = Math.max(W,H);
  const midtX = (minX+maxX)/2, midtY = (minY+maxY)/2;
  let topptegn = false, skraastrek = false;

  streker.forEach((strek, i) => {
    if (strek.length < 2 || streker.length < 2) return;
    let bminX=Infinity, bmaxX=-Infinity, bminY=Infinity, bmaxY=-Infinity;
    for (const q of strek){
      if (q.x<bminX) bminX=q.x; if (q.x>bmaxX) bmaxX=q.x;
      if (q.y<bminY) bminY=q.y; if (q.y>bmaxY) bmaxY=q.y;
    }
    /* eget lite merke som ligger fritt oppe – ringen i Å */
    if (bmaxY < minY + 0.42*H && (bmaxX-bminX) < 0.55*W && (bmaxY-bminY) < 0.42*H){
      const fritt = streker.every((annen, j) => j === i || annen.every(q =>
        q.x < bminX-0.02*W || q.x > bmaxX+0.02*W || q.y < bminY-0.02*H || q.y > bmaxY+0.02*H));
      if (fritt) topptegn = true;
    }
    /* nesten rett strek tvers gjennom midten – skråstreken i Ø */
    const korde = Math.hypot(strek[strek.length-1].x-strek[0].x, strek[strek.length-1].y-strek[0].y);
    let len = 0;
    for (let k=1;k<strek.length;k++) len += Math.hypot(strek[k].x-strek[k-1].x, strek[k].y-strek[k-1].y);
    if (korde > 0.5*D && len < korde*1.35 &&
        Math.abs((bminX+bmaxX)/2 - midtX) < 0.22*W &&
        Math.abs((bminY+bmaxY)/2 - midtY) < 0.22*H) skraastrek = true;
  });
  return { forhold: W/H, topptegn, skraastrek };
}
function straff(bokstav, t){
  if (!t) return 1;
  if (bokstav === "Å") return t.topptegn   ? 0.95 : 1.45;
  if (bokstav === "A") return t.topptegn   ? 1.25 : 1;
  if (bokstav === "Ø") return t.skraastrek ? 0.95 : 1.40;
  if (bokstav === "O") return t.skraastrek ? 1.30 : 1;
  if (bokstav === "Æ") return t.forhold >= 1.05 ? 0.95 : (t.forhold < 0.85 ? 1.45 : 1);
  return 1;
}

/* ---------- Selve vurderingen ---------- */

/* Kalibrert mot måleoppsettet: avstanden til riktig bokstav ligger under
   0.057 i 99 % av ærlige forsøk (største målte 0.074), mens rene rablerier
   aldri kom under 0.053. Taket på 0.080 slipper altså gjennom alt som ligner
   en bokstav, og sender krusedullene til læreren.
     tak      – største avstand som i det hele tatt vurderes som en bokstav
     rang     – hvor langt ned på lista riktig bokstav får ligge
     margin   – hvor mye bedre en annen bokstav må være før vi sier
                «jeg leste en X» i stedet for å spørre læreren
     speiltak – samme tak for speilvendt skrift */
const TERSKEL = {
  mild:   { tak:0.080, rang:3, margin:0.75, speiltak:0.075 },
  /* «streng» krever i tillegg at bokstaven er hel: en A uten tverrstrek
     eller en E uten midtstrek går til læreren i stedet for å godkjennes. */
  streng: { tak:0.058, rang:1, margin:0.85, speiltak:0.055, dekning:0.150, blekk:0.85 },
  /* Andresjansen til automatikken. Kravet om at bokstaven skal være HEL er
     like strengt, men den trenger ikke lenger være aller nærmest – det holder
     å være blant de to nærmeste. Måling på 460 hele og 355 ufullstendige:
     «nærmest» slår til på 85,4 % og slipper 2,8 %; «blant de to» slår til på
     92,0 % og slipper 3,7 %. Seks og et halvt prosentpoeng flere elever
     slipper å lete etter en knapp, for under ett prosentpoeng mer lekkasje. */
  auto2:  { tak:0.070, rang:2, margin:0.85, speiltak:0.065, dekning:0.150, blekk:0.85 }
};

function beste(sky, bokstav){
  let min = Infinity;
  const kandidater = MALER[bokstav].concat(laerteSkyer(bokstav));
  for (const mal of kandidater){ const d = pGreedy(sky, mal); if (d < min) min = d; }
  return min;
}
function besteDekning(sky, bokstav){
  let min = Infinity;
  for (const mal of MALER[bokstav].concat(laerteSkyer(bokstav))){
    const d = pDekning(mal, sky); if (d < min) min = d;
  }
  return min;
}
function besteSpeil(sky, bokstav){
  let min = Infinity;
  for (const mal of SPEILMALER[bokstav]){ const d = pGreedy(sky, mal); if (d < min) min = d; }
  return min;
}

/* Returnerer { status, lest, sky, skaarFasit, skaarBeste }
   status: 'rett' | 'speil' | 'feil' | 'usikker' | 'tomt'            */
function vurder(streker, fasit, niva){
  const T = TERSKEL[niva] || TERSKEL.mild;
  const raa = [];
  streker.forEach((s, id) => s.forEach(p => raa.push(pkt(p.x, p.y, id))));
  if (raa.length < 4 || pStiLengde(raa) < 25) return { status:"tomt" };

  const sky = pNormaliser(raa);
  if (!sky) return { status:"tomt" };

  /* rangér alle bokstaver */
  const trekk = formtrekk(streker);
  const rangering = ALFABET.map(b => ({ b, d: beste(sky, b) * straff(b, trekk) })).sort((x,y) => x.d - y.d);
  const skaarFasit = rangering.find(r => r.b === fasit).d;
  const plass = rangering.findIndex(r => r.b === fasit) + 1;
  const topp = rangering[0];

  /* er bokstaven hel? bare «streng» bryr seg */
  const helOk = T.dekning == null ||
    (besteDekning(sky, fasit) <= T.dekning &&
     (!T.blekk || !MALBLEKK[fasit] || blekkforhold(streker) / MALBLEKK[fasit] >= T.blekk));

  if (plass <= T.rang && skaarFasit <= T.tak && helOk)
    return { status:"rett", lest:fasit, sky, skaarFasit, skaarBeste:topp.d, plass };

  /* riktig form, men noe mangler – da er det læreren som avgjør */
  if (plass <= T.rang && skaarFasit <= T.tak && !helOk)
    return { status:"usikker", lest:fasit, sky, skaarFasit, skaarBeste:topp.d, plass, ufullstendig:true };

  /* riktig bokstav, men skrevet speilvendt? */
  const speil = besteSpeil(sky, fasit) * straff(fasit, trekk);
  if (speil <= T.speiltak && speil < skaarFasit && speil <= topp.d * 1.05)
    return { status:"speil", lest:fasit, sky, skaarFasit:speil, skaarBeste:topp.d, plass };

  /* tydelig en annen bokstav – bare hvis den er klart bedre enn fasiten */
  if (topp.d <= T.tak && topp.d < skaarFasit * T.margin)
    return { status:"feil", lest:topp.b, sky, skaarFasit, skaarBeste:topp.d, plass };

  return { status:"usikker", lest:topp.b, sky, skaarFasit, skaarBeste:topp.d, plass };
}

/* ---------- Lyd ---------- */
let lydPaa = true, ac = null;
function lydKontekst(){
  if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
  if (ac && ac.state === "suspended") ac.resume();
  return ac;
}
function tone(freq, tid=0.12, type="sine", vol=0.15, forsink=0){
  if (!lydPaa) return;
  const k = lydKontekst(); if (!k) return;
  const o = k.createOscillator(), g = k.createGain();
  o.type = type; o.frequency.value = freq;
  const t0 = k.currentTime + forsink;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + tid);
  o.connect(g); g.connect(k.destination); o.start(t0); o.stop(t0 + tid + 0.05);
}
const lydStrek   = () => tone(880, 0.12, "triangle", 0.12);
const lydRunde   = () => [660,880].forEach((f,i)=>tone(f,0.14,"triangle",0.13,i*0.09));

const lydFanfare = () => [523,659,784,1047,1319,1047,1319].forEach((f,i)=>tone(f,0.24,"triangle",0.15,i*0.11));

/* ---------- Innlest tale (mp3) ----------
   Ligger i /lyd/ ved siden av denne sida. Æ/Ø/Å har ASCII-filnavn
   (AE/OE/AA) så serveren slipper tegnsett-trøbbel. Ordene heter ord-<fil>.mp3. */
const LYDSTI  = "lyd/";
const FILNAVN = { "Æ":"AE", "Ø":"OE", "Å":"AA" };
const REPLIKKER = [
  "hvilken-forst","hvilken-sist","hvilken-midt",   /* nye – leses inn */
  "riktig","proev-igjen",                          /* nye – leses inn */
  "bokstaven","din-tur","neste-elev","alle-sammen" /* fins alt i /lyd/ */
];

const lydLager = new Map();
let taleNr = 0, spillerNaa = null;

function hentLyd(navn){
  let a = lydLager.get(navn);
  if (!a){ a = new Audio(LYDSTI + navn + ".mp3"); a.preload = "auto"; lydLager.set(navn, a); }
  return a;
}
function forbered(...navn){ navn.forEach(n => { try { hentLyd(n).load(); } catch(e){} }); }
function stoppTale(){
  taleNr++;
  if (spillerNaa){ try { spillerNaa.pause(); spillerNaa.currentTime = 0; } catch(e){} spillerNaa = null; }
}
/* si("hvilken-forst","ord-sol") spiller filene etter hverandre.
   Ny si() avbryter den forrige, og en fil som mangler hopper vi bare over. */
function si(...navn){
  if (!lydPaa || !navn.length) return;
  stoppTale();
  const mitt = taleNr;
  const kjoer = i => {
    if (i >= navn.length || mitt !== taleNr) return;
    const a = hentLyd(navn[i]);
    let brukt = false;
    const videre = () => {
      if (brukt) return;
      brukt = true;
      a.removeEventListener("ended", videre);
      a.removeEventListener("error", videre);
      if (mitt === taleNr) kjoer(i + 1);
    };
    a.addEventListener("ended", videre);
    a.addEventListener("error", videre);
    try { a.currentTime = 0; } catch(e){}
    spillerNaa = a;
    const p = a.play();
    if (p && p.catch) p.catch(videre);
  };
  kjoer(0);
}
const bokstavFil = ch => FILNAVN[ch] || ch;
const siOrd      = o  => si("ord-" + o.fil);
const siOppgave  = o  => si(OPPGAVER[app.oppgave].lyd, "ord-" + o.fil);
const siBokstav  = ch => si("bokstaven", bokstavFil(ch));

/* ---------- Tidsutløsere som hører til runden ----------
   Overgangene («neste elev», «nytt ord») ligger på setTimeout. Trykker
   læreren «Start på nytt» eller «Neste ord» midt i en overgang, må de
   gamle utløserne dø – ellers bygger de om scenen etterpå og visker ut
   det eleven holder på med. */
let rundeTimere = [];
function senere(fn, ms){ const t = setTimeout(() => { rundeTimere = rundeTimere.filter(x => x !== t); fn(); }, ms); rundeTimere.push(t); return t; }
function stoppTimere(){ rundeTimere.forEach(clearTimeout); rundeTimere = []; }

/* ---------- Konfetti ---------- */
const kanvas = $("#konfetti"), ktx = kanvas.getContext("2d");
let biter = [], konfettiKjorer = false;
function skalerKanvas(){
  const d = window.devicePixelRatio || 1;
  kanvas.width = innerWidth * d; kanvas.height = innerHeight * d;
  kanvas.style.width = innerWidth + "px"; kanvas.style.height = innerHeight + "px";
  ktx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener("resize", skalerKanvas); skalerKanvas();
const KONFETTIFARGER = ["#E23B2E","#1F7AE0","#17A05C","#EF9F27","#534AB7","#D85A30","#ff6fb5","#25c7c7"];
function konfetti(x, y, antall=90, fart=1){
  for (let i=0;i<antall;i++){
    const v = (Math.random()*7+3)*fart, a = Math.random()*Math.PI*2;
    biter.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 4,
      st:Math.random()*8+5, f:tilfeldig(KONFETTIFARGER),
      r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.4, liv:1 });
  }
  if (!konfettiKjorer){ konfettiKjorer = true; requestAnimationFrame(tegnKonfetti); }
}
function storKonfetti(){
  const b = innerWidth, h = innerHeight;
  konfetti(b*0.2, h*0.45, 110, 1.3); konfetti(b*0.8, h*0.45, 110, 1.3);
  konfetti(b*0.5, h*0.35, 140, 1.5);
  setTimeout(()=>{ konfetti(b*0.35,h*0.5,90,1.2); konfetti(b*0.65,h*0.5,90,1.2); }, 260);
}
function tegnKonfetti(){
  ktx.clearRect(0,0,innerWidth,innerHeight);
  biter = biter.filter(p => p.liv > 0 && p.y < innerHeight + 60);
  for (const p of biter){
    p.vy += 0.22; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.r += p.vr; p.liv -= 0.004;
    ktx.save(); ktx.translate(p.x, p.y); ktx.rotate(p.r); ktx.globalAlpha = Math.max(0, Math.min(1, p.liv*1.6));
    ktx.fillStyle = p.f; ktx.fillRect(-p.st/2, -p.st/2, p.st, p.st*0.6); ktx.restore();
  }
  if (biter.length){ requestAnimationFrame(tegnKonfetti); }
  else { konfettiKjorer = false; ktx.clearRect(0,0,innerWidth,innerHeight); }
}

function fasit(o){ return o[OPPGAVER[app.oppgave].felt]; }
function utvalg(){
  const f = OPPGAVER[app.oppgave].felt;
  return ORD.filter(o => o[f] && app.aktive.has(o[f]));
}
function fyllKo(){
  app.ko = bland(utvalg());
  if (!app.ko.length) app.ko = bland(ORD.filter(o => o[OPPGAVER[app.oppgave].felt]));
}
function nesteOrd(unnta){
  if (!app.ko.length) fyllKo();
  let o = app.ko.shift();
  /* to like ord ved siden av hverandre ser rart ut når fire elever jobber samtidig */
  if (unnta && unnta.length > 1 && unnta.includes(o) && app.ko.length){
    const bytt = app.ko.findIndex(x => !unnta.includes(x));
    if (bytt >= 0){ app.ko.push(o); o = app.ko.splice(bytt,1)[0]; }
  }
  return o;
}

/* ============================================================
   SKRIVEFLATE – tomt skrivefelt med hjelpelinjer,
   valgfri svak modell og «Vis meg»-animasjon
   ============================================================ */
const FLATE_B = 240, FLATE_H = 140;

function lagSkriveflate(vert, ord, farge, valg){
  const svar = fasit(ord);
  const g = GLYPHS[svar] || GLYPHS["A"];

  const boks = document.createElement("div");
  boks.className = "flateboks svarboks";

  const svg = lagSvg("svg", { class:"skriveflate", viewBox:`0 0 ${FLATE_B} ${FLATE_H}`, preserveAspectRatio:"xMidYMid meet" });

  /* hjelpelinjer: topp – x-høyde – skrivelinje – nedheng */
  [[10,"stiplet"],[45,"stiplet"],[90,""],[120,"stiplet"]].forEach(([y,kl]) => {
    svg.appendChild(lagSvg("line", { class:"hjelpelinje " + kl, x1:6, x2:FLATE_B-6, y1:y, y2:y }));
  });

  const midt = lagSvg("g", { transform:`translate(${(FLATE_B - g.w)/2},0)` });
  svg.appendChild(midt);

  /* svak modell (av som standard – ellers røper den svaret) */
  const modell = lagSvg("g", { class:"modellag" });
  g.s.forEach(d => modell.appendChild(lagSvg("path", { class:"modell", d })));
  modell.style.display = (app.modell === "full") ? "" : "none";
  midt.appendChild(modell);

  /* fasit som tegnes når læreren trykker «Vis meg» */
  const fasitlag = lagSvg("g", { class:"fasitlag" });
  fasitlag.style.display = "none";
  midt.appendChild(fasitlag);

  /* Startpunktene ligger UNDER blekket, så elevens egen strek dekker dem
     etter hvert som hen skriver – akkurat som prikkene i Skriveverkstedet. */
  const hjelpelag = lagSvg("g", { class:"hjelpelag", transform:`translate(${(FLATE_B - g.w)/2},0)` });
  svg.appendChild(hjelpelag);

  const blekk = lagSvg("g", { class:"blekklag" });
  svg.appendChild(blekk);

  /* Startprikkene skal ligge ØVERST, ellers forsvinner de bak elevens
     eget blekk. Egen gruppe etter blekket, med samme forskyvning som malen. */
  const merkelag = lagSvg("g", { class:"merkelag", transform:`translate(${(FLATE_B - g.w)/2},0)` });
  svg.appendChild(merkelag);

  boks.appendChild(svg);

  const verktoy = document.createElement("div");
  verktoy.className = "verktoy";
  const viskKnapp = document.createElement("button");
  viskKnapp.className = "vknapp"; viskKnapp.type = "button"; viskKnapp.innerHTML = "↺ Viske";
  const ferdigKnapp = document.createElement("button");
  ferdigKnapp.className = "vknapp ok"; ferdigKnapp.type = "button"; ferdigKnapp.innerHTML = "✓ Ferdig";
  verktoy.appendChild(viskKnapp); verktoy.appendChild(ferdigKnapp);
  boks.appendChild(verktoy);

  /* Startpunkt: én markør der bokstaven begynner – prikk med retningspil.
     Vi viser bare første strøk. Eleven trenger å vite hvor blyanten settes,
     ikke rekkefølgen på strøk 2 og 3. */
  function byggStartpunkt(){
    hjelpelag.innerHTML = "";
    const maal = lagSvg("svg", { width:0, height:0, style:"position:absolute;left:-9999px;top:-9999px" });
    document.body.appendChild(maal);

    let st = null;
    const d0 = g.s[0];
    if (d0){
      const bane = lagSvg("path", { d:d0 });
      maal.appendChild(bane);
      try {
        const L = bane.getTotalLength();
        const s0 = bane.getPointAtLength(0);
        const s1 = bane.getPointAtLength(Math.min(18, L * 0.35));
        st = { x:s0.x, y:s0.y, vinkel: Math.atan2(s1.y-s0.y, s1.x-s0.x) * 180 / Math.PI };
      } catch(e){}
    }
    maal.remove();

    if (st){
      const merke = lagSvg("g", { class:"hjelpemerke" });
      merke.appendChild(lagSvg("path", { class:"startpil", d:"M0,-5 L11,0 L0,5 Z",
        transform:`translate(${st.x},${st.y}) rotate(${st.vinkel}) translate(12,0)` }));
      merke.appendChild(lagSvg("circle", { class:"puls", cx:st.x, cy:st.y, r:9 }));
      merke.appendChild(lagSvg("circle", { class:"prikk", cx:st.x, cy:st.y, r:9 }));
      hjelpelag.appendChild(merke);
    }
    hjelpelag.style.display = (app.modell === "av") ? "none" : "";
  }
  byggStartpunkt();

  vert.appendChild(boks);

  /* --- tegning --- */
  let strek = null, punkter = [], sisteSky = null, bomTeller = 0;
  const strekListe = [];
  const punkt = e => {
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const m = svg.getScreenCTM(); if (!m) return { x:0, y:0 };
    const q = p.matrixTransform(m.inverse());
    return { x:q.x, y:q.y };
  };
  const start = e => {
    if (boks.dataset.laast) return;
    stoppAuto();
    e.preventDefault();
    svg.setPointerCapture(e.pointerId);
    punkter = [punkt(e)];
    strek = lagSvg("path", { class:"blekk", stroke:farge, d:`M${punkter[0].x},${punkter[0].y}` });
    blekk.appendChild(strek);
    valg.paaTegning?.(true);
  };
  const flytt = e => {
    if (!strek) return;
    e.preventDefault();
    const p = punkt(e);
    const s = punkter[punkter.length-1];
    if (Math.hypot(p.x-s.x, p.y-s.y) < 1.2) return;
    punkter.push(p);
    strek.setAttribute("d", strek.getAttribute("d") + ` L${p.x},${p.y}`);
  };
  const slutt = () => {
    if (!strek) return;
    strek = null;
    if (punkter.length > 1) strekListe.push(punkter.slice());
    valg.paaTegning?.(false);
    lydStrek();
    valg.paaStrek?.();
    planleggAuto();
  };
  svg.addEventListener("pointerdown", start);
  svg.addEventListener("pointermove", flytt);
  svg.addEventListener("pointerup", slutt);
  svg.addEventListener("pointercancel", slutt);
  svg.addEventListener("pointerleave", slutt);

  const visk = () => { stoppAuto(); blekk.innerHTML = ""; strekListe.length = 0; };
  viskKnapp.addEventListener("click", visk);

  function visFasit(medNummer){
    fasitlag.innerHTML = "";
    merkelag.innerHTML = "";
    fasitlag.style.display = "";
    /* demp elevens strek så modellen og tallene er til å se */
    if (medNummer) blekk.classList.add("dempet");
    g.s.forEach((d, i) => {
      const bane = lagSvg("path", { class:"fasit", d });
      fasitlag.appendChild(bane);
      const len = bane.getTotalLength ? bane.getTotalLength() : 300;
      bane.style.setProperty("--len", len);
      setTimeout(() => bane.classList.add("tegn"), i * 500);
      /* nummerert startprikk – samme språk som Skriveverkstedet bruker */
      if (medNummer && bane.getPointAtLength){
        const s0 = bane.getPointAtLength(0);
        const merke = lagSvg("g", { class:"startmerke" });
        merke.style.opacity = "0";
        merke.appendChild(lagSvg("circle", { cx:s0.x, cy:s0.y, r:11 }));
        const tekst = lagSvg("text", { x:s0.x, y:s0.y });
        tekst.textContent = i + 1;
        merke.appendChild(tekst);
        merkelag.appendChild(merke);
        /* Ett tall om gangen, i takt med streken som tegnes. Flere bokstaver
           starter to strøk på samme punkt (E og A gjør det), så tallene ville
           ligget oppå hverandre om vi lot dem bli stående. */
        setTimeout(() => {
          merkelag.querySelectorAll(".startmerke").forEach(m => { m.style.opacity = "0"; });
          merke.style.opacity = "1";
        }, i * 500);
      }
    });
    setTimeout(() => {
      fasitlag.style.display = "none"; fasitlag.innerHTML = "";
      merkelag.innerHTML = "";
      blekk.classList.remove("dempet");
    }, 900 + g.s.length*500 + 1400);
  }

  /* Bokstaven er riktig – men ble den skrevet riktig vei? */
  function godkjennMedSkrivemaate(){
    if (app.skrivemaate === "av"){ godkjenn(); return; }
    const sm = sjekkSkrivemaate(strekListe, svar);
    if (sm.ok){ godkjenn(); return; }
    if (app.skrivemaate === "hint"){
      valg.paaMelding?.(sm.melding);
      visFasit(true);
      godkjenn(2900);
      return;
    }
    /* krav: svaret godtas ikke før bokstaven er skrevet riktig vei */
    bomTeller++;
    lydFeil();
    if (bomTeller < 3){
      valg.paaMelding?.(sm.melding);
      visk();
      visFasit(true);
      return;
    }
    laererValg(sm.melding.replace("– se her.", "").replace("se her.", "").trim() + " Hva sier du?");
  }

  function godkjenn(forsink){
    if (boks.dataset.laast || !boks.isConnected) return;
    boks.dataset.laast = "1";
    stoppAuto();
    verktoy.style.visibility = "hidden";
    if (forsink) senere(() => { if (boks.isConnected) valg.paaFerdig?.(); }, forsink);
    else valg.paaFerdig?.();
  }

  /* Eleven skal slippe å lete etter en knapp: legger hen fra seg pennen
     og bokstaven er tydelig riktig, godkjenner vi av oss selv.

     To trinn. Først et strengt forsøk der bokstaven må være aller nærmest
     av alle 29. Slår det ikke til, venter vi litt til – har eleven fortsatt
     ikke rørt pennen, er hen nokså sikkert ferdig, og da holder det at
     bokstaven er blant de to nærmeste. Kravet om at bokstaven skal være HEL
     er like strengt i begge trinn, så en halvskrevet A slipper ikke gjennom.

     Er vi fortsatt i tvil, sier vi fra i stedet for å tie: «Ferdig» begynner
     å puste. Stillhet leses som at verktøyet har hengt seg opp.

     Pausene: 1,6 sekund er lenger enn pausen mellom to strøk i samme bokstav,
     men kort nok til å oppleves umiddelbart. Selve pausen er det beste
     signalet vi har på at eleven mener seg ferdig – bedre enn noen
     geometrisjekk. */
  const AUTO_PAUSE_1 = 1600;
  const AUTO_PAUSE_2 = 1800;
  let autoTimer = null;
  function stoppAuto(){
    if (autoTimer){ clearTimeout(autoTimer); autoTimer = null; }
    ferdigKnapp.classList.remove("venter");
  }
  /* true = ferdig behandlet (godkjent eller flata er borte), false = prøv igjen senere */
  function proevAuto(niva){
    if (boks.dataset.laast || !boks.isConnected) return true;
    /* Mangler tverrstreken? Da er eleven trolig ikke ferdig – vent i stillhet. */
    if (MALTVERR[svar] && !harTverrstrek(strekListe)) return false;
    const dom = vurder(strekListe, svar, niva);
    if (dom.status === "rett"){ godkjennMedSkrivemaate(); return true; }
    if (dom.status === "speil"){
      valg.paaMelding?.("Riktig bokstav! Den snur andre veien – se her.");
      visFasit(true);
      godkjenn(2400);
      return true;
    }
    return false;
  }
  function planleggAuto(){
    stoppAuto();
    if (app.retting === "av" || boks.dataset.laast) return;
    autoTimer = setTimeout(() => {
      autoTimer = null;
      if (proevAuto("streng")) return;
      autoTimer = setTimeout(() => {
        autoTimer = null;
        if (proevAuto("auto2")) return;
        if (!boks.dataset.laast && boks.isConnected) ferdigKnapp.classList.add("venter");
      }, AUTO_PAUSE_2);
    }, AUTO_PAUSE_1);
  }
  function blinkBlekk(){
    blekk.querySelectorAll("path").forEach(p => {
      if (!p.dataset.farge) p.dataset.farge = p.getAttribute("stroke");
      p.setAttribute("stroke", "#e8473f");
    });
  }
  /* Gjenkjenneren er usikker – da er det læreren som bestemmer, ikke maskina */
  function laererValg(tekst){
    stoppAuto();
    verktoy.innerHTML = "";
    const ja = document.createElement("button");
    ja.className = "vknapp ok"; ja.type = "button"; ja.textContent = "✓ Godkjenn";
    const nei = document.createElement("button");
    nei.className = "vknapp"; nei.type = "button"; nei.textContent = "↺ Prøv igjen";
    ja.addEventListener("click", () => {
      if (sisteSky) lagreLaert(svar, sisteSky);   /* husk formen til neste gang */
      godkjenn();
    });
    nei.addEventListener("click", () => {
      visk();
      verktoy.innerHTML = "";
      verktoy.appendChild(viskKnapp); verktoy.appendChild(ferdigKnapp);
      valg.paaMelding?.(tilfeldig(HEIAROP));
    });
    verktoy.appendChild(ja); verktoy.appendChild(nei);
    valg.paaMelding?.(tekst);
  }

  ferdigKnapp.addEventListener("click", () => {
    if (boks.dataset.laast) return;
    if (app.retting === "av"){ godkjenn(); return; }

    const dom = vurder(strekListe, svar, app.retting);
    sisteSky = dom.sky || null;

    if (dom.status === "tomt"){ valg.paaMelding?.("Skriv bokstaven først!"); return; }
    if (dom.status === "rett"){ godkjennMedSkrivemaate(); return; }
    if (dom.status === "speil"){
      valg.paaMelding?.("Riktig bokstav! Den snur andre veien – se her.");
      visFasit(true);
      godkjenn(2400);
      return;
    }

    bomTeller++;
    if (dom.status === "feil" && bomTeller < 3){
      blinkBlekk(); lydFeil(); si("proev-igjen");
      valg.paaMelding?.("Jeg leste en " + dom.lest + ". Prøv en gang til!");
      setTimeout(visk, 950);
      return;
    }
    laererValg(dom.status === "feil"
      ? "Jeg leste en " + dom.lest + ". Hva sier du?"
      : "Hmm, jeg er ikke helt sikker. Hva sier du?");
  });

  return {
    svar,
    /* liten kopi av det eleven skrev – vises i telleboksen */
    mini(){
      const m = lagSvg("svg", { viewBox:`0 0 ${FLATE_B} ${FLATE_H}` });
      m.appendChild(blekk.cloneNode(true));
      m.querySelectorAll("path").forEach(p => p.setAttribute("stroke-width", 22));
      return m;
    },
    visMeg: visFasit,
    settModell(modus){
      modell.style.display = (modus === "full") ? "" : "none";
      hjelpelag.style.display = (modus === "av") ? "none" : "";
    },
    laas(){ stoppAuto(); boks.dataset.laast = "1"; verktoy.style.visibility = "hidden"; }
  };
}

/* ============================================================
   TASTATUR – eleven trykker på bokstaven
   ============================================================ */
function lagTastatur(vert, ord, farge, valg){
  const svar = fasit(ord);
  const sett = OPPGAVER[app.oppgave].sett();

  let valgbare;
  if (app.alleValg || sett.length <= 9){
    valgbare = sett;
  } else {
    const andre = bland(sett.filter(b => b !== svar)).slice(0, 5);
    valgbare = bland(andre.concat([svar]));
  }

  const boks = document.createElement("div");
  boks.className = "svarboks";
  const rad = document.createElement("div");
  rad.className = "tastatur";
  boks.appendChild(rad);
  vert.appendChild(boks);

  const taster = new Map();
  valgbare.forEach(b => {
    const t = document.createElement("button");
    t.className = "tast"; t.type = "button"; t.textContent = b;
    t.addEventListener("click", () => {
      if (rad.classList.contains("laast")) return;
      if (b === svar){
        rad.classList.add("laast");
        t.classList.add("rett");
        valg.paaFerdig?.();
      } else {
        t.classList.add("feil");
        lydFeil();
        si("proev-igjen");
        valg.paaBom?.();
      }
    });
    taster.set(b, t);
    rad.appendChild(t);
  });

  return {
    svar,
    mini(){
      const m = lagSvg("svg", { viewBox:"0 0 100 100" });
      const t = lagSvg("text", { x:50, y:58, "text-anchor":"middle", "dominant-baseline":"middle",
        "font-family":"Fredoka One, cursive", "font-size":"62", fill:farge });
      t.textContent = svar;
      m.appendChild(t);
      return m;
    },
    visMeg(){
      const t = taster.get(svar);
      if (t){ t.classList.add("hint"); setTimeout(()=>t.classList.remove("hint"), 1800); }
    },
    settModell(){},
    laas(){ rad.classList.add("laast"); }
  };
}

/* ============================================================
   OPPGAVEKORT – bilde + svarfelt
   ============================================================ */
function lagOppgave(vert, ord, farge, valg){
  const rot = document.createElement("div");
  rot.className = "oppgave";

  const bilde = document.createElement("div");
  bilde.className = "bildeboks";
  const img = document.createElement("img");
  img.alt = "Bilde av et ord eleven skal lytte etter";
  img.src = bildeUrl(ord);
  img.onerror = () => { img.onerror = null; img.src = bildeReserve(ord); };
  bilde.appendChild(img);

  const hoer = document.createElement("button");
  hoer.className = "ordlyd"; hoer.type = "button"; hoer.textContent = "🔊";
  hoer.title = "Hør ordet en gang til";
  hoer.setAttribute("aria-label", "Hør ordet en gang til");
  hoer.addEventListener("click", e => { e.stopPropagation(); siOrd(ord); });
  bilde.appendChild(hoer);

  const tekst = document.createElement("div");
  tekst.className = "ordtekst"; tekst.textContent = ord.ord;
  tekst.style.display = app.visOrd ? "" : "none";
  bilde.appendChild(tekst);

  rot.appendChild(bilde);
  vert.appendChild(rot);

  const flate = app.svar === "skriv"
    ? lagSkriveflate(rot, ord, farge, valg)
    : lagTastatur(rot, ord, farge, valg);

  flate.ord = ord;
  flate.settOrdtekst = paa => { tekst.style.display = paa ? "" : "none"; };
  return flate;
}

/* ============================================================
   FELLESDELER – monster, teller, jubel
   ============================================================ */
function monsterBoks(lag, ropTekst){
  const d = document.createElement("div");
  d.className = "heier"; d.style.color = lag.farge;
  const img = document.createElement("img");
  img.className = "monster"; img.alt = "Monsteret " + lag.navn;
  img.src = monsterUrl(lag.fil);
  img.onerror = () => { img.onerror = null; img.src = monsterReserve(lag.fil); };
  const navn = document.createElement("div");
  navn.className = "navn"; navn.style.color = lag.morkt; navn.textContent = lag.navn;
  const boble = document.createElement("div");
  boble.className = "boble"; boble.textContent = ropTekst || tilfeldig(HEIAROP);
  d.appendChild(boble); d.appendChild(img); d.appendChild(navn);
  d._boble = boble; d._img = img;
  return d;
}

function lagTeller(fargeFn){
  const t = document.createElement("div");
  t.className = "teller";
  for (let i=1;i<=app.runder;i++){
    const b = document.createElement("div");
    b.className = "tellerboks"; b.dataset.n = i;
    b.style.borderColor = fargeFn(i-1);
    b.innerHTML = `<span class="tallet">${i}</span>`;
    t.appendChild(b);
  }
  return t;
}
function fyllTeller(teller, n, farge){
  const b = teller?.querySelector(`.tellerboks[data-n="${n}"]`);
  if (!b) return;
  b.classList.add("full");
  b.innerHTML = `<span class="hake">✓</span>`;
  b.style.background = farge;
}
function tomTeller(teller, fargeFn){
  teller?.querySelectorAll(".tellerboks").forEach(b => {
    b.className = "tellerboks"; b.style.background = ""; b.style.borderColor = fargeFn(+b.dataset.n - 1);
    b.innerHTML = `<span class="tallet">${b.dataset.n}</span>`;
  });
}

function visJubel(tekst, farge, knapper, tid){
  skjulJubel();
  const j = document.createElement("div");
  j.className = "jubel vis"; j.id = "jubel";
  const t = document.createElement("div"); t.className = "tekst"; t.textContent = tekst;
  if (farge) t.style.background = farge;
  j.appendChild(t);
  if (knapper){
    const v = document.createElement("div"); v.className = "valg";
    knapper.forEach(k => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = k.tekst;
      if (k.sek) b.className = "sek";
      b.addEventListener("click", () => { skjulJubel(); k.gjor(); });
      v.appendChild(b);
    });
    j.appendChild(v);
  }
  $("#scene").appendChild(j);
  if (tid) setTimeout(skjulJubel, tid);
}
function skjulJubel(){ const j = $("#jubel"); if (j) j.remove(); }
function visCelleJubel(celle, farge, tekst){
  const d = document.createElement("div");
  d.className = "cellejubel"; d.textContent = tekst;
  d.style.background = farge;
  celle.appendChild(d);
  setTimeout(()=>d.remove(), 1800);
}

/* ============================================================
   SCENE
   ============================================================ */
function nyRunde(){
  stoppTimere();
  app.tur = 0; app.rep = 0; app.flater = []; app.ferdigeSett = 0;
  skjulJubel();
  fyllKo();
  const scene = $("#scene"); scene.innerHTML = "";
  if (app.modus === "tur") byggTur(scene); else byggFlere(scene);
}

/* ---------- MODUS: TUR FOR TUR (ett felles bilde) ---------- */
function byggTur(scene){
  const rot = document.createElement("div"); rot.className = "tur";

  const topp = document.createElement("div"); topp.className = "topplinje";
  const stripe = document.createElement("div"); stripe.className = "elevstripe";
  for (let i=0;i<app.antall;i++){
    const m = document.createElement("div"); m.className = "elevmerke"; m.dataset.i = i;
    m.style.borderColor = LAG[i].farge;
    const img = document.createElement("img");
    img.src = monsterUrl(LAG[i].fil); img.alt = LAG[i].navn;
    img.onerror = () => { img.onerror = null; img.src = monsterReserve(LAG[i].fil); };
    m.appendChild(img);
    stripe.appendChild(m);
  }
  const oppdrag = document.createElement("div");
  oppdrag.className = "oppdrag";
  oppdrag.innerHTML = OPPGAVER[app.oppgave].tittel;
  const teller = lagTeller(n => forsokFarge(0, n));
  topp.appendChild(stripe); topp.appendChild(oppdrag); topp.appendChild(teller);

  const arena = document.createElement("div"); arena.className = "arena";
  arena.style.borderColor = forsokFarge(0, 0);
  const heier = monsterBoks(LAG[0]);
  const felt = document.createElement("div"); felt.className = "felt";
  arena.appendChild(heier); arena.appendChild(felt);

  rot.appendChild(topp); rot.appendChild(arena); scene.appendChild(rot);

  app._teller = teller; app._arena = arena; app._felt = felt;
  app._stripe = stripe; app._heier = heier; app._oppdrag = oppdrag;
  merkAktivElev();
  lagTurFlate();
}

function merkAktivElev(){
  app._stripe?.querySelectorAll(".elevmerke").forEach(m => {
    const i = +m.dataset.i;
    m.classList.toggle("aktiv", i === app.tur);
    m.classList.toggle("ferdig", i < app.tur);
  });
}

function lagTurFlate(nyttOrd){
  const heier = app._heier;
  const farge = forsokFarge(app.tur, app.rep);
  app._felt.innerHTML = "";
  app._arena.style.borderColor = farge;
  app.ord = nyttOrd || nesteOrd();
  app.flater = [ lagOppgave(app._felt, app.ord, farge, {
    paaTegning: paa => heier._img.classList.toggle("heia", paa),
    paaStrek:  () => { heier._boble.textContent = tilfeldig(HEIAROP); },
    paaBom:    () => { heier._boble.textContent = tilfeldig(BOMROP); },
    paaMelding: t => { heier._boble.textContent = t; },
    paaFerdig: () => turFerdigOrd()
  }) ];
  siOppgave(app.ord);
}

function turFerdigOrd(){
  const flate = app.flater[0], heier = app._heier;
  const farge = forsokFarge(app.tur, app.rep);
  app.rep++;
  fyllTeller(app._teller, app.rep, farge);
  heier._img.classList.add("heia");
  const r = app._arena.getBoundingClientRect();

  if (app.rep < app.runder){
    lydRunde();
    konfetti(r.left + r.width/2, r.top + r.height/2, 30, 0.8);
    const igjen = app.runder - app.rep;
    heier._boble.textContent = igjen === 1 ? "Ett ord til!" : `${igjen} ord igjen!`;
    si("riktig", "bokstaven", bokstavFil(flate.svar));
    senere(()=>{ heier._img.classList.remove("heia"); lagTurFlate(); }, 1500);
    return;
  }

  lydFerdig();
  konfetti(r.left + r.width/2, r.top + r.height/2, 80, 1.1);
  heier._boble.textContent = tilfeldig(JUBELROP);
  si("riktig", "bokstaven", bokstavFil(flate.svar));
  app.tur++; app.rep = 0;

  if (app.tur < app.antall){
    senere(()=>{
      visJubel("NESTE ELEV!", LAG[app.tur].farge, null, 1600);
      si("neste-elev");
      senere(()=>{
        const nyttLag = LAG[app.tur];
        app._arena.style.borderColor = nyttLag.farge;
        const nyHeier = monsterBoks(nyttLag);
        app._arena.replaceChild(nyHeier, app._heier);
        app._heier = nyHeier;
        tomTeller(app._teller, n => forsokFarge(app.tur, n));
        merkAktivElev();
        lagTurFlate();
      }, 1600);
    }, 1200);
  } else {
    merkAktivElev();
    senere(alleFerdige, 1300);
  }
}

/* ---------- MODUS: FLERE SAMTIDIG (eget bilde per elev) ---------- */
function byggFlere(scene){
  const rot = document.createElement("div"); rot.className = "grid4";
  rot.style.gridTemplateColumns = `repeat(${app.antall},1fr)`;
  rot.style.gridTemplateRows = "1fr";
  scene.appendChild(rot);
  app.flater = [];
  app._celler = [];

  for (let i=0;i<app.antall;i++){
    const lag = LAG[i];
    const celle = document.createElement("div"); celle.className = "celle";
    celle.style.borderColor = lag.farge;
    const heier = monsterBoks(lag);
    const merke = document.createElement("div");
    merke.className = "elevnr"; merke.style.color = lag.morkt; merke.textContent = "Elev 1";
    heier.appendChild(merke);
    const teller = lagTeller(n => forsokFarge(i, n));
    const felt = document.createElement("div"); felt.className = "felt";
    celle.appendChild(heier); celle.appendChild(teller); celle.appendChild(felt);
    rot.appendChild(celle);

    const st = { i, rep:0, elev:1, plass:i, lag, celle, heier, teller, felt, merke };
    st.bygg = (nyttOrd) => {
      felt.innerHTML = "";
      const brukte = app._celler.map(c => c.flate?.ord).filter(Boolean);
      st.ord = nyttOrd || nesteOrd(brukte);
      st.flate = lagOppgave(felt, st.ord, forsokFarge(st.plass, st.rep), {
        paaTegning: paa => heier._img.classList.toggle("heia", paa),
        paaStrek:  () => { heier._boble.textContent = tilfeldig(HEIAROP); },
        paaBom:    () => { heier._boble.textContent = tilfeldig(BOMROP); },
        paaMelding: t => { heier._boble.textContent = t; },
        paaFerdig: () => celleFerdigOrd(st)
      });
      app.flater[i] = st.flate;
    };
    app._celler.push(st);
    st.bygg();
  }
}

function celleFerdigOrd(st){
  const farge = forsokFarge(st.plass, st.rep);
  st.rep++;
  fyllTeller(st.teller, st.rep, farge);
  st.heier._img.classList.add("heia");
  const r = st.celle.getBoundingClientRect();

  if (st.rep < app.runder){
    lydRunde();
    konfetti(r.left + r.width/2, r.top + r.height/2, 25, 0.8);
    const igjen = app.runder - st.rep;
    st.heier._boble.textContent = igjen === 1 ? "Ett ord til!" : `${igjen} igjen!`;
    senere(()=>{ st.heier._img.classList.remove("heia"); st.bygg(); }, 1100);
    return;
  }

  lydFerdig();
  konfetti(r.left + r.width/2, r.top + r.height/2, 70, 1);
  st.celle.classList.add("ferdig");
  st.heier._boble.textContent = tilfeldig(JUBELROP);
  visCelleJubel(st.celle, st.lag.farge, "NESTE ELEV!");
  app.ferdigeSett++;
  const alleRundt = app.ferdigeSett % app.antall === 0;

  senere(()=>{
    st.rep = 0; st.elev++;
    st.plass += app.antall;                 // ny elev = nye farger i denne kolonnen
    st.merke.textContent = "Elev " + st.elev;
    st.celle.classList.remove("ferdig");
    st.heier._img.classList.remove("heia");
    st.heier._boble.textContent = "Din tur!";
    if (!alleRundt) si("din-tur");
    tomTeller(st.teller, n => forsokFarge(st.plass, n));
    st.bygg();
  }, 1900);

  if (alleRundt){
    senere(()=>{
      lydFanfare(); storKonfetti(); si("alle-sammen");
      visJubel("🎉 SUPERT! 🎉", null, null, 1700);
    }, 350);
  }
}

function alleFerdige(){
  lydFanfare(); storKonfetti();
  si("alle-sammen");
  visJubel("🎉 SUPERT! 🎉", null, [
    { tekst:"Nye ord →", gjor:nyRunde },
    { tekst:"Samme oppgave ↺", sek:true, gjor:nyRunde }
  ]);
}

/* ---------- neste ord uten å telle det som ferdig ---------- */
function hoppTilNesteOrd(){
  if (app.modus === "tur"){
    lagTurFlate();
  } else {
    app._celler.forEach(st => st.bygg());
    si(OPPGAVER[app.oppgave].lyd);
  }
}

/* ============================================================
   BOKSTAVER I SPILL
   ------------------------------------------------------------
   Læreren slår av og på hvilke bokstaver som skal være med, og ordbanken
   følger etter. Jobber klassen med S og M denne uka, står bare de to på,
   og eleven møter bare ord som begynner på S eller M.
   Valget huskes på denne maskina til neste gang.
   Tallet i hjørnet viser hvor mange ord bokstaven har i den oppgaven
   som er valgt nå. Bokstaver uten ord er stiplet og kan ikke slås på.
   ============================================================ */
const BOKSTAV_NOKKEL = "myntland-lydverkstedet-bokstaver-v1";

function lastBokstaver(){
  try {
    const a = JSON.parse(localStorage.getItem(BOKSTAV_NOKKEL));
    if (Array.isArray(a) && a.length) return new Set(a.filter(b => ALFABET.includes(b)));
  } catch(e){}
  return new Set(ALFABET);
}
function lagreBokstaver(){
  try { localStorage.setItem(BOKSTAV_NOKKEL, JSON.stringify([...app.aktive])); } catch(e){}
}

function ordPerBokstav(){
  const felt = OPPGAVER[app.oppgave].felt;
  const n = {};
  ORD.forEach(o => { if (o[felt]) n[o[felt]] = (n[o[felt]] || 0) + 1; });
  return n;
}

function byggBokstaver(){
  const n = ordPerBokstav();
  const boks = $("#bokstavrad"); boks.innerHTML = "";
  ALFABET.forEach(b => {
    const antall = n[b] || 0;
    const kn = document.createElement("button");
    kn.type = "button";
    kn.className = "btast" + (antall ? "" : " tom");
    kn.dataset.b = b;
    kn.innerHTML = `<span class="bok">${b}</span>` + (antall ? `<span class="ant">${antall}</span>` : "");
    if (!antall){
      kn.disabled = true;
      kn.title = "Ingen ord med " + b + " i denne oppgaven";
    } else {
      kn.setAttribute("aria-pressed", app.aktive.has(b) ? "true" : "false");
      kn.title = antall + (antall === 1 ? " ord" : " ord") + " med " + b;
      kn.addEventListener("click", () => vekslBokstav(b));
    }
    boks.appendChild(kn);
  });
  oppdaterOrdtall();
}

function oppdaterOrdtall(){
  const liste = utvalg();
  const felt = $("#ordtall");
  if (!liste.length){
    felt.textContent = "ingen bokstaver valgt – bruker alle";
    felt.classList.add("tom");
  } else {
    felt.textContent = liste.length + (liste.length === 1 ? " ord" : " ord");
    felt.classList.remove("tom");
  }
}

/* Å skru en bokstav av og på skal ikke rive scenen fra eleven som holder
   på – vi bytter bare ut køen, så slår det inn fra neste ord. */
function vekslBokstav(b){
  if (app.aktive.has(b)) app.aktive.delete(b); else app.aktive.add(b);
  lagreBokstaver();
  document.querySelectorAll(".btast").forEach(kn => {
    if (!kn.disabled) kn.setAttribute("aria-pressed", app.aktive.has(kn.dataset.b) ? "true" : "false");
  });
  oppdaterOrdtall();
  fyllKo();
}
function settAlleBokstaver(paa){
  /* Hele alfabetet, ikke bare de som har ord i oppgaven som er valgt nå –
     ellers ville Y og Æ falt ut når man byttet til vokal-oppgaven. */
  app.aktive = new Set(paa ? ALFABET : []);
  lagreBokstaver();
  document.querySelectorAll(".btast").forEach(kn => {
    if (!kn.disabled) kn.setAttribute("aria-pressed", app.aktive.has(kn.dataset.b) ? "true" : "false");
  });
  oppdaterOrdtall();
  fyllKo();
}

function oppdaterKnapper(){

  $("#modellKnapp").classList.toggle("skjult", app.svar !== "skriv");
