  $("#skrivemaateKnapp").classList.toggle("av", app.skrivemaate === "av");
  $("#rettingKnapp").textContent = "🤖 Retting: " + app.retting;
  $("#rettingKnapp").classList.toggle("av", app.retting === "av");
  $("#antallKnapp").textContent = `👥 ${app.antall} elever`;
  $("#runderKnapp").textContent = `🔁 ${app.runder} ord`;
  $("#valgKnapp").textContent = app.alleValg ? "🔡 Alle bokstaver" : "🔡 6 valg";
  $("#modellKnapp").textContent = MODELLTEKST[app.modell];
  $("#modellKnapp").classList.toggle("av", app.modell === "av");
  $("#ordKnapp").textContent = app.visOrd ? "📝 Ord på" : "📝 Ord av";
  $("#ordKnapp").classList.toggle("av", !app.visOrd);
}

$("#oppgavevelger").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  app.oppgave = b.dataset.oppgave;
  document.querySelectorAll("#oppgavevelger button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true":"false"));
  byggBokstaver(); nyRunde();
});
$("#modusvelger").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  app.modus = b.dataset.modus;
  document.querySelectorAll("#modusvelger button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true":"false"));
  oppdaterKnapper(); nyRunde();
});
$("#svarvelger").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  app.svar = b.dataset.svar;
  document.querySelectorAll("#svarvelger button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true":"false"));
  oppdaterKnapper(); nyRunde();
});
$("#alleBokstaver").addEventListener("click", () => settAlleBokstaver(true));
$("#ingenBokstaver").addEventListener("click", () => settAlleBokstaver(false));
$("#antallKnapp").addEventListener("click", () => {
  app.antall = app.antall >= 4 ? 2 : app.antall + 1;
  oppdaterKnapper(); nyRunde();
});
$("#runderKnapp").addEventListener("click", () => {
  app.runder = app.runder >= 5 ? 1 : app.runder + 1;
  oppdaterKnapper(); nyRunde();
});
$("#valgKnapp").addEventListener("click", () => {
  app.alleValg = !app.alleValg;
  oppdaterKnapper(); nyRunde();
});
$("#skrivemaateKnapp").addEventListener("click", () => {
  app.skrivemaate = app.skrivemaate === "hint" ? "krav" : app.skrivemaate === "krav" ? "av" : "hint";
  oppdaterKnapper();
});
$("#rettingKnapp").addEventListener("click", () => {
  app.retting = app.retting === "mild" ? "streng" : app.retting === "streng" ? "av" : "mild";
  oppdaterKnapper();
});
$("#modellKnapp").addEventListener("click", () => {
  app.modell = app.modell === "av" ? "prikker" : app.modell === "prikker" ? "full" : "av";
  oppdaterKnapper();
  app.flater.forEach(f => f && f.settModell(app.modell));
});
$("#ordKnapp").addEventListener("click", () => {
  app.visOrd = !app.visOrd;
  oppdaterKnapper();
  app.flater.forEach(f => f && f.settOrdtekst && f.settOrdtekst(app.visOrd));
});
$("#visKnapp").addEventListener("click", () => {
  app.flater.forEach(f => f && f.visMeg());
  const f = app.flater[0];
  if (f) siBokstav(f.svar);
});
$("#nesteKnapp").addEventListener("click", hoppTilNesteOrd);
$("#nullstillKnapp").addEventListener("click", nyRunde);

/* Første berøring låser opp lyd i nettleseren – da henter vi replikkene samtidig */
let lydVarmet = false;
["pointerdown","keydown"].forEach(h => addEventListener(h, () => {
  if (lydVarmet) return;
  lydVarmet = true;
  lydKontekst();
  forbered(...REPLIKKER);
  forbered(...ALFABET.map(bokstavFil));
}, { once:false, passive:true }));

$("#lydKnapp").addEventListener("click", () => {
  lydPaa = !lydPaa;
  $("#lydKnapp").textContent = lydPaa ? "🔊" : "🔇";
  $("#lydKnapp").classList.toggle("av", !lydPaa);
  if (lydPaa) lydKontekst();
  else stoppTale();
});
$("#fullKnapp").addEventListener("click", () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});
$("#rentKnapp").addEventListener("click", () => document.body.classList.add("rent"));
$("#visMenyKnapp").addEventListener("click", () => document.body.classList.remove("rent"));

/* --- tastatur for læreren --- */
addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === "ArrowRight"){ hoppTilNesteOrd(); return; }
  if (e.key === " "){ e.preventDefault(); nyRunde(); return; }
  if (e.key === "Enter"){ app.flater.forEach(f => f && f.visMeg()); return; }
  /* Shift+N: glem formene gjenkjenneren har lært av lærerens godkjenninger */
  if (e.key === "N" && e.shiftKey){ glemLaert(); visJubel("Læringen er nullstilt", null, null, 1400); return; }
});

/* --- start --- */
byggMaler();
lastLaert();
app.aktive = lastBokstaver();
byggBokstaver();
oppdaterKnapper();
nyRunde();
</script>
</body>
</html>
