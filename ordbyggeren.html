<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Ordbyggeren – Myntland</title>
<meta name="description" content="Eleven drar bokstavene mot hverandre, og lydene trekkes sammen til et ord – i tempoet eleven selv styrer. Tre oppgavetyper: dra sammen, hvilket ord blir det, og bygg ordet. For interaktiv tavle og iPad.">
<meta name="theme-color" content="#232a3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ordbyggeren">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='114' fill='%231e0f52'/%3E%3Ctext x='256' y='360' font-family='Arial Black,sans-serif' font-size='320' font-weight='900' text-anchor='middle' fill='%23EF9F27'%3EM%3C/text%3E%3C/svg%3E" type="image/svg+xml">

<!-- Delt Myntland-styling (palett + fonter). Inline-stilene under bygger videre på denne. -->
<link rel="stylesheet" href="myntland.css">

<style>
:root{
  --navy:#232a3f; --navy-soft:#3b4560;
  --krem:#fbf1d6; --krem-dyp:#f3e2b9; --krem-lys:#fffaeb;
  --amber:#efae2a; --amber-dyp:#c4841a;
  --raud:#e8473f; --gronn:#74c043; --gronn-dyp:#4f8f28; --teal:#2bb3c0;
  --himmel-1:#a6dff0; --himmel-2:#d8f2f8; --bakke:#8cc63f;
  --text:#232a3f; --muted:#6b7690; --border:var(--navy);
  --f1:#E23B2E; --f2:#1F7AE0; --f3:#17A05C; --f4:#EF9F27;
  --skygge:0 4px 0 rgba(35,42,63,.9);
  --skygge-mjuk:0 4px 0 rgba(35,42,63,.18);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; overflow:hidden; }
body{
  font-family:'Nunito',system-ui,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,var(--himmel-1) 0%,var(--himmel-2) 55%,#e9f7ea 78%,var(--bakke) 100%);
  display:flex; flex-direction:column;
  height:100dvh;
  user-select:none; -webkit-user-select:none;
}

/* ---------- topnav ---------- */
.topnav{ background:var(--navy); padding:.45rem 1rem; flex:0 0 auto; }
.topnav-inner{ max-width:1600px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:1rem; }
.topnav-logo{
  font-family:'Fredoka One',cursive; font-size:1.05rem; color:var(--krem); text-decoration:none;
  display:flex; align-items:center; gap:.45rem; letter-spacing:.02em;
}
.topnav-logo::before{ content:"🪙"; }
.topnav-logo span{ font-family:'Nunito',sans-serif; font-weight:800; font-size:.75rem; color:var(--amber); text-transform:uppercase; letter-spacing:.12em; }
.topnav-back{
  font-size:.75rem; font-weight:900; color:var(--navy); text-decoration:none; text-transform:uppercase; letter-spacing:.08em;
  background:var(--amber); border:2px solid var(--navy); border-radius:999px; padding:.25rem .8rem;
}

/* ---------- lærerlinje ---------- */
.laererlinje{
  background:var(--krem); border:4px solid var(--navy); border-radius:20px;
  box-shadow:var(--skygge); margin:.55rem .6rem .2rem;
  padding:.55rem .8rem .65rem; flex:0 0 auto;
  display:flex; flex-direction:column; gap:.5rem; align-items:center;
}
.rad{ display:flex; gap:.4rem; align-items:center; justify-content:center; flex-wrap:wrap; }
.seg{ display:flex; background:var(--krem-dyp); border:3px solid var(--navy); border-radius:999px; padding:3px; gap:3px; }
.seg button{
  border:0; background:transparent; font-family:inherit; font-weight:900; font-size:.78rem;
  padding:.3rem .75rem; border-radius:999px; color:var(--navy); cursor:pointer; opacity:.65;
}
.seg button[aria-pressed="true"]{ background:var(--navy); color:var(--krem); opacity:1; }
.seg.skjult{ display:none; }
.knapp{
  border:3px solid var(--navy); background:var(--krem-lys); border-radius:999px;
  font-family:inherit; font-weight:900; font-size:.78rem; padding:.28rem .7rem; cursor:pointer; color:var(--navy);
  display:inline-flex; align-items:center; gap:.35rem; box-shadow:0 3px 0 var(--navy);
  transition:transform .08s, box-shadow .08s;
}
.knapp:active{ transform:translateY(3px); box-shadow:0 0 0 var(--navy); }
.knapp:hover{ background:#fff; }
.knapp.primary{ background:var(--amber); color:var(--navy); }
.knapp.av{ opacity:.4; }
.knapp.skjult{ display:none; }

/* vokalene i spill */
.vokallinje{ display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; justify-content:center; }
.vtittel{ font-weight:900; font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--navy); }
.minik{
  font-family:inherit; font-weight:900; font-size:.72rem; color:var(--navy); cursor:pointer;
  background:var(--krem-lys); border:2px solid var(--navy); border-radius:999px;
  padding:.15rem .65rem; box-shadow:0 2px 0 var(--navy);
}
.minik:hover{ background:#fff; }
.ordtall{ font-weight:900; font-size:.75rem; color:var(--muted); }
.ordtall.tom{ color:var(--amber-dyp); }

.vokalrad{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; max-width:1500px; }
.vtast{
  position:relative; padding:.2rem .6rem .2rem .55rem; cursor:pointer; min-width:3.1rem;
  border:3px solid var(--navy); background:var(--krem-lys); border-radius:.7rem;
  font-family:'Fredoka One',cursive; font-size:.95rem; line-height:1.25; color:var(--navy);
  display:inline-flex; align-items:center; justify-content:center; gap:.25rem; box-shadow:0 2px 0 var(--navy);
  transition:opacity .15s, background .15s;
}
.vtast:hover{ background:#fff; }
.vtast[aria-pressed="true"]{ background:var(--raud); color:#fff; }
.vtast[aria-pressed="false"]{ opacity:.4; }
.vtast .ant{
  font-family:'Nunito',sans-serif; font-weight:900; font-size:.6rem;
  background:var(--navy); color:var(--krem); border-radius:999px; padding:0 4px; min-width:1rem; text-align:center;
}
.vtast[aria-pressed="false"] .ant{ background:var(--muted); }

/* ---------- scene ---------- */
.scene{ flex:1 1 auto; min-height:0; position:relative; padding:.6rem; }

/* tur for tur */
.tur{ height:100%; display:flex; flex-direction:column; gap:.5rem; }
.topplinje{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:clamp(.8rem,4vw,3rem); flex-wrap:wrap;
  background:var(--krem); border:4px solid var(--navy); border-radius:18px; box-shadow:var(--skygge-mjuk);
  padding:.35rem .9rem;
}
.oppdrag{
  font-family:'Fredoka One',cursive; font-size:clamp(.95rem,2vw,1.45rem); color:var(--navy);
  text-align:center; line-height:1.15;
}
.oppdrag em{ font-style:normal; color:var(--amber-dyp); }

.elevstripe{ display:flex; gap:.45rem; align-items:center; }
.elevmerke{
  width:46px; height:46px; border-radius:50%; background:var(--krem-lys);
  border:3px solid var(--navy); display:flex; align-items:center; justify-content:center;
  position:relative; opacity:.4; transition:transform .2s, opacity .2s;
}
.elevmerke img{ width:82%; height:82%; object-fit:contain; }
.elevmerke.aktiv{ opacity:1; transform:scale(1.18); box-shadow:0 3px 0 var(--navy); }
.elevmerke.ferdig{ opacity:1; }
.elevmerke.ferdig::after{ content:"✅"; position:absolute; right:-4px; bottom:-4px; font-size:1rem; }

/* teller 1-2-3 */
.teller{ display:flex; gap:.4rem; align-items:center; }
.tellerboks{
  width:34px; height:34px; border-radius:10px; background:var(--krem-lys);
  border:3px dashed var(--navy); display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden; opacity:.75;
}
.tellerboks.full{ border-style:solid; opacity:1; box-shadow:0 2px 0 var(--navy); }
.tellerboks .tallet{ font-family:'Fredoka One',cursive; font-size:1rem; color:var(--muted); }
.tellerboks .hake{ font-size:1.1rem; color:#fff; font-weight:900; text-shadow:0 1px 0 rgba(0,0,0,.3); }

.arena{
  flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; gap:clamp(.5rem,3vw,2.5rem);
  background:var(--krem); border:5px solid var(--navy); border-radius:26px; padding:.7rem;
  box-shadow:var(--skygge); position:relative;
}
.arena .heier{ position:absolute; left:1.5%; top:50%; transform:translateY(-50%); z-index:2;
  width:min(13vw,132px); display:flex; flex-direction:column; align-items:center; gap:.35rem; }
.arena .felt{ width:100%; height:100%; min-width:0; padding-left:min(15vw,150px); padding-right:.6rem;
  display:flex; align-items:center; justify-content:center; }

/* monster */
.monster{ width:100%; max-width:132px; filter:drop-shadow(0 6px 8px rgba(35,42,63,.22)); animation:bob 2.6s ease-in-out infinite; }
.monster.heia{ animation:heia .45s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-7px) } }
@keyframes heia{ 0%,100%{ transform:translateY(0) rotate(-4deg) } 50%{ transform:translateY(-12px) rotate(4deg) } }
.boble{
  background:var(--krem-lys); border:3px solid var(--navy); border-radius:16px; color:var(--navy);
  padding:.32rem .75rem; font-weight:900; font-size:clamp(.75rem,1.4vw,1rem); text-align:center;
  position:relative; max-width:100%; box-shadow:0 3px 0 var(--navy);
}
.boble::after{ content:""; position:absolute; bottom:-11px; left:50%; transform:translateX(-50%);
  border:8px solid transparent; border-top-color:var(--navy); }
.navn{
  font-family:'Fredoka One',cursive; font-size:clamp(.85rem,1.6vw,1.15rem); color:var(--navy)!important;
  background:var(--amber); border:3px solid var(--navy); border-radius:999px; padding:.05rem .7rem;
}

/* ---------- felles bildekort ---------- */
.bildeboks{
  flex:0 0 auto; position:relative;
  background:#f9f0d5; border:5px solid var(--navy); border-radius:22px;
  box-shadow:var(--skygge); overflow:hidden;
  aspect-ratio:1/1;
  display:flex; align-items:center; justify-content:center;
}
.bildeboks img{ width:100%; height:100%; object-fit:contain; display:block; }
.bildeboks .ordlyd{
  position:absolute; right:5px; bottom:5px; z-index:3;
  width:2.2rem; height:2.2rem; border-radius:50%; cursor:pointer;
  border:3px solid var(--navy); background:var(--amber); color:var(--navy);
  font-size:1.05rem; display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 0 var(--navy); padding:0;
}
.bildeboks .ordlyd:active{ transform:translateY(3px); box-shadow:0 0 0 var(--navy); }
.bildeboks .ordtekst{
  position:absolute; left:0; right:0; bottom:0; z-index:2; text-align:center;
  font-weight:900; font-size:clamp(.7rem,1.3vw,1rem); letter-spacing:.05em;
  background:rgba(35,42,63,.82); color:var(--krem); padding:.12rem 0;
}

.merke-rett, .merke-feil{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(0);
  font-size:clamp(1.6rem,4vw,3rem); z-index:4; pointer-events:none;
  animation:sprett .35s cubic-bezier(.2,1.6,.4,1) forwards;
}
@keyframes rist{ 0%,100%{ transform:translateX(0) } 25%{ transform:translateX(-6px) } 75%{ transform:translateX(6px) } }

/* ============================================================
   OPPGAVE 1 – DRA SAMMEN
   Bokstavkortene ligger absolutt plassert i sporet, og JS-en
   regner ut både kortstørrelse og posisjoner. Avstanden mellom
   to kort ER pausen mellom de to lydene når ordet leses.
   ============================================================ */
/* Alt eleven skal ta på, ligger NEDERST. En førsteklassing ved
   smartboardet rekker ikke opp på øvre halvdel av tavla, så bildet får
   den øvre plassen og bokstavkortene, ▶-knappen og bokstavbanken ligger
   så lavt som arenaen tillater. Samme regel i alle tre oppgavene. */
.draoppg{ width:100%; height:100%; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:.45rem; }
.sporramme{ width:100%; flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:.35rem; }
.sporlinje{ display:flex; align-items:center; justify-content:center; gap:.6rem; flex-wrap:wrap; }
.drahint{
  font-weight:900; font-size:clamp(.68rem,1.2vw,.92rem); color:var(--muted);
  text-align:center;
}
.lesknapp{
  font-family:'Fredoka One',cursive; cursor:pointer; color:var(--navy);
  background:var(--gronn); border:4px solid var(--navy); border-radius:999px;
  box-shadow:0 5px 0 var(--navy); font-size:clamp(.85rem,1.7vw,1.25rem);
  padding:.2rem clamp(.7rem,2vw,1.3rem);
  display:inline-flex; align-items:center; gap:.4rem;
  transition:transform .08s, box-shadow .08s;
}
.lesknapp:active{ transform:translateY(5px); box-shadow:0 0 0 var(--navy); }

.ordspor{
  position:relative; width:100%;
  height:clamp(66px,20vh,180px);
  background:var(--krem-lys); border:4px dashed var(--navy); border-radius:20px;
  touch-action:none;
}
.ordspor.samlet{ border-style:solid; background:#fff6dd; }
.lydkort{
  position:absolute; top:50%; margin-top:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--amber); border:4px solid var(--navy); border-radius:14px;
  font-family:'Fredoka One',cursive; color:var(--navy); line-height:1;
  box-shadow:0 4px 0 var(--navy); cursor:grab; touch-action:none;
  transition:left .1s ease, background .15s, box-shadow .1s;
}
.lydkort.vokal{ background:var(--raud); color:#fff; }
.lydkort.drar{ cursor:grabbing; z-index:4; transition:none; box-shadow:0 9px 0 rgba(35,42,63,.45); }
.lydkort.lyser{ background:#fff; outline:4px solid var(--gronn-dyp); outline-offset:2px; z-index:3; }
.lydkort.vokal.lyser{ background:#ffd9d6; }
.ordspor.samlet .lydkort{ border-radius:8px; }

/* Fasiten fyller plassen OVER sporet og legger seg nederst i den, altså
   rett over bokstavkortene. Plassen er reservert hele tida (opacity 0),
   så kortene ikke hopper når bildet spretter fram. */
.fasitboks{
  flex:1 1 auto; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:.3rem;
  opacity:0; transform:scale(.72); transition:opacity .35s ease, transform .35s cubic-bezier(.2,1.6,.4,1);
}
.fasitboks.vis{ opacity:1; transform:scale(1); }
/* Så lenge fasiten er skjult, skal ingen kunne treffe høyttalerknappen
   på bildet og få ordet servert. */
.fasitboks:not(.vis){ pointer-events:none; }
/* Høyden styrer, bredden følger av kvadratet – da krymper hele bildet
   pent når arenaen er lav (iPad i liggende format med menyene framme)
   i stedet for å renne ut nederst. */
.fasitboks .bildeboks{ height:min(26vw,30vh); width:auto; max-height:calc(100% - 2.4rem); }
.fasitord{
  font-family:'Fredoka One',cursive; font-size:clamp(1rem,2.4vw,1.9rem); color:var(--navy);
  background:var(--amber); border:3px solid var(--navy); border-radius:999px; padding:.02rem .9rem;
  letter-spacing:.06em;
}

/* ============================================================
   OPPGAVE 2 – HVILKET ORD BLIR DET?
   ============================================================ */
.finnoppg{ width:100%; height:100%; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:clamp(.3rem,1.5vw,.8rem); }
.lydremse{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:clamp(.3rem,1.4vw,1rem); flex-wrap:wrap;
  background:var(--krem-lys); border:4px solid var(--navy); border-radius:18px; box-shadow:var(--skygge-mjuk);
  padding:.3rem clamp(.4rem,1.5vw,1rem);
}
.remsekort{
  display:flex; align-items:center; justify-content:center;
  font-family:'Fredoka One',cursive; color:var(--navy); line-height:1;
  background:var(--amber); border:4px solid var(--navy); border-radius:12px;
  width:clamp(28px,4.4vw,58px); height:clamp(34px,5.4vw,70px);
  font-size:clamp(.95rem,2.4vw,2rem);
  transition:background .12s, transform .12s;
}
.remsekort.vokal{ background:var(--raud); color:#fff; }
.remsekort.lyser{ background:#fff; outline:4px solid var(--gronn-dyp); outline-offset:2px; transform:translateY(-4px); }
.remsekort.vokal.lyser{ background:#ffd9d6; }

/* Svaralternativene ligger i et rutenett. Antall kolonner og rader settes
   fra JS-en (--kols / --rader), slik at kortene alltid får plass både i
   bredden og i høyden – også når fire elever deler skjermen. */
.kortrad{
  --kols:2; --rader:2;
  flex:1 1 auto; min-width:0; min-height:0; display:grid;
  grid-template-columns:repeat(var(--kols),auto);
  gap:clamp(.3rem,1.2vw,.9rem); place-content:center; place-items:center;
}
.kort{ padding:0; border:0; background:transparent; cursor:pointer; font-family:inherit; transition:transform .1s; }
.kort .bildeboks{ height:auto; width:min( calc(40vw / var(--kols)), calc(38vh / var(--rader)) ); }
.kort:hover .bildeboks{ background:#fffdf5; }
.kort.rett .bildeboks{ border-color:var(--gronn-dyp); background:#e9f8dd; box-shadow:0 4px 0 var(--gronn-dyp); }
.kort.feil .bildeboks{ border-color:var(--raud); opacity:.4; animation:rist .35s; }
.kort.dempet{ opacity:.35; pointer-events:none; }
.kortrad.laast .kort{ pointer-events:none; }

/* ============================================================
   OPPGAVE 3 – BYGG ORDET
   ============================================================ */
.byggoppg{ width:100%; height:100%; min-height:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; gap:clamp(.3rem,1.4vw,.7rem); }
.byggbilde{ flex:1 1 auto; min-height:0; display:flex; align-items:flex-end; justify-content:center; }
.byggbilde .bildeboks{ height:min(22vw,28vh); width:auto; max-height:100%; }

.slissrad{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:clamp(.2rem,.8vw,.5rem); }
.slisse{
  display:flex; align-items:center; justify-content:center;
  font-family:'Fredoka One',cursive; line-height:1; color:var(--navy);
  width:clamp(30px,4.6vw,62px); height:clamp(38px,5.8vw,76px);
  font-size:clamp(1rem,2.6vw,2.2rem);
  background:var(--krem-lys); border:4px dashed var(--navy); border-radius:12px;
}
.slisse.full{ border-style:solid; background:var(--amber); box-shadow:0 4px 0 var(--navy); animation:sprett .3s cubic-bezier(.2,1.6,.4,1); }
.slisse.full.vokal{ background:var(--raud); color:#fff; }
.slisse.neste{ border-color:var(--gronn-dyp); background:#eefbe4; }
.slisse.lyser{ outline:4px solid var(--gronn-dyp); outline-offset:2px; }

.bankrad{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:clamp(.2rem,.9vw,.55rem); flex-wrap:wrap; max-width:100%; }
.banktast{
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  font-family:'Fredoka One',cursive; line-height:1; color:var(--navy);
  width:clamp(30px,4.6vw,62px); height:clamp(38px,5.8vw,76px);
  font-size:clamp(1rem,2.6vw,2.2rem);
  background:var(--amber); border:4px solid var(--navy); border-radius:12px; box-shadow:0 4px 0 var(--navy);
  transition:transform .08s, box-shadow .08s, opacity .2s;
}
.banktast.vokal{ background:var(--raud); color:#fff; }
.banktast:active{ transform:translateY(4px); box-shadow:0 0 0 var(--navy); }
.banktast.brukt{ opacity:0; pointer-events:none; }
.banktast.feil{ animation:rist .35s; }
.banktast.hint{ outline:4px solid var(--gronn-dyp); outline-offset:3px; }
.bankrad.laast .banktast{ pointer-events:none; }
.byggord{
  flex:0 0 auto; font-weight:900; letter-spacing:.18em; color:var(--muted);
  font-size:clamp(.7rem,1.4vw,1.05rem);
}

/* ---------- overlay / jubel ---------- */
.jubel{
  position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  flex-direction:column; gap:.9rem; z-index:40; pointer-events:none;
}
.jubel.vis{ display:flex; }
.jubel .tekst{
  font-family:'Fredoka One',cursive; color:var(--amber); text-align:center; line-height:1.1;
  font-size:clamp(2rem,7vw,5.5rem);
  padding:.35rem 1.6rem; border-radius:26px; background:var(--navy); border:5px solid var(--navy);
  box-shadow:0 8px 0 rgba(35,42,63,.35);
  animation:sprett .5s cubic-bezier(.2,1.6,.4,1);
}
@keyframes sprett{ from{ transform:scale(.4); opacity:0 } to{ transform:scale(1); opacity:1 } }
.jubel .valg{ display:flex; gap:.6rem; pointer-events:auto; flex-wrap:wrap; justify-content:center; }
.jubel .valg button{
  font-family:'Fredoka One',cursive; font-size:clamp(1rem,2.4vw,1.6rem);
  border:4px solid var(--navy); border-radius:999px; padding:.5rem 1.6rem; cursor:pointer;
  background:var(--amber); color:var(--navy); box-shadow:0 5px 0 var(--navy);
}
.jubel .valg button:active{ transform:translateY(5px); box-shadow:0 0 0 var(--navy); }

/* ---------- Lyd ---------- */
let lydPaa = true, ac = null;
function lydKontekst(){
  if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
  if (ac && ac.state === "suspended") ac.resume();
  return ac;
}
function tone(freq, tid=0.12, type="sine", vol=0.15, forsink=0){
  if (!lydPaa) return;
  const k = lydKontekst(); if (!k) return;
  const o = k.createOscillator(), g = k.createGain();
  o.type = type; o.frequency.value = freq;
  const t0 = k.currentTime + forsink;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + tid);
  o.connect(g); g.connect(k.destination); o.start(t0); o.stop(t0 + tid + 0.05);
}

/* ---------- Innlest tale (mp3) ----------
   Ligger i /lyd/ ved siden av denne sida. Æ/Ø/Å har ASCII-filnavn

const LYDSTI  = "lyd/";

];

const lydLager = new Map();
let taleNr = 0, spillerNaa = null, rekkeTimer = null;

function hentLyd(navn){
  let a = lydLager.get(navn);
  if (!a){ a = new Audio(LYDSTI + navn + ".mp3"); a.preload = "auto"; lydLager.set(navn, a); }
  return a;
}
function forbered(...navn){ navn.forEach(n => { try { hentLyd(n).load(); } catch(e){} }); }
function stoppTale(){
  taleNr++;
  if (rekkeTimer){ clearTimeout(rekkeTimer); rekkeTimer = null; }
  if (spillerNaa){ try { spillerNaa.pause(); spillerNaa.currentTime = 0; } catch(e){} spillerNaa = null; }
}

/* siRekke() er hjertet i verktøyet: den spiller filene etter hverandre
   MED en pause mellom hver – og det er pausen eleven styrer ved å dra
   bokstavene fra eller mot hverandre. paaHver(i) kalles rett før lyd
   nummer i, så kortet kan lyse opp i takt med lyden. Er lyden slått av,
   går sekvensen videre på en fast, kort takt, slik at det visuelle
   fortsatt virker.
   ferdig() kalles bare hvis sekvensen fikk gå helt ut. */
function siRekke(navn, pauser, paaHver, ferdig){
  stoppTale();
  const mitt = taleNr;
  const kjoer = i => {
    if (mitt !== taleNr) return;
    if (i >= navn.length){ paaHver && paaHver(-1); ferdig && ferdig(); return; }
    paaHver && paaHver(i);
    const videreEtterPause = () => {
      if (mitt !== taleNr) return;
      const pause = Math.max(0, pauser[i] || 0);
      if (pause > 0) rekkeTimer = setTimeout(() => kjoer(i + 1), pause);
      else kjoer(i + 1);
    };
    if (!lydPaa){ rekkeTimer = setTimeout(videreEtterPause, 300); return; }
    const a = hentLyd(navn[i]);
    let brukt = false;
    const videre = () => {
      if (brukt) return;
      brukt = true;
      a.removeEventListener("ended", videre);
      a.removeEventListener("error", videre);
      videreEtterPause();
    };
    a.addEventListener("ended", videre);
    a.addEventListener("error", videre);
    try { a.currentTime = 0; } catch(e){}
    spillerNaa = a;
    const p = a.play();
    if (p && p.catch) p.catch(videre);
  };
  kjoer(0);
}
/* si() er den enkle utgaven – filene etter hverandre uten pause. */
function si(...navn){
  if (!lydPaa || !navn.length) return;
  siRekke(navn, navn.map(()=>0), null, null);
}

  konfetti(b*0.2, h*0.45, 110, 1.3); konfetti(b*0.8, h*0.45, 110, 1.3);
  konfetti(b*0.5, h*0.35, 140, 1.5);
  setTimeout(()=>{ konfetti(b*0.35,h*0.5,90,1.2); konfetti(b*0.65,h*0.5,90,1.2); }, 260);
}
function tegnKonfetti(){
  ktx.clearRect(0,0,innerWidth,innerHeight);
  biter = biter.filter(p => p.liv > 0 && p.y < innerHeight + 60);
  for (const p of biter){
    p.vy += 0.22; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.r += p.vr; p.liv -= 0.004;
    ktx.save(); ktx.translate(p.x, p.y); ktx.rotate(p.r); ktx.globalAlpha = Math.max(0, Math.min(1, p.liv*1.6));
    ktx.fillStyle = p.f; ktx.fillRect(-p.st/2, -p.st/2, p.st, p.st*0.6); ktx.restore();
  }
  if (biter.length){ requestAnimationFrame(tegnKonfetti); }
  else { konfettiKjorer = false; ktx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ============================================================
   UTVALG AV ORD
   ------------------------------------------------------------
   Læreren slår vokaler av og på og velger ordlengde. Jobber
   klassen med A og I denne uka, står bare de to på.
   ============================================================ */
function lengdeOK(o){
  if (app.lengde === "korte") return o.lyd.length <= 3;
  if (app.lengde === "lange") return o.lyd.length >= 4;
  return true;
}
function aktiveOrd(){
  const liste = ORD.filter(o => app.aktive.has(o.vok) && lengdeOK(o));
  if (liste.length >= 2) return liste;
  const utenLengde = ORD.filter(o => app.aktive.has(o.vok));
  if (utenLengde.length >= 2) return utenLengde;
  return ORD.slice();
}

/* Køen sørger for at alle ordene kommer opp før noen gjentas. */
function fyllOrdkoe(){ app.ordko = bland(aktiveOrd()); }
function nesteOrd(){
  if (!app.ordko.length) fyllOrdkoe();
  return app.ordko.shift();
}

/* Distraktorer i «Hvilket ord?»: helst ord med like mange lyder som
   fasiten, og gjerne ett som starter på samme lyd. Da må eleven høre
   HELE ordet, ikke bare førstelyden. */
function velgDistraktorer(fasit, antall){
  const bassen = aktiveOrd().filter(o => o.fil !== fasit.fil);
  const nok = bassen.length >= antall ? bassen : ORD.filter(o => o.fil !== fasit.fil);
  const valgt = [];
  const sammeStart = bland(nok.filter(o => o.lyd[0] === fasit.lyd[0]));
  if (sammeStart.length) valgt.push(sammeStart[0]);
  const sammeLengde = bland(nok.filter(o => o.lyd.length === fasit.lyd.length));
  for (const o of sammeLengde){
    if (valgt.length >= antall) break;
    if (!valgt.includes(o)) valgt.push(o);
  }
  for (const o of bland(nok)){
    if (valgt.length >= antall) break;
    if (!valgt.includes(o)) valgt.push(o);
  }
  return valgt.slice(0, antall);
}

/* ============================================================
   OPPGAVE 1 – DRA SAMMEN
   ------------------------------------------------------------
   Kortene ligger absolutt plassert i sporet. andel[i] er gapet
   mellom kort i og i+1, målt som en andel av det største gapet
   sporet har plass til (0 = kortene ligger inntil hverandre,
   1 = så langt fra hverandre som mulig). Ut fra andel[i] regnes
   både posisjonene og pausen mellom lyd i og lyd i+1.

   At begge deler kommer fra samme tall er hele poenget: det
   eleven ser, er det eleven hører.
   ============================================================ */
function lagDraFlate(vert, farge, valg){
  const o = nesteOrd();
  const n = o.lyd.length;

  const rot = document.createElement("div");
  rot.className = "draoppg";

  const ramme = document.createElement("div");
  ramme.className = "sporramme";

  const spor = document.createElement("div");
  spor.className = "ordspor";

  const linje = document.createElement("div");
  linje.className = "sporlinje";
  const les = document.createElement("button");
  les.type = "button"; les.className = "lesknapp"; les.textContent = "▶ Les";
  const hint = document.createElement("div");
  hint.className = "drahint";
  hint.textContent = "Dra bokstavene mot hverandre";
  linje.appendChild(les); linje.appendChild(hint);

  ramme.appendChild(spor); ramme.appendChild(linje);

  /* fasiten – bilde + ordet, skjult til sammentrekninga er gjort */
  const fasit = document.createElement("div");
  fasit.className = "fasitboks";
  const bilde = lagBildeboks(o, true);
  const ordtekst = document.createElement("div");
  ordtekst.className = "fasitord"; ordtekst.textContent = o.ord.toUpperCase();
  fasit.appendChild(bilde); fasit.appendChild(ordtekst);
  if (app.visBilde) fasit.classList.add("vis");

  /* Bildet øverst, sporet nederst – se kommentaren ved .draoppg. */
  rot.appendChild(fasit); rot.appendChild(ramme);
  vert.appendChild(rot);

  /* --- kortene --- */
  const kort = o.lyd.map((ch, i) => {
    const d = document.createElement("div");
    d.className = "lydkort" + (ER_VOKAL.has(ch) ? " vokal" : "");
    d.textContent = ch;
    d.dataset.i = i;
    spor.appendChild(d);
    return d;
  });

  let andel = new Array(Math.max(0, n-1)).fill(1);
  let kortB = 40, kortH = 46, gapMaks = 0, sporB = 0;
  let p = new Array(n).fill(0);
  let samlet = false, ferdig = false, leser = false;

  function maalTall(){
    sporB = spor.clientWidth || 1;
    const sporH = spor.clientHeight || 1;
    const kant = Math.max(6, sporB * 0.02);
    const maks = 140;
    kortB = Math.min(maks, sporH * 0.74, (sporB - 2*kant) / (n + (n-1)*0.9));
    kortB = Math.max(16, kortB);
    kortH = Math.min(sporH * 0.86, kortB * 1.22);
    gapMaks = n > 1 ? Math.max(0, (sporB - 2*kant - n*kortB) / (n-1)) : 0;
    return kant;
  }

  /* Legg kortene ut fra andel[] og sentrer gruppa i sporet. */
  function plasser(){
    maalTall();
    const gaps = andel.map(a => a * gapMaks);
    const total = n*kortB + gaps.reduce((s,g)=>s+g, 0);
    let x = (sporB - total) / 2;
    p = [];
    for (let i=0;i<n;i++){ p.push(x); x += kortB + (gaps[i] || 0); }
    tegn();
  }

  function tegn(){
    kort.forEach((d, i) => {
      d.style.width  = kortB + "px";
      d.style.height = kortH + "px";
      d.style.marginTop = (-kortH/2) + "px";
      d.style.fontSize = Math.max(9, kortB * 0.62) + "px";
      d.style.left = p[i] + "px";
    });
    spor.classList.toggle("samlet", samlet);
  }

  function gapPiksler(){
    const g = [];
    for (let i=0;i<n-1;i++) g.push(Math.max(0, p[i+1] - (p[i] + kortB)));
    return g;
  }

  /* Etter et dra: klikk gapene sammen hvis de er nesten null, regn om
     til andeler, og sentrer gruppa på nytt. */
  function fest(){
    const g = gapPiksler();
    const snapp = Math.max(9, kortB * SNAPP_ANDEL);
    let noeKlikket = false;
    andel = g.map(v => {
      if (v <= snapp){ if (v > 0.5) noeKlikket = true; return 0; }
      return gapMaks > 0 ? klem(v / gapMaks, 0, 1) : 0;
    });
    const varSamlet = samlet;
    samlet = n === 1 || andel.every(a => a === 0);
    plasser();
    if (noeKlikket) lydSnapp();
    if (samlet && !varSamlet) hint.textContent = "Nå ligger lydene inntil hverandre!";
    else if (!samlet) hint.textContent = andel.some(a => a === 0) ? "Nesten! Dra de siste sammen" : "Dra bokstavene mot hverandre";
  }

  /* --- lese opp --- */
  function lysOpp(i){
    kort.forEach((d, j) => d.classList.toggle("lyser", i === j));
  }
  function lysAlle(paa){
    kort.forEach(d => d.classList.toggle("lyser", !!paa));
  }

  function lesOpp(){
    if (ferdig || leser) return;
    leser = true;
    const g = gapPiksler();
    const heleOrdet = n === 1 || g.every(v => v <= 0.5);

    if (heleOrdet){
      /* Kortene ligger inntil hverandre – da høres ordet som ett ord. */
      lysAlle(true);
      siRekke(["ord-" + o.fil], [0], null, () => {
        leser = false;
        lysAlle(false);
        fullfor();
      });
      return;
    }

    const navn = o.lyd.map(bokstavFil);
    const pauser = g.map(v => Math.round(klem(gapMaks > 0 ? v/gapMaks : 0, 0, 1) * MAKSPAUSE));
    pauser.push(0);
    siRekke(navn, pauser, i => lysOpp(i), () => { leser = false; lysOpp(-1); });
  }

  function fullfor(){
    if (ferdig) return;
    ferdig = true;
    spor.classList.add("samlet");
    fasit.classList.add("vis");
    hint.textContent = "Ordet ble " + o.ord.toUpperCase() + "!";
    const r = fasit.getBoundingClientRect();
    konfetti(r.left + r.width/2, r.top + r.height/2, 40, 0.9);
    valg.paaRiktig && valg.paaRiktig();
    valg.paaFerdig && senere(valg.paaFerdig, 1500);
  }

  /* --- dra --- */
  let dragI = -1, dragStartX = 0, dragStartP = 0;

  function normaliser(i){
    const kant = Math.max(6, sporB * 0.02);
    for (let j=i+1;j<n;j++) p[j] = Math.max(p[j], p[j-1] + kortB);
    for (let j=i-1;j>=0;j--) p[j] = Math.min(p[j], p[j+1] - kortB);
    const minX = kant, maksX = sporB - kant - kortB;
    if (p[0] < minX){
      const d = minX - p[0];
      for (let j=0;j<n;j++) p[j] += d;
      for (let j=1;j<n;j++) p[j] = Math.max(p[j], p[j-1] + kortB);
    }
    if (p[n-1] > maksX){
      const d = p[n-1] - maksX;
      for (let j=0;j<n;j++) p[j] -= d;
      for (let j=n-2;j>=0;j--) p[j] = Math.min(p[j], p[j+1] - kortB);
    }
  }

  kort.forEach((d, i) => {
    d.addEventListener("pointerdown", e => {
      if (ferdig) return;
      e.preventDefault();
      dragI = i; dragStartX = e.clientX; dragStartP = p[i];
      d.classList.add("drar");
      try { d.setPointerCapture(e.pointerId); } catch(err){}
      stoppTale();
      leser = false;
      lysOpp(-1);
      if (lydPaa) si(bokstavFil(o.lyd[i])); else lydKlikk();
    });
    d.addEventListener("pointermove", e => {
      if (dragI !== i) return;
      e.preventDefault();
      const kant = Math.max(6, sporB * 0.02);
      p[i] = klem(dragStartP + (e.clientX - dragStartX), kant, sporB - kant - kortB);
      normaliser(i);
      tegn();
    });
    const slipp = e => {
      if (dragI !== i) return;
      dragI = -1;
      d.classList.remove("drar");
      try { d.releasePointerCapture(e.pointerId); } catch(err){}
      fest();
      senere(lesOpp, 180);
    };
    d.addEventListener("pointerup", slipp);
    d.addEventListener("pointercancel", slipp);
  });

  les.addEventListener("click", () => { stoppTale(); leser = false; lesOpp(); });

  plasser();

  return {
    ord: o,
    settOrdtekst: paa => {
      bilde._tekst.style.display = paa ? "" : "none";
    },
    settBilde: paa => {
      if (paa || ferdig) fasit.classList.add("vis");
      else fasit.classList.remove("vis");
    },
    nyStorrelse: () => plasser(),
    visMeg: () => {
      if (ferdig) return;
      stoppTale(); leser = false;
      andel = andel.map(()=>0);
      samlet = true;
      plasser();
      senere(lesOpp, 320);
    },
    sporsmaal: () => si("dra-sammen")
  };
}

/* ============================================================
   OPPGAVE 2 – HVILKET ORD BLIR DET?
   ============================================================ */
function lagFinnFlate(vert, farge, valg){
  const fasit = nesteOrd();
  const kortOrd = bland([fasit, ...velgDistraktorer(fasit, app.valg - 1)]);

  const rot = document.createElement("div");
  rot.className = "finnoppg";

  /* lydremsa – bokstavene som skal lyderes */
  const remse = document.createElement("div");
  remse.className = "lydremse";
  const spillKn = document.createElement("button");
  spillKn.type = "button"; spillKn.className = "lesknapp"; spillKn.textContent = "▶ Hør";
  remse.appendChild(spillKn);
  const remsekort = fasit.lyd.map(ch => {
    const d = document.createElement("div");
    d.className = "remsekort" + (ER_VOKAL.has(ch) ? " vokal" : "");
    d.textContent = ch;
    remse.appendChild(d);
    return d;
  });

  /* svaralternativene */
  const rad = document.createElement("div");
  rad.className = "kortrad";
  const kols = kortOrd.length <= 3 ? kortOrd.length : kortOrd.length === 4 ? 2 : 3;
  rad.style.setProperty("--kols", kols);
  rad.style.setProperty("--rader", Math.ceil(kortOrd.length / kols));

  const tekster = [];
  const kortEl = [];
  kortOrd.forEach(o => {
    const kn = document.createElement("button");
    kn.className = "kort"; kn.type = "button";
    const boks = lagBildeboks(o, false);
    kn.appendChild(boks);
    tekster.push(boks._tekst);
    kn._ord = o; kn._boks = boks;
    kn.addEventListener("click", () => svar(kn, o));
    rad.appendChild(kn);
    kortEl.push(kn);
  });

  /* Bildene øverst, lydremsa med ▶ Hør nederst – der eleven rekker den. */
  rot.appendChild(rad); rot.appendChild(remse);
  vert.appendChild(rot);

  let ferdig = false;

  function lysOpp(i){
    remsekort.forEach((d, j) => d.classList.toggle("lyser", i === j));
  }
  function hoer(){
    if (ferdig) return;
    const pause = TEMPO[app.tempo].ms;
    const navn = fasit.lyd.map(bokstavFil);
    const pauser = navn.map((_, i) => i === navn.length - 1 ? 0 : pause);
    siRekke(navn, pauser, i => lysOpp(i), () => lysOpp(-1));
  }
  spillKn.addEventListener("click", hoer);

  function svar(kn, o){
    if (ferdig) return;
    if (o.fil === fasit.fil){
      ferdig = true;
      rad.classList.add("laast");
      kn.classList.add("rett");
      merke(kn._boks, "✓");
      valg.paaRiktig && valg.paaRiktig();
      si("riktig", "ord-" + fasit.fil);
      valg.paaFerdig && senere(valg.paaFerdig, 900);
    } else {
      kn.classList.add("feil");
      lydFeil();
      merke(kn._boks, "✕");
      setTimeout(()=>{ kn.classList.remove("feil"); kn.classList.add("dempet"); }, 380);
      valg.paaBom && valg.paaBom();
      si("proev-igjen");
    }
  }

  return {
    ord: fasit,
    settOrdtekst: paa => tekster.forEach(t => { t.style.display = paa ? "" : "none"; }),
    settBilde: () => {},
    nyStorrelse: () => {},
    visMeg: () => {
      const treff = kortEl.find(k => k._ord.fil === fasit.fil);
      if (!treff) return;
      treff.classList.add("rett");
      si("ord-" + fasit.fil);
      setTimeout(()=>{ if (!ferdig) treff.classList.remove("rett"); }, 1600);
    },
    sporsmaal: () => {
      const pause = TEMPO[app.tempo].ms;
      const navn = ["hvilket-ord", ...fasit.lyd.map(bokstavFil)];
      const pauser = navn.map((_, i) => (i === 0 || i === navn.length - 1) ? (i === 0 ? 250 : 0) : pause);
      siRekke(navn, pauser, i => lysOpp(i - 1), () => lysOpp(-1));
    }
  };
}

/* ============================================================
   OPPGAVE 3 – BYGG ORDET
   ============================================================ */
function lagByggFlate(vert, farge, valg){
  const o = nesteOrd();
  const n = o.lyd.length;

  const rot = document.createElement("div");
  rot.className = "byggoppg";

  const bilderamme = document.createElement("div");
  bilderamme.className = "byggbilde";
  const bilde = lagBildeboks(o, true);
  bilderamme.appendChild(bilde);

  const fasitord = document.createElement("div");
  fasitord.className = "byggord";
  fasitord.textContent = o.ord.toUpperCase();
  fasitord.style.display = app.visOrd ? "" : "none";

  const slisserad = document.createElement("div");
  slisserad.className = "slissrad";
  const slisser = o.lyd.map((ch, i) => {
    const d = document.createElement("div");
    d.className = "slisse" + (i === 0 ? " neste" : "");
    d.dataset.i = i;
    slisserad.appendChild(d);
    return d;
  });

  /* Bokstavbanken: ordets egne lyder, blandet, pluss to lokkebokstaver
     som ikke finnes i ordet. */
  const ekstra = [];
  const brukte = new Set(o.lyd);
  const alfabet = bland([...new Set(aktiveOrd().flatMap(x => x.lyd))]);
  for (const ch of alfabet){
    if (ekstra.length >= 2) break;
    if (!brukte.has(ch)) ekstra.push(ch);
  }
  const bankBokstaver = bland([...o.lyd, ...ekstra]);

  const bankrad = document.createElement("div");
  bankrad.className = "bankrad";
  const banktaster = bankBokstaver.map(ch => {
    const kn = document.createElement("button");
    kn.type = "button";
    kn.className = "banktast" + (ER_VOKAL.has(ch) ? " vokal" : "");
    kn.textContent = ch;
    kn._ch = ch;
    kn.addEventListener("click", () => velg(kn));
    bankrad.appendChild(kn);
    return kn;
  });

  rot.appendChild(bilderamme);
  rot.appendChild(fasitord);
  rot.appendChild(slisserad);
  rot.appendChild(bankrad);
  vert.appendChild(rot);

  let neste = 0, ferdig = false;

  function velg(kn){
    if (ferdig) return;
    const ch = kn._ch;
    if (ch === o.lyd[neste]){
      const s = slisser[neste];
      s.textContent = ch;
      s.classList.remove("neste");
      s.classList.add("full");
      if (ER_VOKAL.has(ch)) s.classList.add("vokal");
      kn.classList.add("brukt");
      si(bokstavFil(ch));
      neste++;
      if (neste < n) slisser[neste].classList.add("neste");
      else senere(trekkSammen, 550);
    } else {
      kn.classList.add("feil");
      lydFeil();
      setTimeout(()=>kn.classList.remove("feil"), 400);
      valg.paaBom && valg.paaBom();
      si(bokstavFil(ch), "proev-igjen");
    }
  }

  /* Alle lydene er på plass – da leser vi dem raskt etter hverandre og
     lar dem gli over i hele ordet. Det er den samme sammentrekninga som
     i «Dra sammen», bare at eleven har lagt lydene selv. */
  function trekkSammen(){
    if (ferdig) return;
    ferdig = true;
    bankrad.classList.add("laast");
    const navn = [...o.lyd.map(bokstavFil), "ord-" + o.fil];
    const pauser = navn.map((_, i) => i < n - 1 ? 120 : 0);
    siRekke(navn, pauser, i => {
      slisser.forEach((s, j) => s.classList.toggle("lyser", i === j || (i === n && j >= 0)));
    }, () => {
      slisser.forEach(s => s.classList.remove("lyser"));
      fasitord.style.display = "";
      const r = slisserad.getBoundingClientRect();
      konfetti(r.left + r.width/2, r.top + r.height/2, 40, 0.9);
      valg.paaRiktig && valg.paaRiktig();
      valg.paaFerdig && senere(valg.paaFerdig, 900);
    });
  }

  return {
    ord: o,
    settOrdtekst: paa => {
      fasitord.style.display = (paa || ferdig) ? "" : "none";
      bilde._tekst.style.display = paa ? "" : "none";
    },
    settBilde: () => {},
    nyStorrelse: () => {},
    visMeg: () => {
      if (ferdig) return;
      const treff = banktaster.find(k => !k.classList.contains("brukt") && k._ch === o.lyd[neste]);
      if (!treff) return;
      treff.classList.add("hint");
      si(bokstavFil(o.lyd[neste]));
      setTimeout(()=>treff.classList.remove("hint"), 1600);
    },
    sporsmaal: () => si("bygg-ordet")
  };
}

function lagOppgave(vert, farge, valg){
  if (app.oppgave === "finn") return lagFinnFlate(vert, farge, valg);
  if (app.oppgave === "bygg") return lagByggFlate(vert, farge, valg);
  return lagDraFlate(vert, farge, valg);
}

/* ============================================================
   FELLESDELER – monster, teller, jubel
   ============================================================ */
function monsterBoks(lag, ropTekst){
  const d = document.createElement("div");
  d.className = "heier"; d.style.color = lag.farge;
  const img = document.createElement("img");
  img.className = "monster"; img.alt = "Monsteret " + lag.navn;
  img.src = monsterUrl(lag.fil);
  img.onerror = () => { img.onerror = null; img.src = monsterReserve(lag.fil); };
  const navn = document.createElement("div");
  navn.className = "navn"; navn.style.color = lag.morkt; navn.textContent = lag.navn;
  const boble = document.createElement("div");
  boble.className = "boble"; boble.textContent = ropTekst || tilfeldig(HEIAROP);
  d.appendChild(boble); d.appendChild(img); d.appendChild(navn);
  d._boble = boble; d._img = img;
  return d;
}

function lagTeller(fargeFn){
  const t = document.createElement("div");
  t.className = "teller";
  for (let i=1;i<=app.runder;i++){
    const b = document.createElement("div");
    b.className = "tellerboks"; b.dataset.n = i;
    b.style.borderColor = fargeFn(i-1);
    b.innerHTML = '<span class="tallet">' + i + '</span>';
    t.appendChild(b);
  }
  return t;
}
function fyllTeller(teller, n, farge){
  const b = teller && teller.querySelector('.tellerboks[data-n="' + n + '"]');
  if (!b) return;
  b.classList.add("full");
  b.innerHTML = '<span class="hake">✓</span>';
  b.style.background = farge;
}
function tomTeller(teller, fargeFn){
  teller && teller.querySelectorAll(".tellerboks").forEach(b => {
    b.className = "tellerboks"; b.style.background = ""; b.style.borderColor = fargeFn(+b.dataset.n - 1);
    b.innerHTML = '<span class="tallet">' + b.dataset.n + '</span>';
  });
}

function visJubel(tekst, farge, knapper, tid){
  skjulJubel();
  const j = document.createElement("div");
  j.className = "jubel vis"; j.id = "jubel";
  const t = document.createElement("div"); t.className = "tekst"; t.textContent = tekst;
  if (farge) t.style.background = farge;
  j.appendChild(t);
  if (knapper){
    const v = document.createElement("div"); v.className = "valg";
    knapper.forEach(k => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = k.tekst;
      if (k.sek) b.className = "sek";
      b.addEventListener("click", () => { skjulJubel(); k.gjor(); });
      v.appendChild(b);
    });
    j.appendChild(v);
  }
  $("#scene").appendChild(j);
  if (tid) setTimeout(skjulJubel, tid);
}
function skjulJubel(){ const j = $("#jubel"); if (j) j.remove(); }

/* ============================================================
   SCENE
   ============================================================ */
function nyRunde(){
  stoppTimere();
  stoppTale();
  app.tur = 0; app.rep = 0; app.flater = [];
  skjulJubel();
  fyllOrdkoe();
  const scene = $("#scene"); scene.innerHTML = "";
  byggTur(scene);
}

/* ---------- ÉN ELEV OM GANGEN ---------- */
function byggTur(scene){
  const rot = document.createElement("div"); rot.className = "tur";

  const topp = document.createElement("div"); topp.className = "topplinje";
  /* Er det bare én elev på økta, trenger vi ingen stripe med hvem som
     har tur – da er det alltid den samme. */
  const stripe = document.createElement("div"); stripe.className = "elevstripe";
  for (let i=0;i<app.antall;i++){
    const m = document.createElement("div"); m.className = "elevmerke"; m.dataset.i = i;
    m.style.borderColor = LAG[i].farge;
    const img = document.createElement("img");
    img.src = monsterUrl(LAG[i].fil); img.alt = LAG[i].navn;
    img.onerror = () => { img.onerror = null; img.src = monsterReserve(LAG[i].fil); };
    m.appendChild(img);
    stripe.appendChild(m);
  }
  const oppdrag = document.createElement("div");
  oppdrag.className = "oppdrag";
  oppdrag.innerHTML = OPPGAVER[app.oppgave].tittel;
  const teller = lagTeller(n => forsokFarge(0, n));
  if (app.antall > 1) topp.appendChild(stripe);
  topp.appendChild(oppdrag); topp.appendChild(teller);

  const arena = document.createElement("div"); arena.className = "arena";
  arena.style.borderColor = forsokFarge(0, 0);
  const heier = monsterBoks(LAG[0]);
  const felt = document.createElement("div"); felt.className = "felt";
  arena.appendChild(heier); arena.appendChild(felt);

  rot.appendChild(topp); rot.appendChild(arena); scene.appendChild(rot);

  app._teller = teller; app._arena = arena; app._felt = felt;
  app._stripe = stripe; app._heier = heier; app._oppdrag = oppdrag;
  merkAktivElev();
  lagTurFlate();
}

function merkAktivElev(){
  app._stripe && app._stripe.querySelectorAll(".elevmerke").forEach(m => {
    const i = +m.dataset.i;
    m.classList.toggle("aktiv", i === app.tur);
    m.classList.toggle("ferdig", i < app.tur);
  });
}

function lagTurFlate(){
  const heier = app._heier;
  const farge = forsokFarge(app.tur, app.rep);
  app._felt.innerHTML = "";
  app._arena.style.borderColor = farge;
  app.flater = [ lagOppgave(app._felt, farge, {
    paaRiktig: () => { heier._img.classList.add("heia"); heier._boble.textContent = tilfeldig(JUBELROP); },
    paaBom:    () => { heier._boble.textContent = tilfeldig(BOMROP); },
    paaFerdig: () => turFerdigOppgave()
  }) ];
  app.flater[0].sporsmaal();
}

function turFerdigOppgave(){
  const heier = app._heier;
  const farge = forsokFarge(app.tur, app.rep);
  app.rep++;
  fyllTeller(app._teller, app.rep, farge);
  heier._img.classList.add("heia");
  const r = app._arena.getBoundingClientRect();

  if (app.rep < app.runder){
    lydRunde();
    konfetti(r.left + r.width/2, r.top + r.height/2, 30, 0.8);
    const igjen = app.runder - app.rep;
    heier._boble.textContent = igjen === 1 ? "Ett igjen!" : igjen + " igjen!";
    senere(()=>{ heier._img.classList.remove("heia"); lagTurFlate(); }, 2100);
    return;
  }

  lydFerdig();
  konfetti(r.left + r.width/2, r.top + r.height/2, 80, 1.1);
  heier._boble.textContent = tilfeldig(JUBELROP);
  app.tur++; app.rep = 0;

  /* Talen skal rekke å bli ferdig før neste replikk starter – siRekke()
     avbryter den forrige. Leser du inn lengre mp3-er enn dagens, må
     tallene under opp tilsvarende. */
  if (app.tur < app.antall){
    senere(()=>{
      visJubel("NESTE ELEV!", LAG[app.tur].farge, null, 2400);
      si("neste-elev");
      senere(()=>{
        const nyttLag = LAG[app.tur];
        app._arena.style.borderColor = nyttLag.farge;
        const nyHeier = monsterBoks(nyttLag);
        app._arena.replaceChild(nyHeier, app._heier);
        app._heier = nyHeier;
        tomTeller(app._teller, n => forsokFarge(app.tur, n));
        merkAktivElev();
        lagTurFlate();
      }, 2400);
    }, 2200);
  } else {
    merkAktivElev();
    senere(alleFerdige, 2200);
  }
}

function alleFerdige(){
  lydFanfare(); storKonfetti();
  si("alle-sammen");
  visJubel("🎉 SUPERT! 🎉", null, [
    { tekst:"Nye ord →", gjor:nyRunde },
    { tekst:"Samme oppgave ↺", sek:true, gjor:nyRunde }
  ]);
}

/* ---------- nytt ord uten å telle det forrige som ferdig ----------
   Trykker læreren «Nytt ord» rett etter at eleven ble ferdig, ligger det
   fortsatt en utløser og venter på å telle svaret. Den må dø her – ellers
   teller den på ordet som nettopp ble bygd i stedet. */
function hoppTilNeste(){
  stoppTimere();
  stoppTale();
  lagTurFlate();
}

/* ============================================================
   VOKALER OG ORDLENGDE I SPILL
   ------------------------------------------------------------
   Valget huskes på denne maskina til neste gang.
   ============================================================ */
const VOKAL_NOKKEL  = "myntland-ordbyggeren-vokaler-v1";
const LENGDE_NOKKEL = "myntland-ordbyggeren-lengde-v1";
const LENGDER = [
  { key:"alle",  tekst:"📏 Alle lengder" },
  { key:"korte", tekst:"📏 Korte ord (2–3 lyder)" },
  { key:"lange", tekst:"📏 Lange ord (4+ lyder)" }
];

function lastVokaler(){
  try {
    const a = JSON.parse(localStorage.getItem(VOKAL_NOKKEL));
    if (Array.isArray(a) && a.length) return new Set(a.filter(k => VOKALER.includes(k)));
  } catch(e){}
  return new Set(VOKALER);
}
function lagreVokaler(){
  try { localStorage.setItem(VOKAL_NOKKEL, JSON.stringify([...app.aktive])); } catch(e){}
}
function lastLengde(){
  try {
    const v = localStorage.getItem(LENGDE_NOKKEL);
    if (LENGDER.some(l => l.key === v)) return v;
  } catch(e){}
  return "alle";
}
function lagreLengde(){
  try { localStorage.setItem(LENGDE_NOKKEL, app.lengde); } catch(e){}
}

function antallMedVokal(v){ return ORD.filter(o => o.vok === v && lengdeOK(o)).length; }

function byggVokaler(){
  const boks = $("#vokalrad"); boks.innerHTML = "";
  VOKALER.forEach(v => {
    const kn = document.createElement("button");
    kn.type = "button";
    kn.className = "vtast";
    kn.dataset.k = v;
    kn.innerHTML = '<span class="vok">' + v + '</span><span class="ant">' + antallMedVokal(v) + '</span>';
    kn.setAttribute("aria-pressed", app.aktive.has(v) ? "true" : "false");
    kn.title = ORD.filter(o => o.vok === v).map(o => o.ord).join(", ");
    kn.addEventListener("click", () => vekslVokal(v));
    boks.appendChild(kn);
  });
  oppdaterOrdtall();
}

function tegnVokalknapper(){
  document.querySelectorAll(".vtast").forEach(kn => {
    kn.setAttribute("aria-pressed", app.aktive.has(kn.dataset.k) ? "true" : "false");
    const ant = kn.querySelector(".ant");
    if (ant) ant.textContent = antallMedVokal(kn.dataset.k);
  });
}

function oppdaterOrdtall(){
  const felt = $("#ordtall");
  const valgte = ORD.filter(o => app.aktive.has(o.vok) && lengdeOK(o));
  if (valgte.length < 2){
    felt.textContent = "for få ord valgt – bruker alle";
    felt.classList.add("tom");
    return;
  }
  const vok = new Set(valgte.map(o => o.vok));
  felt.textContent = vok.size + (vok.size === 1 ? " vokal · " : " vokaler · ") + valgte.length + " ord";
  felt.classList.remove("tom");
}

/* Å skru en vokal av og på skal ikke rive scenen fra eleven som holder
   på – vi bytter bare ut køen, så slår det inn fra neste ord. */
function vekslVokal(v){
  if (app.aktive.has(v)) app.aktive.delete(v); else app.aktive.add(v);
  lagreVokaler(); tegnVokalknapper(); oppdaterOrdtall(); fyllOrdkoe();
}
function settVokaler(nokler){
  app.aktive = new Set(nokler);
  lagreVokaler(); tegnVokalknapper(); oppdaterOrdtall(); fyllOrdkoe();
}

/* ============================================================
   LÆRERLINJA
   ============================================================ */
function oppdaterKnapper(){
  const erDra  = app.oppgave === "dra";
  const erFinn = app.oppgave === "finn";
  $("#valgKnapp").classList.toggle("skjult", !erFinn);
  $("#tempoKnapp").classList.toggle("skjult", !erFinn);
  $("#bildeKnapp").classList.toggle("skjult", !erDra);
  $("#antallKnapp").textContent = "👥 " + app.antall + (app.antall === 1 ? " elev" : " elever");
  $("#runderKnapp").textContent = "🔁 " + app.runder + " ord";
  $("#valgKnapp").textContent = "🖼 " + app.valg + " valg";
  $("#tempoKnapp").textContent = TEMPO[app.tempo].tekst;
  $("#bildeKnapp").textContent = app.visBilde ? "🖼 Bilde hele tida" : "🖼 Bilde til slutt";
  $("#bildeKnapp").classList.toggle("av", !app.visBilde);
  $("#ordKnapp").textContent = app.visOrd ? "📝 Ord på" : "📝 Ord av";
  $("#ordKnapp").classList.toggle("av", !app.visOrd);
  $("#lengdeKnapp").textContent = LENGDER.find(l => l.key === app.lengde).tekst;
}

$("#oppgavevelger").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  app.oppgave = b.dataset.oppgave;
  document.querySelectorAll("#oppgavevelger button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true":"false"));
  oppdaterKnapper(); nyRunde();
});
$("#alleVokaler").addEventListener("click", () => settVokaler(VOKALER));
$("#ingenVokaler").addEventListener("click", () => settVokaler([]));
$("#lettVokaler").addEventListener("click", () => settVokaler(LETTE_VOKALER));
$("#lengdeKnapp").addEventListener("click", () => {
  const i = LENGDER.findIndex(l => l.key === app.lengde);
  app.lengde = LENGDER[(i + 1) % LENGDER.length].key;
  lagreLengde(); oppdaterKnapper(); tegnVokalknapper(); oppdaterOrdtall(); fyllOrdkoe();
});
$("#antallKnapp").addEventListener("click", () => {
  app.antall = app.antall >= 4 ? 1 : app.antall + 1;
  oppdaterKnapper(); nyRunde();
});
$("#runderKnapp").addEventListener("click", () => {
  app.runder = app.runder >= 5 ? 1 : app.runder + 1;
  oppdaterKnapper(); nyRunde();
});
$("#valgKnapp").addEventListener("click", () => {
  app.valg = app.valg >= 5 ? 2 : app.valg + 1;
  oppdaterKnapper(); nyRunde();
});
$("#tempoKnapp").addEventListener("click", () => {
  app.tempo = (app.tempo + 1) % TEMPO.length;
  oppdaterKnapper();
});
$("#bildeKnapp").addEventListener("click", () => {
  app.visBilde = !app.visBilde;
  oppdaterKnapper();
  app.flater.forEach(f => f && f.settBilde && f.settBilde(app.visBilde));
});
$("#ordKnapp").addEventListener("click", () => {
  app.visOrd = !app.visOrd;
  oppdaterKnapper();
  app.flater.forEach(f => f && f.settOrdtekst && f.settOrdtekst(app.visOrd));
});
$("#visKnapp").addEventListener("click", () => {
  app.flater.forEach(f => f && f.visMeg && f.visMeg());
});
$("#nesteKnapp").addEventListener("click", hoppTilNeste);
$("#nullstillKnapp").addEventListener("click", nyRunde);

/* Sporet må måles på nytt når skjermen endrer størrelse – ellers ligger
   bokstavkortene på gamle piksler. */
let storrelseTimer = null;
addEventListener("resize", () => {
  clearTimeout(storrelseTimer);
  storrelseTimer = setTimeout(() => {
    app.flater.forEach(f => f && f.nyStorrelse && f.nyStorrelse());
  }, 140);
});

/* Første berøring låser opp lyd i nettleseren – da henter vi replikkene samtidig */
let lydVarmet = false;
["pointerdown","keydown"].forEach(h => addEventListener(h, () => {
  if (lydVarmet) return;
  lydVarmet = true;
  lydKontekst();
  forbered(...REPLIKKER);
  forbered(...VOKALER.map(bokstavFil));
}, { once:false, passive:true }));

$("#lydKnapp").addEventListener("click", () => {
  lydPaa = !lydPaa;
  $("#lydKnapp").textContent = lydPaa ? "🔊" : "🔇";
  $("#lydKnapp").classList.toggle("av", !lydPaa);
  if (lydPaa) lydKontekst();
  else stoppTale();
});
$("#fullKnapp").addEventListener("click", () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  else document.exitFullscreen && document.exitFullscreen();
});
$("#rentKnapp").addEventListener("click", () => document.body.classList.add("rent"));
$("#visMenyKnapp").addEventListener("click", () => document.body.classList.remove("rent"));

/* --- tastatur for læreren --- */
addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight"){ hoppTilNeste(); return; }
  if (e.key === " "){ e.preventDefault(); nyRunde(); return; }
  if (e.key === "Enter"){ $("#visKnapp").click(); return; }
});

/* --- start --- */
app.aktive = lastVokaler();
app.lengde = lastLengde();
byggVokaler();
oppdaterKnapper();
nyRunde();
</script>
</body>
</html>
