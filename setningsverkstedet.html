    });
    const slipp = (e, bruk) => {
      if (!start || e.pointerId !== start.id) return;
      const draddNaa = flyttet;
      const maal = draddNaa ? lukeUnder(e.clientX, e.clientY, luker) : null;
      const rektNaa = draddNaa ? kort.getBoundingClientRect() : null;
      start = null; flyttet = false;
      luker.forEach(x => x.classList.remove("slippKlar"));
      if (draddNaa){
        kort._draddNaa = true;
        setTimeout(() => { kort._draddNaa = false; }, 260);
        kort.classList.remove("dras");
        kort.style.left = ""; kort.style.top = ""; kort.style.width = "";
        kort.style.transform = "";
        kort._plass.style.width = ""; kort._plass.style.height = "";
      }
      if (ferdig) return;
      /* Trykk uten å dra håndteres av click-lytteren over – gjør vi det
         her også, slår de to hverandre av og på igjen. */
      if (bruk && maal) legg(kort, maal, rektNaa);
    };
    kort.addEventListener("pointerup", e => slipp(e, true));
    kort.addEventListener("pointercancel", e => slipp(e, false));
  });

  return {
    fil: s.fil,
    settBilde: paa => { boks.style.display = paa ? "" : "none"; },
    visMeg: () => {
      const luke = forsteTomme();
      if (!luke) return;
      const kort = kortene.find(k => k._i === +luke.dataset.i && !k.classList.contains("brukt"));
      if (!kort) return;
      kort.classList.add("hint"); luke.classList.add("hint");
      tale(s.fil);
      setTimeout(() => { kort.classList.remove("hint"); luke.classList.remove("hint"); }, 2200);
    },
    sporsmaal: () => si("bygg-setningen", s.fil)
  };
}
</script>
<script>
/* ============================================================
   BUESPILLET – himmelen i «Ordet som mangler»
   ------------------------------------------------------------
   Eleven SPENNER BUEN selv: trykk hvor som helst i himmelen,
   dra bakover for å sikte (slyngemekanikk som i Buekonkurransen
   og Stavelsesverkstedet – dra ned, skyt opp), og slipp for å
   skyte. Pila følger en bue med tyngdekraft, så eleven må sikte,
   ikke bare peke.

   Fungerer også i «Flere samtidig»: hvert felt sporer sin egen
   peker, så fire fingre på tavla går fint.
   ============================================================ */
const BUE_SVG =
  '<svg viewBox="0 0 100 120" aria-hidden="true">' +
  '<path d="M12 78 Q50 6 88 78" fill="none" stroke="#8a5a2b" stroke-width="8" stroke-linecap="round"/>' +
  '<polyline class="streng" points="12,78 50,78 88,78" fill="none" stroke="#232a3f" stroke-width="3" stroke-linecap="round"/>' +
  '<g class="nokk">' +
  '<line x1="50" y1="78" x2="50" y2="22" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/>' +
  '<polygon points="50,8 41,26 59,26" fill="#e8473f" stroke="#232a3f" stroke-width="3"/>' +
  '<path d="M42 82 L50 68 L58 82 Z" fill="#2bb3c0" stroke="#232a3f" stroke-width="2.5"/>' +
  '</g>' +
  '</svg>';
const PIL_SVG =
  '<svg viewBox="0 0 24 80" aria-hidden="true">' +
  '<line x1="12" y1="76" x2="12" y2="14" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/>' +
  '<polygon points="12,2 4,20 20,20" fill="#e8473f" stroke="#232a3f" stroke-width="2.5"/>' +
  '<path d="M4 78 L12 64 L20 78 Z" fill="#2bb3c0" stroke="#232a3f" stroke-width="2"/>' +
  '</svg>';

/* Vinkelgrenser fra Buekonkurransen: pila kan bare skytes oppover. */
const SIKTE_MIN = -Math.PI + 0.22;
const SIKTE_MAKS = -0.22;
const MIN_DRAG = 14;      /* kortere drag enn dette = ikke noe skudd */

let bueHintVist = false;  /* «Dra, sikt og slipp!» vises til første skudd i økta */

/* Ballongene står på én rad, jevnt fordelt og med god klaring til
   kantene. Alt som henger her, skal kunne treffes fra buen – derfor
   ingen ballonger i hjørnene og ingen ekstra rad bak. */
function plasserBallonger(himmel, poster, ballongFarger){
  const n = poster.length;
  const plasser = poster.map((p, c) => ({ c, antall:n }));
  const stokket = bland(plasser);
  const ballonger = [];
  poster.forEach((p, i) => {
    const pl = stokket[i];
    const b = document.createElement("div");
    b._post = p;
    b.className = "ballong";
    b.style.left = (14 + 72 * (pl.c + 0.5) / pl.antall) + "%";
    b.style.top = (11 + Math.random() * 13) + "%";
    b.style.animationDuration = (2.6 + Math.random() * 1.2) + "s";
    b.style.animationDelay = (-Math.random() * 3) + "s";
    const kropp = document.createElement("div");
    kropp.className = "ballongkropp";
    kropp.style.background = ballongFarger[i % ballongFarger.length];
    kropp.textContent = p.vis || p.tekst;
    const snor = document.createElement("div");
    snor.className = "ballongsnor";
    snor.style.transform = "rotate(" + (Math.random() < 0.5 ? -5 : 5) + "deg)";
    b.appendChild(kropp); b.appendChild(snor);
    himmel.appendChild(b);
    ballonger.push(b);
  });
  return ballonger;
}

function byggBuehimmel(poster, treffFn){
  const himmel = document.createElement("div");
  himmel.className = "himmel";

  for (let i = 0; i < 3; i++){
    const sky = document.createElement("div");
    sky.className = "sky"; sky.textContent = "☁️";
    sky.style.top = (5 + Math.random() * 40) + "%";
    sky.style.left = "0";
    sky.style.animationDuration = (38 + Math.random() * 30) + "s";
    sky.style.animationDelay = (-Math.random() * 60) + "s";
    himmel.appendChild(sky);
  }

  const ballonger = plasserBallonger(himmel, poster, bland(FARGER));

  const bue = document.createElement("div");
  bue.className = "bue"; bue.innerHTML = BUE_SVG;
  himmel.appendChild(bue);
  const streng = bue.querySelector(".streng");
  const nokk = bue.querySelector(".nokk");

  const punkter = [];
  for (let i = 0; i < 6; i++){
    const p = document.createElement("div");
    p.className = "siktepunkt";
    himmel.appendChild(p);
    punkter.push(p);
  }

  let hint = null;
  if (!bueHintVist){
    hint = document.createElement("div");
    hint.className = "siktehint"; hint.textContent = "🏹 Dra, sikt og slipp!";
    himmel.appendChild(hint);
  }

  let laast = false, pilAktiv = false, sikte = null;

  /* ---------- geometri og fysikk ----------
     Alt skaleres etter himmelhøyden, så det kjennes likt i stor
     arena og i en liten firedelt celle. */
  const ankerX = () => himmel.clientWidth / 2;
  const ankerY = () => {
    const bh = bue.offsetHeight || 90;
    return himmel.clientHeight - 2 - bh * 0.22;   /* transform-origin 50% 78% */
  };
  /* Rikelig med kraft: mange elever drar rett fra strengen på buen,
     og da blir draget kort. Full kraft nås derfor allerede ved et
     drag på ~28 % av himmelhøyden, og selv det svakeste skuddet når
     halvveis opp. */
  const tyngde = () => himmel.clientHeight * 2.6;
  const fart = kraft => himmel.clientHeight * (1.6 + 1.9 * kraft);
  const maksDrag = () => Math.max(60, himmel.clientHeight * 0.28);

  function siktedata(){
    if (!sikte) return null;
    const dx = sikte.sx - sikte.cx, dy = sikte.sy - sikte.cy;
    const lengde = Math.hypot(dx, dy);
    if (lengde < 0.5) return null;
    let vinkel = Math.atan2(dy, dx);
    if (vinkel > 0) vinkel = (vinkel < Math.PI / 2) ? SIKTE_MAKS : SIKTE_MIN;
    vinkel = Math.min(SIKTE_MAKS, Math.max(SIKTE_MIN, vinkel));
    return { vinkel, kraft: Math.min(lengde, maksDrag()) / maksDrag(), lengde };
  }

  function tegnBue(d){
    if (!d){
      bue.style.transform = "translateX(-50%)";
      streng.setAttribute("points", "12,78 50,78 88,78");
      nokk.setAttribute("transform", "");
      punkter.forEach(p => { p.style.display = "none"; });
      return;
    }
    bue.style.transform = "translateX(-50%) rotate(" + (d.vinkel * 180 / Math.PI + 90) + "deg)";
    const pull = d.kraft * 26;
    streng.setAttribute("points", "12,78 50," + (78 + pull) + " 88,78");
    nokk.setAttribute("transform", "translate(0," + pull + ")");

    /* banen: samme fysikk som selve skuddet */
    const ax = ankerX(), ay = ankerY(), g = tyngde(), v = fart(d.kraft);
    const vx = Math.cos(d.vinkel) * v, vy = Math.sin(d.vinkel) * v;
    const B = himmel.clientWidth, H = himmel.clientHeight;
    punkter.forEach((p, i) => {
      const t = 0.09 + i * 0.075;
      const x = ax + vx * t, y = ay + vy * t + 0.5 * g * t * t;
      const inne = x > 6 && x < B - 6 && y > 6 && y < H - 6;
      p.style.display = inne ? "block" : "none";
      if (inne){ p.style.left = x + "px"; p.style.top = y + "px"; }
    });
  }

  /* ---------- sikting: én peker per himmel ---------- */
  himmel.addEventListener("pointerdown", e => {
    if (laast || pilAktiv || sikte) return;
    sikte = { id: e.pointerId, sx: e.clientX, sy: e.clientY, cx: e.clientX, cy: e.clientY };
    try { himmel.setPointerCapture(e.pointerId); } catch(err){}
    if (hint){ hint.remove(); hint = null; }
    e.preventDefault();
  });
  himmel.addEventListener("pointermove", e => {
    if (!sikte || e.pointerId !== sikte.id) return;
    sikte.cx = e.clientX; sikte.cy = e.clientY;
    tegnBue(siktedata());
  });
  function slippPeker(e, skyt){
    if (!sikte || e.pointerId !== sikte.id) return;
    sikte.cx = e.clientX; sikte.cy = e.clientY;
    const d = siktedata();
    sikte = null;
    tegnBue(null);
    if (skyt && !laast && !pilAktiv && d && d.lengde >= MIN_DRAG) skytPil(d);
  }
  himmel.addEventListener("pointerup", e => slippPeker(e, true));
  himmel.addEventListener("pointercancel", e => slippPeker(e, false));

  /* ---------- skuddet ---------- */
  function skytPil(d){
    pilAktiv = true;
    bueHintVist = true;
    nokk.style.opacity = "0";               /* pila har forlatt buen */
    lydPil();

    const pil = document.createElement("div");
    pil.className = "pilfly"; pil.innerHTML = PIL_SVG;
    himmel.appendChild(pil);
    const pb = pil.offsetWidth || 46, ph = pil.offsetHeight || pb * 80 / 24;

    const g = tyngde(), v = fart(d.kraft);
    const st = {
      x: ankerX() + Math.cos(d.vinkel) * 26,
      y: ankerY() + Math.sin(d.vinkel) * 26,
      vx: Math.cos(d.vinkel) * v,
      vy: Math.sin(d.vinkel) * v
    };
    let sist = performance.now();

    function ryddPil(){
      pil.remove();
      pilAktiv = false;
      nokk.style.opacity = "";
    }

    function tikk(naa){
      if (!himmel.isConnected){ return; }   /* flata er revet ned */
      const dt = Math.min(0.032, (naa - sist) / 1000); sist = naa;
      st.vy += g * dt;
      st.x += st.vx * dt;
      st.y += st.vy * dt;

      const retn = Math.atan2(st.vy, st.vx);
      pil.style.transform = "translate(" + (st.x - pb/2) + "px," + (st.y - ph/2) + "px) rotate(" + (retn * 180 / Math.PI + 90) + "deg)";

      /* treff? pilspissen mot ballongsentrum */
      const hr = himmel.getBoundingClientRect();
      const tuppX = st.x + Math.cos(retn) * ph * 0.45;
      const tuppY = st.y + Math.sin(retn) * ph * 0.45;
      for (const b of ballonger){
        if (!b.isConnected || b.classList.contains("treff-riktig") || b.classList.contains("treff-feil")) continue;
        const kr = b.querySelector(".ballongkropp").getBoundingClientRect();
        const cx = kr.left + kr.width/2 - hr.left;
        const cy = kr.top + kr.height/2 - hr.top;
        /* Litt romsligere enn ballongen ser ut – et skudd som streifer
           kanten skal telle. Seksåringer sikter ikke på pikselen. */
        const rx = kr.width * 0.68, ry = kr.height * 0.68;
        const nx = (tuppX - cx) / rx, ny = (tuppY - cy) / ry;
        if (nx * nx + ny * ny <= 1){
          ryddPil();
          treffFn(b, kr);
          return;
        }
      }

      /* utafor himmelen = bom, prøv igjen */
      if (st.y > himmel.clientHeight + 70 || st.x < -80 || st.x > himmel.clientWidth + 80 || st.y < -160){
        ryddPil();
        return;
      }
      requestAnimationFrame(tikk);
    }
    requestAnimationFrame(tikk);
  }

  return { el:himmel, ballonger, laas: () => { laast = true; } };
}

function smellPaa(b){
  const d = document.createElement("div");
  d.className = "ballongsmell"; d.textContent = "💥";
  b.appendChild(d);
  setTimeout(() => d.remove(), 800);
}

/* Ordet flyr fra ballongen som sprakk og ned i luka. */
function flygOrdTilLuke(rot, fraRekt, luke, tekst, ferdigCb){
  const rr = rot.getBoundingClientRect();
  const gr = luke.getBoundingClientRect();
  const s = document.createElement("span");
  s.className = "ordflyger"; s.textContent = tekst;
  rot.appendChild(s);
  const still = r => "translate(" + (r.left + r.width/2 - rr.left) + "px," + (r.top + r.height/2 - rr.top) + "px) translate(-50%,-50%)";
  s.style.transition = "none";
  s.style.transform = still(fraRekt);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    s.style.transition = "transform .5s cubic-bezier(.3,.7,.4,1)";
    s.style.transform = still(gr);
  }));
  senere(() => {
    s.remove();
    fyllLuke(luke, tekst);
    const g = luke.getBoundingClientRect();
    konfetti(g.left + g.width/2, g.top + g.height/2, 30, 0.8);
    ferdigCb && ferdigCb();
  }, 520);
}

/* ============================================================
   OPPGAVE 2 – ORDET SOM MANGLER
   ------------------------------------------------------------
   Hele setningen står ferdig bortsett fra ett ord. Tre ballonger
   svever – ett riktig ord og to av samme ordklasse. Treffer
   eleven feil, sprekker den ballongen og er ute av spill.
   Er det første ordet som mangler, står alle tre ballongene med
   stor forbokstav – ellers ville bokstaven røpet svaret.
   ============================================================ */
function lagManglerFlate(vert, farge, valg, unnta){
  const s = nesteSetning(unnta);
  forbered(s.fil);
  /* Luka legges på et ord det fins nok av samme slag til å lage
     avledere av. Bindeord (og, enn) og tallord er det for få av i
     banken – de hoppes over, ellers blir de to andre ballongene
     tilfeldig rot. */
  const kandidater = s.ord.map((o, i) => i).filter(i => "svapd".includes(s.k[i] || "s"));
  const valgbare = kandidater.length ? kandidater : s.ord.map((o, i) => i);
  const idx = tilfeldig(valgbare);
  const riktig = idx === 0 ? s.ord[0].toLowerCase() : s.ord[idx];

  const rot = document.createElement("div");
  rot.className = "buespill";
  rot.style.position = "relative";

  const topp = document.createElement("div");
  topp.className = "buetopp";
  const boks = lagBildeboks(s, true);
  boks.style.borderColor = farge;
  boks.style.display = app.visBilde ? "" : "none";
  const linje = lagSetningslinje(s, true);
  const luker = linje._luker;
  const gap = luker[idx];
  gap.classList.remove("fylt");
  gap.style.animation = "";
  gap.textContent = "?";
  topp.appendChild(boks); topp.appendChild(linje);

  const poster = bland([riktig, ...lagAvledere(s, idx, 2)])
    .map(o => ({ tekst:o, vis: idx === 0 ? stor(o) : o }));

  let ferdig = false;

  const himmel = byggBuehimmel(poster, (b, kr) => {
    lydSmell();
    smellPaa(b);
    if (b._post.tekst === riktig){
      ferdig = true;
      himmel.laas();
      b.classList.add("treff-riktig");
      valg.paaRiktig && valg.paaRiktig();
      flygOrdTilLuke(rot, kr, gap, idx === 0 ? stor(riktig) : riktig, () => {
        if (idx === 0) taleKort("stor-forbokstav");
      });
      senere(() => taleEtter("riktig", s.fil), 700);
      valg.paaFerdig && senere(valg.paaFerdig, 2500);
    } else {
      b.classList.add("treff-feil");
      lydFeil();
      valg.paaBom && valg.paaBom();
      tale("proev-igjen");
      senere(() => b.remove(), 500);
    }
  });

  rot.appendChild(topp); rot.appendChild(himmel.el);
  vert.appendChild(rot);

  return {
    fil: s.fil,
    settBilde: paa => { boks.style.display = paa ? "" : "none"; },
    visMeg: () => {
      if (ferdig) return;
      const b = himmel.ballonger.find(x => x._post.tekst === riktig && x.isConnected);
      if (!b) return;
      b.classList.add("markert");
      tale(s.fil);
      setTimeout(() => b.classList.remove("markert"), 1800);
    },
    sporsmaal: () => si("ordet-mangler", s.fil)
  };
}

function lagOppgave(vert, farge, valg, unnta){
  if (app.oppgave === "mangler") return lagManglerFlate(vert, farge, valg, unnta);
  if (app.oppgave === "slange")  return lagSlangeFlate(vert, farge, valg, unnta);
  return lagByggFlate(vert, farge, valg, unnta);
}
</script>

<script>
/* ============================================================
   OPPGAVE 3 – SLANGESPILLET
   ------------------------------------------------------------
   Klassisk snake, men uten død: brettet er et rutenett, slangen
   går jevnt framover, og eleven styrer med sveip hvor som helst
   på brettet, pilknappene nede i hjørnet eller piltastene på
   tastaturet. Et trykk uten sveip svinger slangen mot fingeren. Ordene i setningen
   ligger strødd utover, og slangen spiser dem i riktig
   rekkefølge: ordet med stor forbokstav først, punktumet sist.
   Feil ord gir bare en liten rist og «prøv igjen» – ordet blir
   stående. Går slangen ut av brettet, kommer den inn igjen på
   andre sida, og halen er ufarlig å krysse. For hvert spiste ord
   vokser halen litt og farten øker et knepp.

   Fungerer i «Flere samtidig»: hvert brett sporer sin egen
   peker, så fire slanger på tavla går fint.
   ============================================================ */
const RETNINGER = {
  ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0}
};
/* Hodet peker dit slangen går; SVG-ansiktet er tegnet med nesa opp. */
const SLANGE_GRADER = { "0,-1":0, "1,0":90, "0,1":180, "-1,0":270 };

let slangeHintVist = false;  /* «Sveip for å styre!» vises til første sving i økta */

/* To glade «nam»-toner når slangen får i seg riktig ord. */
function lydNam(){ tone(540,0.07,"triangle",0.13); tone(820,0.1,"triangle",0.13,0.07); }

function lagSlangeFlate(vert, farge, valg, unnta){
  const s = nesteSetning(unnta);
  forbered(s.fil);

  const rot = document.createElement("div");
  rot.className = "slangespill";

  /* bildet + setningslinja med tomme luker – fylles etter hvert
     som slangen spiser. Gjenbruker buetoppens størrelser. */
  const topp = document.createElement("div");
  topp.className = "buetopp";
  const boks = lagBildeboks(s, true);
  boks.style.borderColor = farge;
  boks.style.display = app.visBilde ? "" : "none";
  const linje = lagSetningslinje(s, false);
  const luker = linje._luker;
  topp.appendChild(boks); topp.appendChild(linje);

  const brett = document.createElement("div");
  brett.className = "slangebrett";

  rot.appendChild(topp); rot.appendChild(brett);
  vert.appendChild(rot);

  /* ordbrikkene: alle ordene + punktumet. Første ord beholder den
     store forbokstaven – det er ledetråden, akkurat som på kortene. */
  const poster = s.ord.map((o, i) => ({ tekst:o, i }));
  poster.push({ tekst:".", i:s.n, tegn:true });
  poster.forEach(p => {
    const el = document.createElement("div");
    el.className = "ordbrikke" + (p.tegn ? " tegn" : "");
    el.textContent = p.tekst;
    p.el = el; p.spist = false; p.inne = false;
    brett.appendChild(el);
  });

  /* pilknapper på skjermen – for dem som heller trykker enn sveiper */
  const dpad = document.createElement("div");
  dpad.className = "dpad";
  for (let i = 0; i < 9; i++){
    const tast = i === 1 ? "ArrowUp" : i === 3 ? "ArrowLeft" : i === 5 ? "ArrowRight" : i === 7 ? "ArrowDown" : null;
    if (!tast){
      const tom = document.createElement("span");
      tom.className = "tomrom";
      dpad.appendChild(tom);
      continue;
    }
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = i === 1 ? "▲" : i === 3 ? "◀" : i === 5 ? "▶" : "▼";
    b.setAttribute("aria-label", "Styr slangen " + (i === 1 ? "opp" : i === 3 ? "til venstre" : i === 5 ? "til høyre" : "ned"));
    b.addEventListener("pointerdown", e => {
      e.stopPropagation();              /* ikke start et sveip på brettet */
      e.preventDefault();
      settRetning(RETNINGER[tast]);
    });
    dpad.appendChild(b);
  }
  brett.appendChild(dpad);

  let hint = null;
  if (!slangeHintVist){
    hint = document.createElement("div");
    hint.className = "slangehint"; hint.textContent = "🐍 Sveip – eller trykk på pilene!";
    brett.appendChild(hint);
  }

  /* ---------- rutenett og tilstand ---------- */
  let rute = 0, kol = 0, rad = 0, ox = 0, oy = 0;
  let slange = [], ledd = [];
  let retning = {x:1,y:0}, nesteRetning = null, vinkelNaa = 90;
  let nesteIdx = 0, ferdig = false, vokse = 0, tikkMs = 330, startet = false;

  const cx = c => ox + (c.x + 0.5) * rute;
  const cy = c => oy + (c.y + 0.5) * rute;

  /* Regner ut rutenettet fra brettets faktiske størrelse – men
     banen holder seg alltid på rundt 90 ruter. På en bred tavle blir
     rutene STORE i stedet for at det blir flere av dem, så slangen
     aldri har lange ødemarker å krysse. */
  function maal(){
    const B = brett.clientWidth, H = brett.clientHeight;
    if (B < 60 || H < 60) return false;
    rute = Math.max(22, Math.min(84, Math.floor(Math.sqrt(B * H / 90))));
    kol = Math.max(6, Math.floor(B / rute));
    rad = Math.max(5, Math.floor(H / rute));
    ox = Math.round((B - kol * rute) / 2);
    oy = Math.round((H - rad * rute) / 2);
    /* sjakkbrett i to grønntoner, på linje med rutenettet */
    brett.style.backgroundImage = "conic-gradient(#e6f6d3 0 25%, #d8efc0 0 50%, #e6f6d3 0 75%, #d8efc0 0)";
    brett.style.backgroundSize = (rute * 2) + "px " + (rute * 2) + "px";
    brett.style.backgroundPosition = ox + "px " + oy + "px";
    return true;
  }

  /* Hodet snur alltid korteste vei, så det ikke spinner 270 grader. */
  function nyVinkel(){
    const m = SLANGE_GRADER[retning.x + "," + retning.y];
    vinkelNaa += (m - (vinkelNaa % 360) + 540) % 360 - 180;
  }

  function stillLedd(el, c, erHode, hopp){
    const st = el._st;
    const t = "translate(" + Math.round(cx(c) - st/2) + "px," + Math.round(cy(c) - st/2) + "px)"
            + (erHode ? " rotate(" + vinkelNaa + "deg)" : "");
    if (hopp){
      /* nytt ledd eller hopp gjennom veggen: ingen glidning tvers over brettet */
      el.style.transition = "none";
      el.style.transform = t;
      void el.offsetWidth;
      el.style.transition = "transform " + tikkMs + "ms linear";
    } else {
      el.style.transform = t;
    }
  }

  function lagLedd(i, c){
    const el = document.createElement("div");
    el.className = i === 0 ? "slangehode" : "slangeledd" + (i % 2 ? " lys" : "");
    const st = Math.round(rute * (i === 0 ? 0.94 : 0.84));
    el._st = st; el._c = c;
    el.style.width = st + "px"; el.style.height = st + "px";
    if (i === 0) el.innerHTML = '<span class="oye v"></span><span class="oye h"></span><span class="tunge"></span>';
    stillLedd(el, c, i === 0, true);
    brett.appendChild(el);
    return el;
  }

  /* ---------- ett steg fram ---------- */
  function steg(){
    if (nesteRetning){ retning = nesteRetning; nesteRetning = null; nyVinkel(); }
    const hode = { x:(slange[0].x + retning.x + kol) % kol,
                   y:(slange[0].y + retning.y + rad) % rad };
    slange.unshift(hode);
    if (vokse > 0) vokse--;
    else slange.pop();
    while (ledd.length < slange.length)
      ledd.push(lagLedd(ledd.length, slange[slange.length - 1]));
    for (let i = 0; i < slange.length; i++){
      const c = slange[i], g = ledd[i]._c;
      const hopp = !g || Math.abs(c.x - g.x) > 1 || Math.abs(c.y - g.y) > 1;
      ledd[i]._c = c;
      stillLedd(ledd[i], c, i === 0, hopp);
    }
    sjekkSpis();
  }

  /* Hodesenteret mot brikkerektangelet – med litt slingringsmonn.
     inne-flagget gjør at et feil ord bare sier fra én gang per
     besøk, ikke på hvert tikk mens slangen glir over. */
  function sjekkSpis(){
    const hr = brett.getBoundingClientRect();
    const hx = cx(slange[0]), hy = cy(slange[0]);
    for (const p of poster){
      if (p.spist || !p.el.isConnected) continue;
      const r = p.el.getBoundingClientRect();
      /* treffboksen er aldri smalere enn én rute – ellers kan små
         brikker («på», punktumet) falle mellom to rutesentre */
      const mx = Math.max(6, (rute - (r.right - r.left)) / 2 + 4);
      const my = Math.max(6, (rute - (r.bottom - r.top)) / 2 + 4);
      const inne = hx >= r.left - hr.left - mx && hx <= r.right - hr.left + mx &&
                   hy >= r.top - hr.top - my && hy <= r.bottom - hr.top + my;
      if (inne && !p.inne){ p.inne = true; spis(p); }
      else if (!inne) p.inne = false;
    }
  }

  function spis(p){
    if (ferdig) return;
    if (p.i !== nesteIdx){
      lydFeil();
      p.el.classList.add("feil");
      setTimeout(() => p.el.classList.remove("feil"), 400);
      valg.paaBom && valg.paaBom();
      tale("proev-igjen");
      return;
    }
    p.spist = true;
    const r = p.el.getBoundingClientRect();
    p.el.remove();
    lydNam();
    const erPunktum = p.i === s.n;
    const tekst = erPunktum ? "." : (p.i === 0 ? stor(p.tekst) : p.tekst);
    flygOrdTilLuke(rot, r, luker[p.i], tekst, () => {
      if (erPunktum){ lydPunktum(); taleKort("punktum"); }
      else if (p.i === 0) taleKort("stor-forbokstav");
    });
    nesteIdx++;
    vokse += 2;
    tikkMs = Math.max(230, tikkMs - 15);
    ledd.forEach(el => { el.style.transition = "transform " + tikkMs + "ms linear"; });
    if (nesteIdx > s.n) heleSetningen();
  }

  function heleSetningen(){
    ferdig = true;                      /* stopper tikkinga – slangen fryser fornøyd */
    valg.paaRiktig && valg.paaRiktig();
    const r = linje.getBoundingClientRect();
    konfetti(r.left + r.width/2, r.top + r.height/2, 55, 1);
    senere(() => taleEtter("riktig", s.fil), 600);
    valg.paaFerdig && senere(valg.paaFerdig, 2600);
  }

  /* ---------- ordbrikkene utover brettet ----------
     Brikkene ankres i tilfeldige ruter, klemmes innenfor kantene,
     og legges aldri oppå hverandre eller i slangens startbane. */
  function plasserBrikker(){
    const B = brett.clientWidth, H = brett.clientHeight;
    const lagt = [];
    /* hold brikkene unna pilknappene i hjørnet */
    const dr = dpad.getBoundingClientRect(), br = brett.getBoundingClientRect();
    lagt.push({ left:dr.left - br.left - 8, right:dr.right - br.left + 8,
                top:dr.top - br.top - 8, bottom:dr.bottom - br.top + 8 });
    const sy = Math.floor(rad / 2);
    const startSone = { left:0, right:ox + 6.5 * rute,
                        top:oy + (sy - 1.6) * rute, bottom:oy + (sy + 2.6) * rute };
    poster.forEach(p => {
      const bw = p.el.offsetWidth, bh = p.el.offsetHeight;
      let valgt = null;
      for (let fors = 0; fors < 240 && !valgt; fors++){
        const c = { x:Math.floor(Math.random() * kol), y:Math.floor(Math.random() * rad) };
        const x = Math.max(bw/2 + 6, Math.min(B - bw/2 - 6, cx(c)));
        const y = Math.max(bh/2 + 6, Math.min(H - bh/2 - 6, cy(c)));
        const r = { left:x - bw/2 - 8, right:x + bw/2 + 8, top:y - bh/2 - 8, bottom:y + bh/2 + 8 };
        const krasj = lagt.some(a => r.left < a.right && r.right > a.left && r.top < a.bottom && r.bottom > a.top)
          || (r.left < startSone.right && r.right > startSone.left && r.top < startSone.bottom && r.bottom > startSone.top);
        if (!krasj) valgt = { x, y, r };
      }
      if (!valgt){
        /* trangt brett (mange ord i liten celle): slipp sonekravet */
        const c = { x:Math.floor(Math.random() * kol), y:Math.floor(Math.random() * rad) };
        const x = Math.max(bw/2 + 6, Math.min(B - bw/2 - 6, cx(c)));
        const y = Math.max(bh/2 + 6, Math.min(H - bh/2 - 6, cy(c)));
        valgt = { x, y, r:{ left:x - bw/2 - 8, right:x + bw/2 + 8, top:y - bh/2 - 8, bottom:y + bh/2 + 8 } };
      }
      lagt.push(valgt.r);
      p.el.style.left = Math.round(valgt.x - bw/2) + "px";
      p.el.style.top = Math.round(valgt.y - bh/2) + "px";
    });
  }

  /* ---------- styring ---------- */
  function settRetning(r){
    if (!r || ferdig) return;
    if (r.x === retning.x && r.y === retning.y) return;
    if (r.x === -retning.x && r.y === -retning.y) return;   /* ikke rett bakover */
    nesteRetning = r;
    if (hint){ hint.remove(); hint = null; slangeHintVist = true; }
  }

  let sveip = null;
  brett.addEventListener("pointerdown", e => {
    sveip = { id:e.pointerId, x:e.clientX, y:e.clientY, flyttet:false };
    try { brett.setPointerCapture(e.pointerId); } catch(err){}
    e.preventDefault();
  });
  brett.addEventListener("pointermove", e => {
    if (!sveip || e.pointerId !== sveip.id) return;
    const dx = e.clientX - sveip.x, dy = e.clientY - sveip.y;
    if (Math.hypot(dx, dy) < 16) return;
    sveip.flyttet = true;
    settRetning(Math.abs(dx) > Math.abs(dy) ? { x:Math.sign(dx), y:0 } : { x:0, y:Math.sign(dy) });
    /* nullstill utgangspunktet, så eleven kan styre i én lang dragning */
    sveip.x = e.clientX; sveip.y = e.clientY;
  });
  brett.addEventListener("pointerup", e => {
    if (!sveip || e.pointerId !== sveip.id) return;
    if (!sveip.flyttet && slange.length){
      /* et rent trykk: sving mot fingeren */
      const hr = brett.getBoundingClientRect();
      const dx = e.clientX - hr.left - cx(slange[0]);
      const dy = e.clientY - hr.top - cy(slange[0]);
      settRetning(Math.abs(dx) > Math.abs(dy) ? { x:Math.sign(dx) || 1, y:0 } : { x:0, y:Math.sign(dy) || 1 });
    }
    sveip = null;
  });
  brett.addEventListener("pointercancel", e => { if (sveip && e.pointerId === sveip.id) sveip = null; });

  /* ---------- i gang ---------- */
  let sisteTikk = 0;
  function loop(naa){
    if (!brett.isConnected || ferdig) return;   /* flata er revet ned eller ferdig */
    if (startet && naa - sisteTikk >= tikkMs){ sisteTikk = naa; steg(); }
    requestAnimationFrame(loop);
  }
  function start(){
    if (!brett.isConnected) return;
    if (!maal()){ requestAnimationFrame(start); return; }
    const sy = Math.floor(rad / 2);
    const sx = Math.min(kol - 2, 3);
    slange = [ {x:sx,y:sy}, {x:(sx-1+kol)%kol,y:sy}, {x:(sx-2+kol)%kol,y:sy} ];
    slange.forEach((c, i) => ledd.push(lagLedd(i, c)));
    plasserBrikker();
    startet = true;
    sisteTikk = performance.now();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(start);

  return {
    fil: s.fil,
    styr: tast => settRetning(RETNINGER[tast]),
    settBilde: paa => { boks.style.display = paa ? "" : "none"; },
    visMeg: () => {
      if (ferdig) return;
      const p = poster.find(x => x.i === nesteIdx && !x.spist);
      if (!p || !p.el.isConnected) return;
      p.el.classList.add("hint");
      tale(s.fil);
      setTimeout(() => p.el.classList.remove("hint"), 2200);
    },
    sporsmaal: () => si("spis-ordene", s.fil)
  };
}
</script>

<script>
/* ============================================================
   FELLESDELER – monster, teller, jubel
   ============================================================ */
function monsterBoks(lag, ropTekst){
  const d = document.createElement("div");
  d.className = "heier"; d.style.color = lag.farge;
  const img = document.createElement("img");
  img.className = "monster"; img.alt = "Monsteret " + lag.navn;
  img.src = monsterUrl(lag.fil);
  img.onerror = () => { img.onerror = null; img.src = monsterReserve(lag.fil); };
  const navn = document.createElement("div");
  navn.className = "navn"; navn.style.color = lag.morkt; navn.textContent = lag.navn;
  const boble = document.createElement("div");
  boble.className = "boble"; boble.textContent = ropTekst || tilfeldig(aktivHeiarop());
  d.appendChild(boble); d.appendChild(img); d.appendChild(navn);
  d._boble = boble; d._img = img;
  return d;
}

function lagTeller(fargeFn){
  const t = document.createElement("div");
  t.className = "teller";
  for (let i=1;i<=app.runder;i++){
    const b = document.createElement("div");
    b.className = "tellerboks"; b.dataset.n = i;
    b.style.borderColor = fargeFn(i-1);
    b.innerHTML = '<span class="tallet">' + i + '</span>';
    t.appendChild(b);
  }
  return t;
}
function fyllTeller(teller, n, farge){
  const b = teller && teller.querySelector('.tellerboks[data-n="' + n + '"]');
  if (!b) return;
  b.classList.add("full");
  b.innerHTML = '<span class="hake">✓</span>';
  b.style.background = farge;
}
function tomTeller(teller, fargeFn){
  teller && teller.querySelectorAll(".tellerboks").forEach(b => {
    b.className = "tellerboks"; b.style.background = ""; b.style.borderColor = fargeFn(+b.dataset.n - 1);
    b.innerHTML = '<span class="tallet">' + b.dataset.n + '</span>';
  });
}

function visJubel(tekst, farge, knapper, tid){
  skjulJubel();
  const j = document.createElement("div");
  j.className = "jubel vis"; j.id = "jubel";
  const t = document.createElement("div"); t.className = "tekst"; t.textContent = tekst;
  if (farge) t.style.background = farge;
  j.appendChild(t);
  if (knapper){
    const v = document.createElement("div"); v.className = "valg";
    knapper.forEach(k => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = k.tekst;
      if (k.sek) b.className = "sek";
      b.addEventListener("click", () => { skjulJubel(); k.gjor(); });
      v.appendChild(b);
    });
    j.appendChild(v);
  }
  $("#scene").appendChild(j);
  if (tid) setTimeout(skjulJubel, tid);
}
function skjulJubel(){ const j = $("#jubel"); if (j) j.remove(); }
function visCelleJubel(celle, farge, tekst){
  const d = document.createElement("div");
  d.className = "cellejubel"; d.textContent = tekst;
  d.style.background = farge;
  celle.appendChild(d);
  setTimeout(()=>d.remove(), 1800);
}

/* ============================================================
   SCENE
   ============================================================ */
function nyRunde(){
  stoppTimere();
  app.tur = 0; app.rep = 0; app.flater = []; app.ferdigeSett = 0;
  skjulJubel();
  fyllKo();
  const scene = $("#scene"); scene.innerHTML = "";
  if (app.modus === "tur") byggTur(scene);
  else byggFlere(scene);
}

/* ---------- MODUS: TUR FOR TUR ---------- */
function byggTur(scene){
  const rot = document.createElement("div"); rot.className = "tur";

  const topp = document.createElement("div"); topp.className = "topplinje";
  const stripe = document.createElement("div"); stripe.className = "elevstripe";
  for (let i=0;i<app.antall;i++){
    const m = document.createElement("div"); m.className = "elevmerke"; m.dataset.i = i;
    m.style.borderColor = LAG[i].farge;
    const img = document.createElement("img");
    img.src = monsterUrl(LAG[i].fil); img.alt = LAG[i].navn;
    img.onerror = () => { img.onerror = null; img.src = monsterReserve(LAG[i].fil); };
    m.appendChild(img);
    stripe.appendChild(m);
  }
  const oppdrag = document.createElement("div");
  oppdrag.className = "oppdrag";
  oppdrag.innerHTML = OPPGAVER[app.oppgave].tittel;
  const teller = lagTeller(n => forsokFarge(0, n));
  topp.appendChild(stripe); topp.appendChild(oppdrag); topp.appendChild(teller);

  const arena = document.createElement("div"); arena.className = "arena";
  arena.style.borderColor = forsokFarge(0, 0);
  const heier = monsterBoks(LAG[0]);
  const felt = document.createElement("div"); felt.className = "felt";
  arena.appendChild(heier); arena.appendChild(felt);

  rot.appendChild(topp); rot.appendChild(arena); scene.appendChild(rot);

  app._teller = teller; app._arena = arena; app._felt = felt;
  app._stripe = stripe; app._heier = heier; app._oppdrag = oppdrag;
  merkAktivElev();
  lagTurFlate();
}

function merkAktivElev(){
  app._stripe && app._stripe.querySelectorAll(".elevmerke").forEach(m => {
    const i = +m.dataset.i;
    m.classList.toggle("aktiv", i === app.tur);
    m.classList.toggle("ferdig", i < app.tur);
  });
}

function lagTurFlate(){
  const heier = app._heier;
  const farge = forsokFarge(app.tur, app.rep);
  app._felt.innerHTML = "";
  app._arena.style.borderColor = farge;
  app.flater = [ lagOppgave(app._felt, farge, {
    paaRiktig: () => { heier._img.classList.add("heia"); heier._boble.textContent = tilfeldig(JUBELROP); },
    paaBom:    () => { heier._boble.textContent = tilfeldig(aktivBomrop()); },
    paaFerdig: () => turFerdigOppgave()
  }) ];
  app.flater[0].sporsmaal();
}

function turFerdigOppgave(){
  const heier = app._heier;
  const farge = forsokFarge(app.tur, app.rep);
  app.rep++;
  fyllTeller(app._teller, app.rep, farge);
  heier._img.classList.add("heia");
  const r = app._arena.getBoundingClientRect();

  if (app.rep < app.runder){
    lydRunde();
    konfetti(r.left + r.width/2, r.top + r.height/2, 30, 0.8);
    const igjen = app.runder - app.rep;
    heier._boble.textContent = igjen === 1 ? "Én igjen!" : igjen + " igjen!";
    senere(()=>{ heier._img.classList.remove("heia"); lagTurFlate(); }, pauseFor(2100));
    return;
  }

  lydFerdig();
  konfetti(r.left + r.width/2, r.top + r.height/2, 80, 1.1);
  heier._boble.textContent = tilfeldig(JUBELROP);
  app.tur++; app.rep = 0;

  /* Talen skal rekke å bli ferdig før neste replikk starter – si() avbryter
     den forrige. pauseFor() holder den vanlige pausen, men strekker den hvis
     det fortsatt står ros og setning igjen i talekøen. */
  if (app.tur < app.antall){
    senere(()=>{
      visJubel("NESTE ELEV!", LAG[app.tur].farge, null, 2400);
      si("neste-elev");
      senere(()=>{
        const nyttLag = LAG[app.tur];
        app._arena.style.borderColor = nyttLag.farge;
        const nyHeier = monsterBoks(nyttLag);
        app._arena.replaceChild(nyHeier, app._heier);
        app._heier = nyHeier;
        tomTeller(app._teller, n => forsokFarge(app.tur, n));
        merkAktivElev();
        lagTurFlate();
      }, 2400);
    }, pauseFor(2200));
  } else {
    merkAktivElev();
    senere(alleFerdige, pauseFor(2200));
  }
}

/* ---------- MODUS: FLERE SAMTIDIG ----------
   Gjelder begge oppgavene. Hver elev får sin egen setning, sitt
   eget kortbord eller sin egen himmel med egen bue. */
function byggFlere(scene){
  const rot = document.createElement("div"); rot.className = "grid4";
  rot.style.gridTemplateColumns = "repeat(" + app.antall + ",1fr)";
  rot.style.gridTemplateRows = "1fr";
  scene.appendChild(rot);
  app.flater = [];
  app._celler = [];

  for (let i=0;i<app.antall;i++){
    const lag = LAG[i];
    const celle = document.createElement("div"); celle.className = "celle";
    celle.style.borderColor = lag.farge;
    const heier = monsterBoks(lag);
    const merket = document.createElement("div");
    merket.className = "elevnr"; merket.style.color = lag.morkt; merket.textContent = "Elev 1";
    heier.appendChild(merket);
    const teller = lagTeller(n => forsokFarge(i, n));
    const felt = document.createElement("div"); felt.className = "felt";
    celle.appendChild(heier); celle.appendChild(teller); celle.appendChild(felt);
    rot.appendChild(celle);

    const st = { i, rep:0, elev:1, plass:i, lag, celle, heier, teller, felt, merket:merket };
    st.bygg = () => {
      felt.innerHTML = "";
      const brukte = app._celler.map(c => c.flate && c.flate.fil).filter(Boolean);
      st.flate = lagOppgave(felt, forsokFarge(st.plass, st.rep), {
        paaRiktig: () => { heier._img.classList.add("heia"); heier._boble.textContent = tilfeldig(JUBELROP); },
        paaBom:    () => { heier._boble.textContent = tilfeldig(aktivBomrop()); },
        paaFerdig: () => celleFerdigOppgave(st)
      }, brukte);
      app.flater[i] = st.flate;
    };
    app._celler.push(st);
    st.bygg();
  }
}

function celleFerdigOppgave(st){
  const farge = forsokFarge(st.plass, st.rep);
  st.rep++;
  fyllTeller(st.teller, st.rep, farge);
  st.heier._img.classList.add("heia");
  const r = st.celle.getBoundingClientRect();

  if (st.rep < app.runder){
    lydRunde();
    konfetti(r.left + r.width/2, r.top + r.height/2, 25, 0.8);
    const igjen = app.runder - st.rep;
    st.heier._boble.textContent = igjen === 1 ? "Én igjen!" : igjen + " igjen!";
    senere(()=>{ st.heier._img.classList.remove("heia"); st.bygg(); }, 1200);
    return;
  }

  lydFerdig();
  konfetti(r.left + r.width/2, r.top + r.height/2, 70, 1);
  st.celle.classList.add("ferdig");
  st.heier._boble.textContent = tilfeldig(JUBELROP);
  visCelleJubel(st.celle, st.lag.farge, "NESTE ELEV!");
  app.ferdigeSett++;
  const alleRundt = app.ferdigeSett % app.antall === 0;

  senere(()=>{
    st.rep = 0; st.elev++;
    st.plass += app.antall;
    st.merket.textContent = "Elev " + st.elev;
    st.celle.classList.remove("ferdig");
    st.heier._img.classList.remove("heia");
    st.heier._boble.textContent = "Din tur!";
    tomTeller(st.teller, n => forsokFarge(st.plass, n));
    st.bygg();
  }, 2000);

  if (alleRundt){
    senere(()=>{
      lydFanfare(); storKonfetti(); si("alle-sammen");
      visJubel("🎉 SUPERT! 🎉", null, null, 1700);
    }, 350);
  }
}

function alleFerdige(){
  lydFanfare(); storKonfetti();
  si("alle-sammen");
  visJubel("🎉 SUPERT! 🎉", null, [
    { tekst:"Nye setninger →", gjor:nyRunde },
    { tekst:"Samme oppgave ↺", sek:true, gjor:nyRunde }
  ]);
}

/* ---------- neste oppgave uten å telle den som ferdig ----------
   Trykker læreren «Neste» rett etter at eleven svarte riktig, ligger det
   fortsatt en utløser og venter på å telle svaret ferdig. Den må dø her –
   ellers teller den på setningen som nettopp ble bygd i stedet. */
function hoppTilNeste(){
  stoppTimere();
  if (app.modus === "tur"){
    lagTurFlate();
  } else {
    app._celler.forEach(st => st.bygg());
  }
}

/* ============================================================
   SETNINGSLENGDER I SPILL
   ------------------------------------------------------------
   Læreren slår 3, 4 og 5 ord av og på. Jobber klassen bare med
   korte setninger i starten, står 5-eren av. Valget huskes på
   denne maskina til neste gang.
   ============================================================ */
const GRUPPE_NOKKEL = "myntland-setningsverkstedet-lengder-v1";

function lastGrupper(){
  try {
    const a = JSON.parse(localStorage.getItem(GRUPPE_NOKKEL));
    if (Array.isArray(a) && a.length) return new Set(a.filter(n => LENGDER.includes(n)));
  } catch(e){}
  return new Set(LENGDER);
}
function lagreGrupper(){
  try { localStorage.setItem(GRUPPE_NOKKEL, JSON.stringify([...app.aktive])); } catch(e){}
}

function byggGrupper(){
  document.querySelectorAll(".ftast").forEach(kn => {
    const n = +kn.dataset.g;
    const liste = SETN_I_GRUPPE(n);
    kn.querySelector(".ant").textContent = liste.length;
    kn.title = liste.map(s => s.t).join("\n");
    kn.setAttribute("aria-pressed", app.aktive.has(n) ? "true" : "false");
    kn.addEventListener("click", () => vekslGruppe(n));
  });
  oppdaterOrdtall();
}
function tegnGruppeknapper(){
  document.querySelectorAll(".ftast").forEach(kn => {
    kn.setAttribute("aria-pressed", app.aktive.has(+kn.dataset.g) ? "true" : "false");
  });
}
function vekslGruppe(n){
  if (app.aktive.has(n)) app.aktive.delete(n); else app.aktive.add(n);
  lagreGrupper(); tegnGruppeknapper(); oppdaterOrdtall();
  fyllKo();
}

function oppdaterOrdtall(){
  const felt = $("#ordtall");
  const valgte = LENGDER.filter(n => app.aktive.has(n));
  if (!valgte.length){
    felt.textContent = "velg minst én lengde – bruker alle";
    felt.classList.add("tom");
    return;
  }
  const antall = utvalg().length;
  felt.textContent = antall + (antall === 1 ? " setning i spill" : " setninger i spill");
  felt.classList.remove("tom");
}

/* ============================================================
   LÆRERLINJA
   ============================================================ */
function oppdaterKnapper(){
  $("#antallKnapp").textContent = "👥 " + app.antall + (app.antall === 1 ? " elev" : " elever");
  $("#runderKnapp").textContent = "🔁 " + app.runder + (app.runder === 1 ? " setning" : " setninger");
  $("#bildeKnapp").textContent = app.visBilde ? "🖼️ Bilde på" : "🖼️ Bilde av";
  $("#bildeKnapp").classList.toggle("av", !app.visBilde);
}

$("#oppgavevelger").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  app.oppgave = b.dataset.oppgave;
  document.querySelectorAll("#oppgavevelger button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true":"false"));
  oppdaterKnapper(); oppdaterOrdtall(); nyRunde();
});
$("#modusvelger").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  app.modus = b.dataset.modus;
  document.querySelectorAll("#modusvelger button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true":"false"));
  oppdaterKnapper(); oppdaterOrdtall(); nyRunde();
});
$("#antallKnapp").addEventListener("click", () => {
  app.antall = app.antall >= 4 ? 1 : app.antall + 1;
  oppdaterKnapper(); nyRunde();
});
$("#runderKnapp").addEventListener("click", () => {
  app.runder = app.runder >= 5 ? 1 : app.runder + 1;
  oppdaterKnapper(); nyRunde();
});
$("#bildeKnapp").addEventListener("click", () => {
  app.visBilde = !app.visBilde;
  oppdaterKnapper();
  app.flater.forEach(f => f && f.settBilde && f.settBilde(app.visBilde));
});
$("#visKnapp").addEventListener("click", () => {
  app.flater.forEach(f => f && f.visMeg());
});
$("#nesteKnapp").addEventListener("click", hoppTilNeste);
$("#nullstillKnapp").addEventListener("click", nyRunde);

/* Første berøring låser opp lyd i nettleseren – da henter vi replikkene samtidig */
let lydVarmet = false;
["pointerdown","keydown"].forEach(h => addEventListener(h, () => {
  if (lydVarmet) return;
  lydVarmet = true;
  lydKontekst();
  forbered(...REPLIKKER);
}, { once:false, passive:true }));

$("#lydKnapp").addEventListener("click", () => {
  lydPaa = !lydPaa;
  $("#lydKnapp").textContent = lydPaa ? "🔊" : "🔇";
  $("#lydKnapp").classList.toggle("av", !lydPaa);
  if (lydPaa) lydKontekst();
  else stoppTale();
});
$("#fullKnapp").addEventListener("click", () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  else document.exitFullscreen && document.exitFullscreen();
});
$("#rentKnapp").addEventListener("click", () => document.body.classList.add("rent"));
$("#visMenyKnapp").addEventListener("click", () => document.body.classList.remove("rent"));

/* --- tastatur for læreren --- */
addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  /* I slangespillet styrer piltastene slangen – bruk «Neste setning»-
     knappen (eller mellomrom for ny runde) for å hoppe videre. */
  if (app.oppgave === "slange" && RETNINGER[e.key]){
    e.preventDefault();
    app.flater.forEach(f => f && f.styr && f.styr(e.key));
    return;
  }
  if (e.key === "ArrowRight"){ hoppTilNeste(); return; }
  if (e.key === " "){ e.preventDefault(); nyRunde(); return; }
  if (e.key === "Enter"){ $("#visKnapp").click(); return; }
});

/* --- start --- */
app.aktive = lastGrupper();
byggGrupper();
oppdaterKnapper();
nyRunde();
</script>
