<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Setningsverkstedet – Myntland</title>
<meta name="description" content="Eleven drar ordkortene på plass til en hel setning, skyter ordet som mangler – eller styrer slangen som spiser ordene i riktig rekkefølge. Stor forbokstav og punktum på plass. For interaktiv tavle og iPad – opptil fire elever samtidig.">
<meta name="theme-color" content="#232a3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Setningsverkstedet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='114' fill='%231e0f52'/%3E%3Ctext x='256' y='360' font-family='Arial Black,sans-serif' font-size='320' font-weight='900' text-anchor='middle' fill='%23EF9F27'%3EM%3C/text%3E%3C/svg%3E" type="image/svg+xml">

<!-- Delt Myntland-styling (palett + fonter). Inline-stilene under bygger videre på denne. -->
<link rel="stylesheet" href="myntland.css">

<style>
:root{
  --navy:#232a3f; --navy-soft:#3b4560;
  --krem:#fbf1d6; --krem-dyp:#f3e2b9; --krem-lys:#fffaeb;
  --amber:#efae2a; --amber-dyp:#c4841a;
  --raud:#e8473f; --gronn:#74c043; --gronn-dyp:#4f8f28; --teal:#2bb3c0;
  --himmel-1:#a6dff0; --himmel-2:#d8f2f8; --bakke:#8cc63f;
  --text:#232a3f; --muted:#6b7690; --border:var(--navy);
  --f1:#E23B2E; --f2:#1F7AE0; --f3:#17A05C; --f4:#EF9F27;
  --skygge:0 4px 0 rgba(35,42,63,.9);
  --skygge-mjuk:0 4px 0 rgba(35,42,63,.18);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; overflow:hidden; }
body{
  font-family:'Nunito',system-ui,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,var(--himmel-1) 0%,var(--himmel-2) 55%,#e9f7ea 78%,var(--bakke) 100%);
  display:flex; flex-direction:column;
  height:100dvh;
  user-select:none; -webkit-user-select:none;
}

/* ---------- topnav ---------- */
.topnav{ background:var(--navy); padding:.45rem 1rem; flex:0 0 auto; }
.topnav-inner{ max-width:1600px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:1rem; }
.topnav-logo{
  font-family:'Fredoka One',cursive; font-size:1.05rem; color:var(--krem); text-decoration:none;
  display:flex; align-items:center; gap:.45rem; letter-spacing:.02em;
}
.topnav-logo::before{ content:"🪙"; }
.topnav-logo span{ font-family:'Nunito',sans-serif; font-weight:800; font-size:.75rem; color:var(--amber); text-transform:uppercase; letter-spacing:.12em; }
.topnav-back{
  font-size:.75rem; font-weight:900; color:var(--navy); text-decoration:none; text-transform:uppercase; letter-spacing:.08em;
  background:var(--amber); border:2px solid var(--navy); border-radius:999px; padding:.25rem .8rem;
}

/* ---------- lærerlinje ---------- */
.laererlinje{
  background:var(--krem); border:4px solid var(--navy); border-radius:20px;
  box-shadow:var(--skygge); margin:.55rem .6rem .2rem;
  padding:.55rem .8rem .65rem; flex:0 0 auto;
  display:flex; flex-direction:column; gap:.5rem; align-items:center;
}
.rad{ display:flex; gap:.4rem; align-items:center; justify-content:center; flex-wrap:wrap; }
.seg{ display:flex; background:var(--krem-dyp); border:3px solid var(--navy); border-radius:999px; padding:3px; gap:3px; }
.seg button{
  border:0; background:transparent; font-family:inherit; font-weight:900; font-size:.78rem;
  padding:.3rem .75rem; border-radius:999px; color:var(--navy); cursor:pointer; opacity:.65;
}
.seg button[aria-pressed="true"]{ background:var(--navy); color:var(--krem); opacity:1; }
.seg.skjult{ display:none; }
.knapp{
  border:3px solid var(--navy); background:var(--krem-lys); border-radius:999px;
  font-family:inherit; font-weight:900; font-size:.78rem; padding:.28rem .7rem; cursor:pointer; color:var(--navy);
  display:inline-flex; align-items:center; gap:.35rem; box-shadow:0 3px 0 var(--navy);
  transition:transform .08s, box-shadow .08s;
}
.knapp:active{ transform:translateY(3px); box-shadow:0 0 0 var(--navy); }
.knapp:hover{ background:#fff; }
.knapp.primary{ background:var(--amber); color:var(--navy); }
.knapp.av{ opacity:.4; }
.knapp.skjult{ display:none; }

/* setningslengder i spill */
.familielinje{ display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; justify-content:center; }
.ftittel{ font-weight:900; font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--navy); }
.ftast{
  position:relative; padding:.2rem .6rem .2rem .55rem; cursor:pointer; min-width:3.4rem;
  border:3px solid var(--navy); background:var(--krem-lys); border-radius:.7rem;
  font-family:'Fredoka One',cursive; font-size:.9rem; line-height:1.25; color:var(--navy);
  display:inline-flex; align-items:center; justify-content:center; gap:.25rem; box-shadow:0 2px 0 var(--navy);
  transition:opacity .15s, background .15s;
}
.ftast:hover{ background:#fff; }
.ftast[aria-pressed="true"]{ background:var(--amber); }
.ftast[aria-pressed="false"]{ opacity:.4; }
.ftast .ant{
  font-family:'Nunito',sans-serif; font-weight:900; font-size:.6rem;
  background:var(--navy); color:var(--krem); border-radius:999px; padding:0 4px; min-width:1rem; text-align:center;
}
.ftast[aria-pressed="false"] .ant{ background:var(--muted); }
.ordtall{ font-weight:900; font-size:.75rem; color:var(--muted); }
.ordtall.tom{ color:var(--amber-dyp); }

/* ---------- scene ---------- */
.scene{ flex:1 1 auto; min-height:0; position:relative; padding:.6rem; }

/* tur for tur */
.tur{ height:100%; display:flex; flex-direction:column; gap:.5rem; }
.topplinje{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:clamp(.8rem,4vw,3rem); flex-wrap:wrap;
  background:var(--krem); border:4px solid var(--navy); border-radius:18px; box-shadow:var(--skygge-mjuk);
  padding:.35rem .9rem;
}
.oppdrag{
  font-family:'Fredoka One',cursive; font-size:clamp(.95rem,2vw,1.45rem); color:var(--navy);
  text-align:center; line-height:1.15;
}
.oppdrag em{ font-style:normal; color:var(--amber-dyp); }

.elevstripe{ display:flex; gap:.45rem; align-items:center; }
.elevmerke{
  width:46px; height:46px; border-radius:50%; background:var(--krem-lys);
  border:3px solid var(--navy); display:flex; align-items:center; justify-content:center;
  position:relative; opacity:.4; transition:transform .2s, opacity .2s;
}
.elevmerke img{ width:82%; height:82%; object-fit:contain; }
.elevmerke.aktiv{ opacity:1; transform:scale(1.18); box-shadow:0 3px 0 var(--navy); }
.elevmerke.ferdig{ opacity:1; }
.elevmerke.ferdig::after{ content:"✅"; position:absolute; right:-4px; bottom:-4px; font-size:1rem; }

/* teller 1-2-3 */
.teller{ display:flex; gap:.4rem; align-items:center; }
.tellerboks{
  width:34px; height:34px; border-radius:10px; background:var(--krem-lys);
  border:3px dashed var(--navy); display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden; opacity:.75;
}
.tellerboks.full{ border-style:solid; opacity:1; box-shadow:0 2px 0 var(--navy); }
.tellerboks .tallet{ font-family:'Fredoka One',cursive; font-size:1rem; color:var(--muted); }
.tellerboks .hake{ font-size:1.1rem; color:#fff; font-weight:900; text-shadow:0 1px 0 rgba(0,0,0,.3); }

.arena{
  flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; gap:clamp(.5rem,3vw,2.5rem);
  background:var(--krem); border:5px solid var(--navy); border-radius:26px; padding:.7rem;
  box-shadow:var(--skygge); position:relative;
}
.arena .heier{ position:absolute; left:1.5%; top:50%; transform:translateY(-50%); z-index:2;
  width:min(13vw,132px); display:flex; flex-direction:column; align-items:center; gap:.35rem; }
.arena .felt{ width:100%; height:100%; min-width:0; padding-left:min(15vw,150px); padding-right:.6rem;
  display:flex; align-items:center; justify-content:center; }

/* monster */
.monster{ width:100%; max-width:150px; filter:drop-shadow(0 6px 8px rgba(35,42,63,.22)); animation:bob 2.6s ease-in-out infinite; }
.monster.heia{ animation:heia .45s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-7px) } }
@keyframes heia{ 0%,100%{ transform:translateY(0) rotate(-4deg) } 50%{ transform:translateY(-12px) rotate(4deg) } }
.boble{
  background:var(--krem-lys); border:3px solid var(--navy); border-radius:16px; color:var(--navy);
  padding:.32rem .75rem; font-weight:900; font-size:clamp(.75rem,1.4vw,1rem); text-align:center;
  position:relative; max-width:100%; box-shadow:0 3px 0 var(--navy);
}
.boble::after{ content:""; position:absolute; bottom:-11px; left:50%; transform:translateX(-50%);
  border:8px solid transparent; border-top-color:var(--navy); }
.navn{
  font-family:'Fredoka One',cursive; font-size:clamp(.85rem,1.6vw,1.15rem); color:var(--navy)!important;
  background:var(--amber); border:3px solid var(--navy); border-radius:999px; padding:.05rem .7rem;
}

/* flere samtidig */
.grid4{ height:100%; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:1fr; gap:.6rem; }
.celle{
  background:var(--krem); border:4px solid var(--navy); border-radius:22px; box-shadow:var(--skygge);
  display:flex; flex-direction:column; align-items:center; gap:.3rem;
  padding:.5rem; min-height:0; min-width:0; position:relative; overflow:hidden;
}
.celle .heier{ flex:0 0 auto; width:100%; max-width:none;
  display:flex; flex-direction:row; align-items:center; justify-content:center; gap:.4rem; }
.celle .monster{ width:auto; max-width:none; height:clamp(34px,6vh,60px); }
.celle .navn{ font-size:clamp(.7rem,1.1vw,.9rem); border-width:2px; }
.celle .boble{ font-size:clamp(.62rem,1vw,.8rem); padding:.2rem .45rem; box-shadow:0 2px 0 var(--navy); }
.celle .boble::after{ bottom:auto; top:50%; left:auto; right:-11px;
  transform:translateY(-50%); border-top-color:transparent; border-left-color:var(--navy); }
.celle .felt{ flex:1 1 auto; width:100%; min-height:0; min-width:0; padding:.15rem .2rem .3rem; display:flex; align-items:center; justify-content:center; }
.celle.ferdig{ background:var(--krem-lys); }
.celle .elevnr{
  font-weight:900; font-size:clamp(.62rem,.95vw,.78rem); color:var(--navy)!important; text-transform:uppercase; letter-spacing:.08em;
  background:var(--krem-dyp); border:2px solid var(--navy); border-radius:999px; padding:.05rem .5rem;
}
.celle .teller{ flex:0 0 auto; }
.celle .tellerboks{ width:24px; height:24px; border-width:2px; border-radius:8px; }
.celle .tellerboks .tallet{ font-size:.78rem; }
.cellejubel{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  font-family:'Fredoka One',cursive; color:#fff; font-size:clamp(1rem,2.2vw,1.8rem);
  padding:.5rem 1.1rem; border-radius:18px; z-index:5; text-align:center;
  border:4px solid var(--navy);
  animation:sprett .45s cubic-bezier(.2,1.6,.4,1); box-shadow:0 5px 0 var(--navy);
}

/* ---------- bildekort ---------- */
.bildeboks{
  flex:0 0 auto; position:relative;
  background:#f9f0d5; border:5px solid var(--navy); border-radius:22px;
  box-shadow:var(--skygge); overflow:hidden;
  aspect-ratio:1/1;
  display:flex; align-items:center; justify-content:center;
}
.bildeboks img{ width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; }
.bildeboks .ordlyd{
  position:absolute; right:5px; bottom:5px; z-index:3;
  width:2.2rem; height:2.2rem; border-radius:50%; cursor:pointer;
  border:3px solid var(--navy); background:var(--amber); color:var(--navy);
  font-size:1.05rem; display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 0 var(--navy); padding:0;
}
.celle .bildeboks .ordlyd{ width:1.5rem; height:1.5rem; font-size:.75rem; border-width:2px; box-shadow:0 2px 0 var(--navy); right:3px; bottom:3px; }
.bildeboks .ordlyd:active{ transform:translateY(3px); box-shadow:0 0 0 var(--navy); }

/* ============ FELLES: SETNINGSLINJA ============
   Lukene setningen bygges i. Siste luke er den smale punktumluka.
   Ingen merker over lukene: den store forbokstaven står på selve
   ordkortet, og punktumkortet er gult – det er nok å kjenne igjen. */
.setningslinje{
  display:flex; gap:clamp(.2rem,.7vw,.5rem); align-items:flex-end; justify-content:center; flex-wrap:wrap;
  padding:.15rem 0;
}
.luke{
  position:relative;
  font-family:'Fredoka One',cursive; font-size:clamp(1rem,2.3vw,1.9rem); line-height:1.35;
  color:var(--navy); background:#fff;
  border:4px dashed var(--amber-dyp); border-radius:14px;
  padding:.1rem clamp(.35rem,1vw,.8rem); min-width:2.6em; min-height:1.9em;
  display:flex; align-items:center; justify-content:center;
}
.luke.fylt{
  border-style:solid; border-color:var(--gronn-dyp); background:#e9f8dd;
  animation:sprett .4s cubic-bezier(.2,1.6,.4,1);
}
.luke.slippKlar{ border-color:var(--teal); background:#e6fbfd; transform:scale(1.06); }
.luke.feil{ animation:rist .35s; border-color:var(--raud); }
.luke.hint{ border-color:var(--teal); box-shadow:0 0 0 4px rgba(43,179,192,.28); }
.luke.punkt{ min-width:1.4em; padding-left:.25rem; padding-right:.25rem; }
.celle .luke{ font-size:clamp(.66rem,1.25vw,1.05rem); border-width:3px; border-radius:9px; padding:.05rem .3rem; min-width:2.4em; }
.celle .luke.punkt{ min-width:1.2em; }

/* ============ OPPGAVE 1 – BYGG SETNINGEN ============ */
.byggspill{ width:100%; height:100%; min-height:0; display:flex; flex-direction:column; gap:clamp(.3rem,1.4vh,.9rem); align-items:center; justify-content:center; }
.byggtopp{ flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:clamp(.5rem,2vw,1.4rem); flex-wrap:wrap; }
/* Setningsbildene viser en hel handling, ikke bare én gjenstand –
   de trenger litt mer plass enn ettordsbildene gjorde. */
.byggtopp .bildeboks{ height:auto; width:clamp(84px,19vh,180px); border-width:5px; border-radius:18px; }
.byggtopp .bildeboks .ordlyd{ width:2rem; height:2rem; font-size:1rem; border-width:2px; box-shadow:0 2px 0 var(--navy); }
.celle .byggtopp .bildeboks{ width:clamp(44px,8vh,76px); border-width:3px; border-radius:11px; }
.kortbord{
  flex:0 0 auto; display:flex; gap:clamp(.25rem,1vw,.7rem); align-items:center; justify-content:center; flex-wrap:wrap;
  background:var(--krem-dyp); border:4px solid var(--navy); border-radius:18px;
  padding:clamp(.3rem,1vh,.6rem) clamp(.4rem,1.2vw,.9rem); min-height:2.6em;
  box-shadow:var(--skygge-mjuk); max-width:100%;
}
.celle .kortbord{ border-width:3px; border-radius:12px; gap:.2rem; padding:.25rem .3rem; }
.kortbord.tomt{ visibility:hidden; }
.ordkort{
  font-family:'Fredoka One',cursive; font-size:clamp(1rem,2.3vw,1.9rem); line-height:1.35;
  color:var(--navy); background:var(--krem-lys);
  border:4px solid var(--navy); border-radius:14px; box-shadow:0 4px 0 var(--navy);
  padding:.1rem clamp(.35rem,1vw,.8rem);
  cursor:grab; touch-action:none; font-weight:normal;
  transition:transform .12s, box-shadow .12s, opacity .2s;
}
.celle .ordkort{ font-size:clamp(.66rem,1.25vw,1.05rem); border-width:3px; border-radius:9px; padding:.05rem .3rem; box-shadow:0 3px 0 var(--navy); }
.ordkort.tegnkort{ background:var(--amber); }
.ordkort:hover{ background:#fff; }
.ordkort.valgt{ outline:4px solid var(--teal); outline-offset:3px; transform:translateY(-3px); }
.ordkort.hint{ outline:4px solid var(--teal); outline-offset:3px; animation:bob 1s ease-in-out infinite; }
.ordkort.dras{ position:fixed; z-index:60; cursor:grabbing; box-shadow:0 10px 18px rgba(35,42,63,.35); transition:none; }
.ordkort.brukt{ pointer-events:none; }
.ordkort.feil{ animation:rist .35s; border-color:var(--raud); }
@keyframes rist{ 0%,100%{ transform:translateX(0) } 25%{ transform:translateX(-6px) } 75%{ transform:translateX(6px) } }
.kortplass{ display:inline-flex; }

/* ============ BUESPILLET – himmel, ballonger, bue ============ */
.buespill{ width:100%; height:100%; min-height:0; display:flex; flex-direction:column; gap:.35rem; }
.buetopp{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:clamp(.4rem,1.6vw,1.2rem); flex-wrap:wrap;
  padding:.1rem 0;
}
.buetopp .bildeboks{ height:auto; width:clamp(64px,13vh,128px); border-width:4px; border-radius:16px; }
.buetopp .bildeboks .ordlyd{ width:1.8rem; height:1.8rem; font-size:.9rem; border-width:2px; box-shadow:0 2px 0 var(--navy); }
.celle .buetopp .bildeboks{ width:clamp(36px,6.5vh,62px); border-width:3px; border-radius:10px; }
.himmel{
  flex:1 1 auto; min-height:0; position:relative; overflow:hidden;
  background:linear-gradient(180deg,#bfe7f4 0%,#e2f5fa 70%,#d5efd0 100%);
  border:4px solid var(--navy); border-radius:20px; box-shadow:var(--skygge-mjuk);
  touch-action:none; cursor:crosshair;
}
.celle .himmel{ border-width:3px; border-radius:14px; }
.sky{ position:absolute; font-size:clamp(1.6rem,4vw,3rem); opacity:.7; pointer-events:none; animation:driv linear infinite; }
@keyframes driv{ from{ transform:translateX(-15vw) } to{ transform:translateX(115vw) } }

/* Ordballongene er ovale og vokser med ordet: «på» blir en liten
   kule, «sommerfuglen» en lang ballong. Da slipper vi å knekke ord
   midt i, som er det siste en førsteklassing trenger. */
.ballong{
  position:absolute; transform:translateX(-50%); pointer-events:none;
  border:0; background:transparent; padding:0; font-family:inherit;
  z-index:3; max-width:30%;
  display:flex; flex-direction:column; align-items:center;
  animation:sveve 3s ease-in-out infinite;
}
@keyframes sveve{ 0%,100%{ margin-top:0 } 50%{ margin-top:-14px } }
.ballongkropp{
  position:relative; min-width:2.1em; padding:.7em .85em;
  border-radius:50% 50% 47% 47% / 58% 58% 42% 42%;
  border:4px solid var(--navy);
  display:flex; align-items:center; justify-content:center;
  font-family:'Fredoka One',cursive; font-size:clamp(.95rem,2vw,1.7rem); color:#fff;
  text-shadow:0 2px 0 rgba(35,42,63,.4); text-align:center; line-height:1.2;
  white-space:nowrap;
  box-shadow:inset -10px -12px 0 rgba(35,42,63,.14), 0 4px 0 rgba(35,42,63,.22);
  transition:transform .15s;
}
.celle .ballongkropp{ font-size:clamp(.55rem,1vw,.85rem); border-width:3px; padding:.6em .7em; }
.ballongkropp::after{
  content:""; position:absolute; left:50%; bottom:-13px; transform:translateX(-50%);
  border:7px solid transparent; border-top:10px solid var(--navy);
}
.ballongsnor{
  width:3px; height:clamp(20px,4.5vh,44px); margin:14px auto 0;
  background:var(--navy); border-radius:2px; transform:rotate(4deg);
}
.celle .ballongsnor{ height:clamp(10px,2.4vh,22px); margin-top:6px; }
.ballong.treff-riktig .ballongkropp{ animation:sprekk .4s ease-out forwards; }
.ballong.treff-feil .ballongkropp{ animation:sprekk .4s ease-out forwards; filter:grayscale(.7); }
.ballong.treff-riktig .ballongsnor, .ballong.treff-feil .ballongsnor{ opacity:0; transition:opacity .2s; }
@keyframes sprekk{ 30%{ transform:scale(1.25); opacity:1 } 100%{ transform:scale(1.55); opacity:0 } }
.ballong.bom .ballongkropp{ animation:rist .35s; border-color:var(--raud); }
.ballongsmell{
  position:absolute; left:50%; top:34%; transform:translate(-50%,-50%) scale(0);
  font-size:clamp(1.8rem,4vw,3.2rem); pointer-events:none; z-index:4;
  animation:sprett .4s cubic-bezier(.2,1.6,.4,1) forwards;
}
.ballong.markert .ballongkropp{ outline:5px solid var(--amber); outline-offset:4px; }

.bue{
  position:absolute; left:50%; bottom:2px;
  width:clamp(76px,11vw,132px); z-index:4; pointer-events:none;
  transform:translateX(-50%);
  transform-origin:50% 78%;
  filter:drop-shadow(0 3px 0 rgba(35,42,63,.25));
}
.celle .bue{ width:clamp(52px,6vw,84px); }
.bue svg, .pilfly svg{ width:100%; height:auto; display:block; }
.pilfly{

<script>
/* ============================================================
   SETNINGSVERKSTEDET – Myntland
   ------------------------------------------------------------
   Steg 2 etter Ordbyggeren: der ble lydene til ord, her blir
   ordene til en setning. Tre oppgavetyper:

     1) Bygg setningen     – ordkortene ligger stokket på bordet,
                             eleven drar dem opp i lukene. Ordet med
                             stor forbokstav skal først, punktum-
                             kortet sist.
     2) Ordet som mangler  – setningen står ferdig med én luke.
                             Tre ballonger svever i himmelen, og
                             eleven spenner buen og skyter ordet
                             som passer.
     3) Slangespillet      – ordene ligger strødd på brettet, og
                             eleven styrer slangen med sveip eller
                             piltaster og spiser ordene i riktig
                             rekkefølge – punktumet til slutt.

   Bildene ligger i bilder/lyd/<fil>.webp – nøyaktig samme filer
   som Lydverkstedet, Rimverkstedet, Ordbyggeren og Stavelses-
   verkstedet bruker. Setningene leses inn som lyd/setn-<slug>.mp3
   (se setningsverkstedet-innlesing.html). Mangler en lydfil,
   hopper verktøyet bare over den – sida virker uansett.
   ============================================================ */

/* ============================================================
   SETNINGSBANKEN
   ------------------------------------------------------------
   t     = setningen slik den skal se ut, med stor forbokstav og
           punktum. Ordkortene lages ved å splitte på mellomrom
           og fjerne punktumet – første ord beholder den store
           forbokstaven på kortet, så eleven kan lese seg fram til
           hvilket ord setningen begynner med.
   k     = én bokstav per ord, ordklassen:
             s substantiv · v verb · a adjektiv/adverb
             p preposisjon · d determinativ/pronomen
             k bindeord · t tallord
           Brukes bare til å finne fornuftige avledere i
           «Ordet som mangler» – luka byttes med ord av samme
           slag, ikke et tilfeldig ord.
   bilde = filnavnet i bilder/lyd/ (uten .webp). Bildet viser
           HVEM eller HVA setningen handler om – altså subjektet,
           som er nøyaktig det ordet eleven skal finne til første
           luke. Setninger som begynner med Vi/Jeg/Barna har ikke
           noe subjektbilde og viser objektet i stedet.
           Alle bildene fins fra før.
   Lydfila heter setn-<slug av t>.mp3 og lages av slug() under.
   ============================================================ */
const SETNINGER = [
  /* ---- 3 ord ---- */
  { t:"Katten sover godt.",        k:"sva",   bilde:"katt" },

/* Filnavn til innlesinga: æ/ø/å blir ae/oe/aa, resten blir
   bindestreker. Nøyaktig samme regel brukes i innleseskriptet,
   så navnene kan ikke skli fra hverandre. */
function slug(t){
  return t.toLowerCase()
    .replace(/æ/g,"ae").replace(/ø/g,"oe").replace(/å/g,"aa")
    .replace(/[^a-z0-9]+/g,"-")
    .replace(/^-+|-+$/g,"");
}
/* Bygger ut hver setning én gang ved oppstart. */
SETNINGER.forEach(s => {
  s.ord = s.t.replace(/\.$/,"").split(/\s+/);
  s.n   = s.ord.length;
  s.fil = "setn-" + slug(s.t);
});

const LENGDER = [3, 4, 5];
const SETN_I_GRUPPE = n => SETNINGER.filter(s => s.n === n);

/* Ordbasseng til «Ordet som mangler»: alle ordformene i banken,
   sortert på ordklasse. Avlederne hentes herfra, slik at luka
   alltid får tre ord av samme slag å velge mellom. */
const BASSENG = {};
SETNINGER.forEach(s => {
  s.ord.forEach((o, i) => {
    const kl = s.k[i] || "s";
    const form = i === 0 ? o.toLowerCase() : o;
    (BASSENG[kl] = BASSENG[kl] || new Set()).add(form);
  });
});
Object.keys(BASSENG).forEach(k => { BASSENG[k] = [...BASSENG[k]]; });

/* ---------- Elevfarger og monstre ---------- */
const LAG = [
  { navn:"Drage",   fil:"ildkatt",     farge:"#E23B2E", morkt:"#9c1f16" },
  { navn:"Bølge",   fil:"indigo",      farge:"#1F7AE0", morkt:"#0e4585" },
  { navn:"Skog",    fil:"gressgroenn", farge:"#17A05C", morkt:"#0a5b34" },
  { navn:"Stjerne", fil:"gullgul",     farge:"#EF9F27", morkt:"#a06a10" }
];

const forsokFarge = (plass, forsok) => FARGER[((plass * 5 + forsok) % FARGER.length + FARGER.length) % FARGER.length];

const JUBELROP = ["Kjempebra!","Perfekt!","Så fint!","Supert!","Bra jobba!"];
const BOMROP_BYGG = ["Nesten! Prøv et annet ord.","Les setningen én gang til.","Hør setningen en gang til!"];
const BOMROP_LUKE = ["Nesten! Sikt en gang til.","Hør setningen en gang til!","Prøv et nytt skudd!"];
const BOMROP_SLANGE = ["Nesten! Finn ordet som kommer først.","Hør setningen en gang til!","Prøv et annet ord!"];

const OPPGAVER = {
  bygg:    { tittel:"Legg ordene i riktig <em>rekkefølge</em>",   lyd:"bygg-setningen" },
  mangler: { tittel:"Spenn buen – skyt ordet som <em>mangler</em>", lyd:"ordet-mangler" },
  slange:  { tittel:"Slangen spiser ordene i riktig <em>rekkefølge</em>", lyd:"spis-ordene" }
};

/* ---------- Tilstand ---------- */
const app = {
  oppgave:"bygg", modus:"tur",
  antall:4, runder:3, visBilde:true,
  aktive:null, tur:0, rep:0, ferdigeSett:0,
  flater:[], ko:[]
};

/* ---------- Små hjelpere ---------- */
const $ = s => document.querySelector(s);
const tilfeldig = a => a[Math.floor(Math.random()*a.length)];
const bland = a => { const b = a.slice(); for (let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; } return b; };
const bildeUrl = fil => "bilder/lyd/" + fil + ".webp";
const bildeReserve = fil => "https://myntland.no/bilder/lyd/" + fil + ".webp";
const monsterUrl = fil => "bilder/lyd/monster-" + fil + ".webp";
const monsterReserve = fil => "https://myntland.no/monsters/" + fil + ".webp";
const stor = o => o.charAt(0).toUpperCase() + o.slice(1);

/* ---------- Lyd (effekter) ---------- */
let lydPaa = true, ac = null;
function lydKontekst(){
  if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
  if (ac && ac.state === "suspended") ac.resume();

let stoyBuffer = null;
function lagStoyBuffer(k){
  if (stoyBuffer) return stoyBuffer;
  const n = Math.floor(k.sampleRate * 0.09);
  stoyBuffer = k.createBuffer(1, n, k.sampleRate);
  const d = stoyBuffer.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2.2);
  return stoyBuffer;
}

  o.type = "sawtooth";
  const t0 = k.currentTime;
  o.frequency.setValueAtTime(950, t0);
  o.frequency.exponentialRampToValueAtTime(280, t0 + 0.24);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.07, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
  o.connect(g); g.connect(k.destination); o.start(t0); o.stop(t0 + 0.3);
}

  if (!lydPaa) return;

  const kilde = k.createBufferSource();
  kilde.buffer = lagStoyBuffer(k);
  const filter = k.createBiquadFilter();
  filter.type = "highpass"; filter.frequency.value = 900;
  const g = k.createGain(); g.gain.value = 0.6;

/* ---------- Innlest tale (mp3) ----------
   Ligger i /lyd/ ved siden av denne sida, som for de andre
   verkstedene. Setningene heter setn-<slug>.mp3, og æ/ø/å er
   skrevet ae/oe/aa. Mangler en fil, hoppes den bare over. */
const LYDSTI = "lyd/";
const REPLIKKER = [
  "bygg-setningen","ordet-mangler","spis-ordene",         /* nye – leses inn */
  "stor-forbokstav","punktum",                            /* nye – leses inn */
  "riktig","proev-igjen",                                 /* fins alt i /lyd/ */
  "din-tur","neste-elev","alle-sammen"                    /* fins alt i /lyd/ */
];

const lydLager = new Map();
let taleNr = 0, spillerNaa = null, taleKoe = [], taleGaar = false, taleVern = false, taleVakt = null;

function hentLyd(navn){
  let a = lydLager.get(navn);
  if (!a){ a = new Audio(LYDSTI + navn + ".mp3"); a.preload = "auto"; lydLager.set(navn, a); }
  return a;
}
function forbered(...navn){ navn.forEach(n => { try { hentLyd(n).load(); } catch(e){} }); }
function stoppTale(){
  taleNr++;
  taleKoe = [];
  taleGaar = false;
  taleVern = false;
  if (taleVakt){ clearTimeout(taleVakt); taleVakt = null; }
  if (spillerNaa){ try { spillerNaa.pause(); spillerNaa.currentTime = 0; } catch(e){} spillerNaa = null; }
}
/* Spiller neste fil i køen. En fil som mangler – eller som nettleseren
   ikke vil starte – hopper vi bare over. Vaktposten sørger for at køen
   aldri blir stående fast om «ended» aldri kommer. */
function spillKoe(mitt){
  if (mitt !== taleNr) return;
  const navn = taleKoe.shift();
  if (navn === undefined){ taleGaar = false; taleVern = false; spillerNaa = null; return; }
  const a = hentLyd(navn);
  let brukt = false;
  const videre = () => {
    if (brukt) return;
    brukt = true;
    if (taleVakt){ clearTimeout(taleVakt); taleVakt = null; }
    a.removeEventListener("ended", videre);
    a.removeEventListener("error", videre);
    spillKoe(mitt);
  };
  a.addEventListener("ended", videre);
  a.addEventListener("error", videre);
  try { a.currentTime = 0; } catch(e){}
  spillerNaa = a;
  const p = a.play();
  if (p && p.catch) p.catch(videre);
  taleVakt = setTimeout(videre, (isFinite(a.duration) ? a.duration * 1000 : 6000) + 1200);
}
/* si("bygg-setningen","setn-katten-sover-godt") spiller filene etter
   hverandre. Ny si() avbryter den forrige. */
function si(...navn){
  if (!lydPaa || !navn.length) return;
  stoppTale();
  taleKoe = navn.slice();
  taleGaar = true;
  spillKoe(taleNr);
}
/* Korte tilbakemeldinger som SKAL bli ferdigsnakket – «punktum» og
   «stor forbokstav». De varer under to sekunder, men rosen kom før
   og hugget dem av på midten. siKort() merker replikken som vernet,
   og både neste siKort() og siEtter() legger seg da bak i køen i
   stedet for å avbryte. Legger eleven forbokstaven og punktumet rett
   etter hverandre, blir begge sagt – i den rekkefølgen kortene kom. */
function siKort(...navn){
  if (taleVern && taleGaar){ taleKoe.push(...navn); return; }
  si(...navn);
  if (taleGaar) taleVern = true;
}
/* Rosen etter et riktig svar. Venter bare på en vernet replikk – går
   det et spørsmål (som er ti sekunder langt), avbryter vi som før. */
function siEtter(...navn){
  if (!lydPaa || !navn.length) return;
  if (taleVern && taleGaar){ taleKoe.push(...navn); return; }
  si(...navn);
}
/* Hvor mange millisekunder tale som står igjen. Pausene mellom rundene
   bruker dette til å vokse med replikkene i stedet for å gjette. */
function taleRest(){
  let ms = 0;
  if (taleGaar && spillerNaa && isFinite(spillerNaa.duration))
    ms += Math.max(0, spillerNaa.duration - spillerNaa.currentTime) * 1000;
  taleKoe.forEach(n => {
    const a = hentLyd(n);
    if (isFinite(a.duration)) ms += a.duration * 1000;
  });
  return Math.round(ms);
}
/* Vanlig pause, men aldri kortere enn det som står igjen å si. */
const pauseFor = ms => Math.max(ms, taleRest() + 400);
/* I «Flere samtidig» er talen strupet til et minimum: fire flater som

const tale      = (...navn) => { if (app.modus !== "flere") si(...navn); };
const taleKort  = (...navn) => { if (app.modus !== "flere") siKort(...navn); };
const taleEtter = (...navn) => { if (app.modus !== "flere") siEtter(...navn); };
/* Høyttalerknappen på bildekortet er bare med når én elev holder på om

/* ---------- Tidsutløsere som hører til runden ---------- */
let rundeTimere = [];
function senere(fn, ms){ const t = setTimeout(() => { rundeTimere = rundeTimere.filter(x => x !== t); fn(); }, ms); rundeTimere.push(t); return t; }

const kanvas = $("#konfetti"), ktx = kanvas.getContext("2d");

function skalerKanvas(){

const KONFETTIFARGER = ["#E23B2E","#1F7AE0","#17A05C","#EF9F27","#534AB7","#D85A30","#ff6fb5","#25c7c7"];
function konfetti(x, y, antall=90, fart=1){
  for (let i=0;i<antall;i++){
    const v = (Math.random()*7+3)*fart, a = Math.random()*Math.PI*2;
    biter.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 4,
      st:Math.random()*8+5, f:tilfeldig(KONFETTIFARGER),
      r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.4, liv:1 });
  }
  if (!konfettiKjorer){ konfettiKjorer = true; requestAnimationFrame(tegnKonfetti); }
}
function storKonfetti(){
  const b = innerWidth, h = innerHeight;
  konfetti(b*0.2, h*0.45, 110, 1.3); konfetti(b*0.8, h*0.45, 110, 1.3);
  konfetti(b*0.5, h*0.35, 140, 1.5);

}
function tegnKonfetti(){
  ktx.clearRect(0,0,innerWidth,innerHeight);
  biter = biter.filter(p => p.liv > 0 && p.y < innerHeight + 60);
  for (const p of biter){
    p.vy += 0.22; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.r += p.vr; p.liv -= 0.004;
    ktx.save(); ktx.translate(p.x, p.y); ktx.rotate(p.r); ktx.globalAlpha = Math.max(0, Math.min(1, p.liv*1.6));
    ktx.fillStyle = p.f; ktx.fillRect(-p.st/2, -p.st/2, p.st, p.st*0.6); ktx.restore();
  }
  if (biter.length){ requestAnimationFrame(tegnKonfetti); }
  else { konfettiKjorer = false; ktx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ============================================================
   UTVALG OG KØ
   ------------------------------------------------------------
   Læreren slår setningslengdene 3, 4 og 5 ord av og på. Køen
   sørger for at alle setningene i utvalget kommer opp før noen

   ============================================================ */
function utvalg(){

  return valgte.length ? valgte : SETNINGER.slice();
}
function fyllKo(){ app.ko = bland(utvalg()); }
function nesteSetning(unnta){
  if (!app.ko.length) fyllKo();

  if (unnta && unnta.length && unnta.includes(s.fil) && app.ko.length){
    const bytt = app.ko.findIndex(x => !unnta.includes(x.fil));
    if (bytt >= 0){ app.ko.push(s); s = app.ko.splice(bytt,1)[0]; }
  }
  return s;
}

/* Avledere til «Ordet som mangler»: to andre ord av samme
   ordklasse, som ikke alt står i setningen. Finner vi ikke nok,
   fyller vi opp fra hele bassenget – heller en avleder av feil
   slag enn en ballong for lite. */
function lagAvledere(s, idx, antall){
  const riktig = (idx === 0 ? s.ord[0].toLowerCase() : s.ord[idx]);
  const brukt = new Set(s.ord.map((o,i) => i === 0 ? o.toLowerCase() : o));
  const kl = s.k[idx] || "s";
  const fra = liste => bland(liste || []).filter(o => o !== riktig && !brukt.has(o));
  const valgt = [];
  for (const o of fra(BASSENG[kl])){
    if (valgt.length >= antall) break;
    valgt.push(o);
  }
  if (valgt.length < antall){
    const alle = Object.keys(BASSENG).flatMap(k => BASSENG[k]);
    for (const o of fra(alle)){
      if (valgt.length >= antall) break;
      if (!valgt.includes(o)) valgt.push(o);
    }
  }
  return valgt.slice(0, antall);
}

/* Bildet: eget setningsbilde hvis det fins, ellers bildet av

/* Setningslinja: én luke per ord + den smale punktumluka.
   Returnerer lukene i rekkefølge; punktumluka er den siste. */
function lagSetningslinje(s, fyltFraStart){
  const linje = document.createElement("div");
  linje.className = "setningslinje";
  const luker = [];
  for (let i = 0; i <= s.n; i++){
    const l = document.createElement("div");
    l.className = "luke" + (i === s.n ? " punkt" : "");
    l.dataset.i = i;
    if (fyltFraStart){
      l.classList.add("fylt");
      l.style.animation = "none";
      l.textContent = i === s.n ? "." : s.ord[i];
    }
    linje.appendChild(l);
    luker.push(l);
  }
  linje._luker = luker;
  return linje;
}
function fyllLuke(luke, tekst){

<script>

   Ordkortene ligger stokket på bordet under lukene, og eleven

   funker best på tavla. Kortet for det første ordet bærer den
   store forbokstaven: den er ledetråden til hvilket ord som skal
   først. Punktumkortet er gult og må på plass til slutt.

function lukeUnder(x, y, luker){
  return luker.find(l => {
    const r = l.getBoundingClientRect();
    return x >= r.left - 6 && x <= r.right + 6 && y >= r.top - 6 && y <= r.bottom + 6;
  }) || null;
}

/* Flytter et element visuelt fra der det står til midt i målet,
   og kaller cb() når det er framme. */
function flyTil(el, fraRekt, tilRekt, cb, tid=450){
  el.style.position = "fixed";
  el.style.left = fraRekt.left + "px";
  el.style.top = fraRekt.top + "px";
  el.style.width = fraRekt.width + "px";
  el.style.margin = "0";
  el.style.zIndex = "60";
  el.style.pointerEvents = "none";
  const dx = (tilRekt.left + tilRekt.width/2) - (fraRekt.left + fraRekt.width/2);
  const dy = (tilRekt.top + tilRekt.height/2) - (fraRekt.top + fraRekt.height/2);
  requestAnimationFrame(() => {
    el.style.transition = "transform " + tid + "ms cubic-bezier(.3,.7,.4,1), opacity " + tid + "ms";
    el.style.transform = "translate(" + dx + "px," + dy + "px) scale(.55)";
    el.style.opacity = "0";
  });
  setTimeout(cb, Math.round(tid * 0.72));
}

function lagByggFlate(vert, farge, valg, unnta){

        kort.style.width = start.r.width + "px";
