  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

radius:999px; padding:.25rem .8rem;\n}\n\n/* ---------- lærerlinje ---------- */\n.laererlinje{\n  background:var(--krem); border:4px solid var(--navy); border-radius:20px;\n  box-shadow:var(--skygge); margin:.55rem .6rem .2rem;\n  padding:.55rem .8rem .65rem; flex:0 0 auto;\n  display:flex; flex-direction:column; gap:.5rem; align-items:center;\n}\n.rad{ display:flex; gap:.4rem; align-items:center; justify-content:center; flex-wrap:wrap; }\n.seg{ display:flex; background:var(--krem-dyp); border:3px solid var(--navy); border-radius:999px; padding:3px; gap:3px; }\n.seg button{\n  border:0; background:transparent; font-family:inherit; font-weight:900; font-size:.78rem;\n  padding:.3rem .75rem; border-radius:999px; color:var(--navy); cursor:pointer; opacity:.65;\n}\n.seg button[aria-pressed=\"true\"]{ background:var(--navy); color:var(--krem); opacity:1; }\n.knapp{\n  border:3px solid var(--navy); background:var(--krem-lys); border-radius:999px;\n  font-family:inherit; font-weight:900; font-size:.78rem; padding:.28rem .7rem; cursor:pointer; color:var(--navy);\n  display:inline-flex; align-items:center; gap:.35rem; box-shadow:0 3px 0 var(--navy);\n  transition:transform .08s, box-shadow .08s;\n}\n.knapp:active{ transform:translateY(3px); box-shadow:0 0 0 var(--navy); }\n.knapp:hover{ background:#fff; }\n.knapp.primary{ background:var(--amber); color:var(--navy); }\n.knapp.av{ opacity:.4; }\n\n/* bokstavvelger */\n.chips{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; max-width:1500px; }\n.chip{\n  min-width:2.25rem; height:2.25rem; padding:0 .45rem;\n  border:3px solid var(--navy); background:var(--krem-lys); border-radius:.7rem;\n  font-family:'Fredoka One',cursive; font-size:1.15rem; line-height:1; color:var(--navy);\n  display:inline-flex; align-items:center; justify-content:center; cursor:pointer;\n  box-shadow:0 2px 0 var(--navy);\n}\n.chip:hover{ background:#fff; }\n.chip[aria-pressed=\"true\"]{ background:var(--amber); border-color:var(--navy); col ();\n      this.markorer.animate?.([{opacity:.2},{opacity:1}], {duration:420, iterations:2});\n    }\n  }\n\n  flytt(e){\n    if (!this.tegner || this.laast || e.pointerId !== this.pekerId) return;\n    e.preventDefault();\n    const p = lokaltPunkt(this.svg, e), pts = this.punkter[this.strek];\n    let ny = this.idx;\n    // kort vindu framover: bokstaver som går opp og ned samme strek (a, d, h, m ...)\n    // skal ikke kunne «hoppe over» vendepunktet\n    const tak = Math.min(this.idx + 12, pts.length - 1);\n    for (let i = this.idx; i <= tak; i++){\n      if (Math.hypot(p.x - pts[i].x, p.y - pts[i].y) <= TOL) ny = i;\n    }\n    if (ny > this.idx){ this.idx = ny; this.oppdater(); }\n    if (this.idx >= pts.length - 1) this.fullforStrek();\n  }\n\n  opp(){\n    if (!this.tegner) return;\n    this.tegner = false; this.paaTegning(false);\n    const pts = this.punkter[this.strek];\n    if (pts && this.idx / (pts.length - 1) >= SLUTTMONN) this.fullforStrek();\n    else this.tegnMarkor();\n  }\n\n  oppdater(){\n    const pts = this.punkter[this.strek], len = this.lengder[this.strek];\n    this.blekk[this.strek].style.strokeDashoffset = len * (1 - this.idx/(pts.length-1));\n    this.markorer.innerHTML = \"\";\n  }\n\n  fullforStrek(){\n    if (this.laast) return;\n    this.blekk[this.strek].style.strokeDashoffset = 0;\n    this.guider[this.strek].classList.remove(\"aktiv\");\n    this.tegner = false; this.paaTegning(false);\n    lydStrek();\n    this.strek++; this.idx = 0;\n    if (this.strek >= this.g.s.length){\n      this.laast = true; this.markorer.innerHTML = \"\";\n      this.svg.classList.add(\"ferdigflate\");\n      this.paaFerdig();\n    } else {\n      this.guider[this.strek].classList.add(\"aktiv\");\n      this.tegnMarkor();\n      this.paaStrek(this.strek, this.g.s.length);\n    }\n  }\n\n  /* Miniatyr til telleboksen */\n  mini(){\n    const svg = lagSvg(\"svg\", { viewBox:this.svg.getAttribute(\"viewBox\") });\n    this.g.s.forEach(d => {\n      const p = lagSvg(\"path\", { d, fill:\"none\", \"stroke-width\":15, \"stroke-linecap\":\"round\", \"stroke-linejoin\":\"round\" });\n      p.style.stroke = this.farge; svg.appendChild(p);\n    });\n    return svg;\n  }\n\n  visMeg(){\n    if (!this.svg) return;\n    this.laast = true; this.tegner = false; this.markorer.innerHTML = \"\";\n    this.blekk.forEach((b,i)=>{ b.style.strokeDashoffset = this.lengder[i]; b.style.opacity = .55; });\n    this.strek = 0; this.idx = 0;\n    this.guider.forEach((g,i)=> g.classList.toggle(\"aktiv\", i===0));\n    const penn = lagSvg(\"circle\", { r:8, fill:this.farge, opacity:.9 });\n    this.markorer.appendChild(penn);\n    let i = 0, t0 = null;\n    const steg = (tid) => {\n      if (!t0) t0 = tid;\n      const len = this.lengder[i], d = Math.min((tid - t0)/1000*90, len);\n      const pt = this.blekk[i].getPointAtLength(d);\n      penn.setAttribute(\"cx\", pt.x); penn.setAttribute(\"cy\", pt.y);\n      this.blekk[i].style.strokeDashoffset = len - d;\n      if (d >= len){\n        i++; t0 = null;\n        if (i >= this.blekk.length){ setTimeout(()=>this.nullstill(), 700); return; }\n        this.guider.forEach((g,k)=> g.classList.toggle(\"aktiv\", k===i));\n        lydStrek();\n      }\n      requestAnimationFrame(steg);\n    };\n    requestAnimationFrame(steg);\n  }\n\n  nullstill(){\n    if (!this.svg) return;\n    this.strek = 0; this.idx = 0; this.laast = false; this.tegner = false;\n    this.svg.classList.remove(\"ferdigflate\");\n    this.blekk.forEach((b,i)=>{ b.style.strokeDashoffset = this.lengder[i]; b.style.opacity = 1; });\n    this.guider.forEach((g,i)=> g.classList.toggle(\"aktiv\", i===0));\n    this.tegnMarkor();\n  }\n}\n\n/* ============================================================\n   FRIHÅND – eleven skriver selv, uten styring\n   ============================================================ */\nclass Frihand {\n  constructor(vert, valg={}){\n    this.vert = vert;\n    this.paaFerdig = valg.paaFerdig || (()=>{});\n    this.paaTegning= valg.paaTegning|| (()=>{});\n    this.paaStrek  = valg.paaStrek  || (()=>{});\n    this.paaHint   = valg.paaHint   || (()=>{});\n    this.baner = new Map();\n    this.laast = false;\n  }\n\n  last(tegn, farge){\n    this.tegn = tegn; this.farge = farge; this.laast = false;\n    this.vert.innerHTML = \"\"; this.baner.clear();\n\n    const flate = lagFlate(tegn);\n    const svg = flate.svg; this.svg = svg; this.g = flate.g; this.form = flate.form;\n    this.form.classList.add(\"modell\");\n    this.form.style.display = app.modell ? \"\" : \"none\";\n\n    this.blekk = lagSvg(\"g\", { class:\"frihandblekk\" }); svg.appendChild(this.blekk);\n    this.markorer = lagSvg(\"g\", { class:\"startmarkorer\" }); svg.appendChild(this.markorer);\n    this.inkStreker = [];\n\n    const boks = document.createElement(\"div\"); boks.className = \"flateboks\";\n    boks.appendChild(svg);\n\n    const verktoy = document.createElement(\"div\"); verktoy.className = \"verktoy\";\n    const visk = document.createElement(\"button\");\n    visk.className = \"vknapp\"; visk.innerHTML = \"🧽 <span>Viske ut</span>\";\n    visk.addEventListener(\"click\", () => { this.tom(); tone(330,.1,\"sine\",.08); });\n    const ferdig = document.createElement(\"button\");\n    ferdig.className = \"vknapp ok\"; ferdig.innerHTML = \"✓ <span>Ferdig</span>\";\n    ferdig.style.background = farge;\n    ferdig.addEventListener(\"click\", () => this.godkjenn());\n    verktoy.appendChild(visk); verktoy.appendChild(ferdig);\n    boks.appendChild(verktoy);\n    this.vert.appendChild(boks);\n    flate.tegnLinjer();\n\n    // punktprøver av modellen – brukes til å vurdere det eleven skriver\n    this.modellStreker = Array.from(this.form.children).map(p => {\n      const len = Math.max(p.getTotalLength(), 1);\n      const n = Math.max(6, Math.round(len / 3));\n      const ut = [];\n      for (let j=0;j<=n;j++){ const pt = p.getPointAtLength(len*j/n); ut.push({x:pt.x, y:pt.y}); }\n      return medRetning(ut);\n    });\n    this.modellPunkter = this.modellStreker.flat();\n    this.tegnStart();\n\n    svg.addEventListener(\"pointerdown\", e => this.ned(e));\n    svg.addEventListener(\"pointermove\", e => this.flytt(e));\n    svg.addEventListener(\"pointerup\",   e => this.opp(e));\n    svg.addEventListener(\"pointercancel\", e => this.opp(e));\n  }\n\n  ned(e){\n    if (this.laast) return;\n    e.preventDefault();\n    this.skjulStart();\n    clearTimeout(this.sjekkTid);\n    const p = lokaltPunkt(this.svg, e);\n    const bane = lagSvg(\"path\", { class:\"frihandstrek\", d:`M${p.x.toFixed(1)},${p.y.toFixed(1)}` });\n    bane.style.stroke = this.farge;\n    this.blekk.appendChild(bane);\n    const punkter = [{ x:p.x, y:p.y }];\n    this.inkStreker.push(punkter);\n    this.baner.set(e.pointerId, { el:bane, sist:p, punkter });\n    try { this.svg.setPointerCapture(e.pointerId); } catch(err){}\n    this.paaTegning(true);\n  }\n  flytt(e){\n    const b = this.baner.get(e.pointerId); if (!b || this.laast) return;\n    e.preventDefault();\n    const p = lokaltPunkt(this.svg, e);\n    if (Math.hypot(p.x - b.sist.x, p.y - b.sist.y) < 1.2) return;\n    b.el.setAttribute(\"d\", b.el.getAttribute(\"d\") + ` L${p.x.toFixed(1)},${p.y.toFixed(1)}`);\n    b.sist = p;\n    b.punkter.push({ x:p.x, y:p.y });\n  }\n  opp(e){\n    if (!this.baner.has(e.pointerId)) return;\n    this.baner.delete(e.pointerId);\n    if (!this.baner.size){\n      this.paaTegning(false); this.paaStrek();\n      // vent litt i tilfelle eleven skal skrive én strek til, og vurder så bokstaven\n      clearTimeout(this.sjekkTid);\n      this.sjekkTid = setTimeout(() => this.autoSjekk(), 500);\n    }\n  }\n\n  tom(){\n    this.blekk.innerHTML = \"\"; this.baner.clear(); this.inkStreker = [];\n    clearTimeout(this.sjekkTid);\n    this.tegnStart();\n  }\n\n  /* Startpunkt for hver strek: farget prikk med strekknummer + retningspil.\n     Eleven skriver fritt, så alle strekene merkes samtidig — tallet sier\n     rekkefølgen, pila sier hvilken vei streken går. Starter to streker i\n     SAMME punkt (A, X, K ...), vises ÉN prikk der med begge tallene («1·2»)\n     og én pil per retning — prikken skal aldri flyttes vekk fra startpunktet. */\n  tegnStart(){\n    if (!this.markorer) return;\n    this.markorer.innerHTML = \"\";\n    this.markorer.classList.remove(\"borte\");\n    this.markorer.style.display = app.modell ? \"\" : \"none\";   // skjules med modellen\n    const langs = (pts, d) => {\n      let gaatt = 0;\n      for (let j = 1; j < pts.length; j++){\n        const s = Math.hypot(pts[j].x - pts[j-1].x, pts[j].y - pts[j-1].y);\n        if (gaatt + s >= d){\n          const t = s ? (d - gaatt) / s : 0;\n          return { x: pts[j-1].x + (pts[j].x - pts[j-1].x) * t,\n                   y: pts[j-1].y + (pts[j].y - pts[j-1].y) * t };\n        }\n        gaatt += s;\n      }\n      return pts[pts.length - 1];\n    };\n    const grupper = [];\n    (this.modellStreker || []).forEach((pts, i) => {\n      if (!pts || pts.length < 2) return;\n      const p0 = pts[0];\n      const g = grupper.find(q => Math.hypot(q.p.x - p0.x, q.p.y - p0.y) < 12);\n      if (g){ g.nr.push(i + 1); g.streker.push(pts); }\n      else grupper.push({ p:p0, nr:[i + 1], streker:[pts], forst:i === 0 });\n    });\n    grupper.forEach(g => {\n      g.streker.forEach(pts => {\n        const p0 = pts[0], pn = langs(pts, 18);\n        if (Math.hypot(pn.x - p0.x, pn.y - p0.y) <= 3) return;\n        const vinkel = Math.atan2(pn.y - p0.y, pn.x - p0.x) * 180 / Math.PI;\n        const pil = lagSvg(\"path\", { d:\"M0,-5.5 L10,0 L0,5.5 Z\", class:\"pil\", fill:this.farge });\n        pil.setAttribute(\"transform\", `translate(${pn.x},${pn.y}) rotate(${vinkel})`);\n        this.markorer.appendChild(pil);\n      });\n      const merke = g.nr.join(\"·\");\n      if (g.nr.length === 1){\n        this.markorer.appendChild(lagSvg(\"circle\", { cx:g.p.x, cy:g.p.y, r:7.5, fill:this.farge, class:\"start\" }));\n      } else {\n        const bredde = 6.4 * merke.length + 9;\n        this.markorer.appendChild(lagSvg(\"rect\", {\n          x:g.p.x - bredde/2, y:g.p.y - 7.5, width:bredde, height:15, rx:7.5,\n          fill:this.farge, class:\"start\"\n        }));\n      }\n      if (g.forst){\n        const puls = lagSvg(\"circle\", { cx:g.p.x, cy:g.p.y, r:7.5, class:\"startpuls\" });\n        puls.style.stroke = this.farge; this.markorer.appendChild(puls);\n      }\n      const nr = lagSvg(\"text\", { x:g.p.x, y:g.p.y, class:\"startnr\" });\n      nr.textContent = merke; this.markorer.appendChild(nr);\n    });\n  }\n\n  skjulStart(){\n    if (this.markorer) this.markorer.classList.add(\"borte\");\n  }\n\n  /* Vurderer fritt:\n       1) hver del av bokstaven må være skrevet (ingen strek kan mangle)\n       2) det eleven skriver må stort sett ligge på bokstaven (ikke krussedull)\n     Monnene er store: skjelving, skjeve streker og litt feil størrelse går fint. */\n  vurder(){\n    const streker = this.modellStreker || [];\n    const I = (this.inkStreker || []).map(medRetning).flat();\n    const M = this.modellPunkter || [];\n    if (!streker.length || I.length < 8) return { dekning:0, presisjon:0, minStrek:0, ok:false };\n    const R_DEKK = 14, R_NAER = 22, VINKEL = 0.5;   // 0.5 ≈ inntil 60 graders avvik i retning\n    const dekning = punkterDekket(M, I, R_DEKK, VINKEL) / M.length;\n    let minStrek = 1;\n    for (const st of streker) minStrek = Math.min(minStrek, punkterDekket(st, I, R_DEKK, VINKEL) / st.length);\n    const presisjon = punkterDekket(I, M, R_NAER) / I.length;\n    return { dekning, presisjon, minStrek, ok: minStrek >= 0.75 && presisjon >= 0.55 };\n  }\n\n  autoSjekk(){\n    if (this.laast || !this.blekk.children.length) return;\n    const v = this.vurder();\n    if (v.ok){ this.godkjenn(); return; }\n    // vennlig dult, ingen kjeft\n    if (v.minStrek < 0.75) this.paaHint(\"Fortsett – hele bokstaven!\");   // uten lyd – ble for masete\n    else this.paaHint(\"Nesten! Prøv en gang til.\", \"nesten-igjen\");\n  }\n\n  godkjenn(){\n    if (this.laast) return;\n    if (!this.blekk.children.length){ lydFeil(); return; }   // ingenting skrevet ennå\n    this.laast = true;\n    clearTimeout(this.sjekkTid);\n    this.paaFerdig();\n  }\n\n  mini(){\n    const svg = lagSvg(\"svg\", { viewBox:this.svg.getAttribute(\"viewBox\") });\n    svg.appendChild(this.blekk.cloneNode(true));\n    return svg;\n  }\n\n  visMeg(){\n    if (!this.svg) return;\n    const demo = lagSvg(\"g\"); this.svg.appendChild(demo);\n    const kopier = this.g.s.map(d => {\n      const p = lagSvg(\"path\", { d, class:\"blekk\" });\n      p.style.stroke = this.farge; p.style.opacity = .5;\n      demo.appendChild(p);\n      const len = p.getTotalLength();\n      p.style.strokeDasharray = len; p.style.strokeDashoffset = len;\n      return { p, len };\n    });\n    const penn = lagSvg(\"circle\", { r:8, fill:this.farge, opacity:.85 }); demo.appendChild(penn);\n    let i = 0, t0 = null;\n    const steg = (tid) => {\n      if (!t0) t0 = tid;\n      const { p, len } = kopier[i];\n      const d = Math.min((tid - t0)/1000*90, len);\n      const pt = p.getPointAtLength(d);\n      penn.setAttribute(\"cx\", pt.x); penn.setAttribute(\"cy\", pt.y);\n      p.style.strokeDashoffset = len - d;\n      if (d >= len){\n        i++; t0 = null; lydStrek();\n        if (i >= kopier.length){ setTimeout(()=>demo.remove(), 900); return; }\n      }\n      requestAnimationFrame(steg);\n    };\n    requestAnimationFrame(steg);\n  }\n\n  nullstill(){\n    this.tom(); this.laast = false;\n    if (this.form) this.form.style.display = app.modell ? \"\" : \"none\";\n  }\n\n  /* «Ferdig»-knappen godkjenner alltid – læreren har siste ord */\n\n}\n\n/* ============================================================\n   APPEN\n   ============================================================ */\nconst app = {\n  sett:\"store\", tegn:\"A\", modus:\"tur\", antall:4, runder:3,\n  frihand:false, modell:true,\n  tur:0, rep:0, flater:[], ferdigeSett:0\n};\n\nfunction nyFlate(vert, farge, valg){\n  const F = app.frihand ? Frihand : Sporing;\n  const f = new F(vert, valg);\n  f.last(app.tegn, farge);\n  return f;\n}\n\n/* --- bokstavvelger --- */\nfunction byggChips(){\n  const boks = $(\"#chips\"); boks.innerHTML = \"\";\n  SETS[app.sett].forEach(ch => {\n    const b = document.createElement(\"button\");\n    b.className = \"chip\"; b.textContent = ch;\n    b.setAttribute(\"aria-pressed\", ch === app.tegn ? \"true\" : \"false\");\n    b.addEventListener(\"click\", () => velgTegn(ch));\n    boks.appendChild(b);\n  });\n}\nfunction merkChip(){\n  document.querySelectorAll(\".chip\").forEach(b => b.setAttribute(\"aria-pressed\", b.textContent === app.tegn ? \"true\":\"false\"));\n}\nfunction velgTegn(ch){ app.tegn = ch; merkChip(); nyRunde(); siTegn(ch); forbered(...tegnFiler(nesteTegnFil())); }\nfunction nesteTegnFil(){ const l = SETS[app.sett]; return l[(l.indexOf(app.tegn) + 1) % l.length]; }\n\n/* --- monsterelement --- */\nfunction monsterBoks(lag, ropTekst){\n  const d = document.createElement(\"div\");\n  d.className = \"heier\"; d.style.color = lag.farge;\n  const img = document.createElement(\"img\");\n  img.className = \"monster\"; img.alt = \"Monsteret \" + lag.navn;\n  img.src = monsterUrl(lag.fil);\n  img.onerror = () => { img.onerror = null; img.src = monsterReserve(lag.fil); };\n  const navn = document.createElement(\"div\");\n  navn.className = \"navn\"; navn.style.color = lag.morkt; navn.textContent = lag.navn;\n  const boble = document.createElement(\"div\");\n  boble.className = \"boble\"; boble.textContent = ropTekst || tilfeldig(HEIAROP);\n  d.appendChild(boble); d.appendChild(img); d.appendChild(navn);\n  d._boble = boble; d._img = img;\n  return d;\n}\n\n/* --- teller 1-2-3 --- */\nfunction lagTeller(fargeFn, stor){\n  const t = document.createElement(\"div\");\n  t.className = \"teller\" + (stor ? \" stor\" : \"\");\n  for (let i=1;i<=app.runder;i++){\n    const b = document.createElement(\"div\");\n    b.className = \"tellerboks\"; b.dataset.n = i;\n    b.style.borderColor = fargeFn(i-1);\n    b.innerHTML = `<span class=\"tallet\">${i}</span>`;\n    t.appendChild(b);\n  }\n  return t;\n}\nfunction fyllTeller(teller, n, farge, mini){\n  const b = teller?.querySelector(`.tellerboks[data-n=\"${n}\"]`);\n  if (!b) return;\n  b.classList.add(\"full\");\n  if (teller.classList.contains(\"stor\") && mini){\n    b.innerHTML = `<span class=\"tallet\">${n}</span>`;\n    b.appendChild(mini);\n    b.style.background = \"#fff\";\n  } else {\n    b.innerHTML = `<span class=\"hake\">✓</span>`;\n    b.style.background = farge;\n  }\n}\nfunction tomTeller(teller, fargeFn){\n  teller?.querySelectorAll(\".tellerboks\").forEach(b => {\n    b.className = \"tellerboks\"; b.style.background = \"\"; b.style.borderColor = fargeFn(+b.dataset.n - 1);\n    b.innerHTML = `<span class=\"tallet\">${b.dataset.n}</span>`;\n  });\n}\n\n/* --- scene --- */\nfunction nyRunde(){\n  app.tur = 0; app.rep = 0; app.flater = []; app.ferdigeSett = 0;\n  skjulJubel();\n  const scene = $(\"#scene\"); scene.innerHTML = \"\";\n  if (app.modus === \"tur\") byggTur(scene); else byggFire(scene);\n}\n\n/* ---------- MODUS: TUR FOR TUR ---------- */\nfunction byggTur(scene){\n  const rot = document.createElement(\"div\"); rot.className = \"tur\";\n\n  const topp = document.createElement(\"div\"); topp.className = \"topplinje\";\n  const stripe = document.createElement(\"div\"); stripe.className = \"elevstripe\";\n  for (let i=0;i<app.antall;i++){\n    const m = document.createElement(\"div\"); m.className = \"elevmerke\"; m.dataset.i = i;\n    m.style.borderColor = LAG[i].farge;\n    const img = document.createElement(\"img\");\n    img.src = monsterUrl(LAG[i].fil); img.alt = LAG[i].navn;\n    img.onerror = () => { img.onerror = null; img.src = monsterReserve(LAG[i].fil); };\n    m.appendChild(img);\n    stripe.appendChild(m);\n  }\n  const teller = lagTeller(n => forsokFarge(0, n), true);\n  topp.appendChild(stripe); topp.appendChild(teller);\n\n  const arena = document.createElement(\"div\"); arena.className = \"arena\";\n  arena.style.borderColor = forsokFarge(0, 0);\n  const heier = monsterBoks(LAG[0]);\n  const felt = document.createElement(\"div\"); felt.className = \"felt\";\n  arena.appendChild(heier); arena.appendChild(felt);\n\n  rot.appendChild(topp); rot.appendChild(arena); scene.appendChild(rot);\n\n  app._teller = teller; app._arena = arena; app._felt = felt;\n  app._stripe = stripe; app._heier = heier;\n  merkAktivElev();\n  lagTurFlate();\n}\n\nfunction merkAktivElev(){\n  app._stripe?.querySelectorAll(\".elevmerke\").forEach(m => {\n    const i = +m.dataset.i;\n    m.classList.toggle(\"aktiv\", i === app.tur);\n    m.classList.toggle(\"ferdig\", i < app.tur);\n  });\n}\n\nfunction lagTurFlate(){\n  const heier = app._heier;\n  const farge = forsokFarge(app.tur, app.rep);\n  app._arena.style.borderColor = farge;\n  app.flater = [ nyFlate(app._felt, farge, {\n    paaTegning: paa => heier._img.classList.toggle(\"heia\", paa),\n    paaStrek:  () => { heier._boble.textContent = tilfeldig(HEIAROP); },\n    paaBom:    () => { heier._boble.textContent = \"Start på prikken!\"; si(\"start-pa-prikken\"); },\n    paaHint:   (t, lyd) => { heier._boble.textContent = t; if (lyd) si(lyd); },\n    paaFerdig: () => turFerdigRunde()\n  }) ];\n}\n\nfunction turFerdigRunde(){\n  const flate = app.flater[0], heier = app._heier;\n  const farge = forsokFarge(app.tur, app.rep);\n  app.rep++;\n  fyllTeller(app._teller, app.rep, farge, flate.mini());\n  heier._img.classList.add(\"heia\");\n  const r = app._arena.getBoundingClientRect();\n\n  if (app.rep < app.runder){\n    lydRunde();\n    konfetti(r.left + r.width/2, r.top + r.height/2, 30, 0.8);\n    const igjen = app.runder - app.rep;\n    heier._boble.textContent = igjen === 1 ? \"Én gang til!\" : `${igjen} ganger igjen!`;\n    si(\"igjen-\" + Math.min(igjen, 4));\n    setTimeout(()=>{ heier._img.classList.remove(\"heia\"); lagTurFlate(); }, 900);\n    return;\n  }\n\n  lydFerdig();\n  konfetti(r.left + r.width/2, r.top + r.height/2, 80, 1.1);\n  heier._boble.textContent = tilfeldig(JUBELROP);\n  app.tur++; app.rep = 0;\n\n  if (app.tur < app.antall){\n    setTimeout(()=>{\n      visJubel(\"NESTE ELEV!\", LAG[app.tur].farge, null, 1600);\n      si(\"neste-elev\");\n      setTimeout(()=>{\n        const nyttLag = LAG[app.tur];\n        app._arena.style.borderColor = nyttLag.farge;\n        const nyHeier = monsterBoks(nyttLag);\n        app._arena.replaceChild(nyHeier, app._heier);\n        app._heier = nyHeier;\n        tomTeller(app._teller, n => forsokFarge(app.tur, n));\n        merkAktivElev();\n        lagTurFlate();\n      }, 1600);\n    }, 800);\n  } else {\n    merkAktivElev();\n    setTimeout(alleFerdige, 800);\n  }\n}\n\n/* ---------- MODUS: FIRE SAMTIDIG (1 x N) ---------- */\nfunction byggFire(scene){\n  const rot = document.createElement(\"div\"); rot.className = \"grid4\";\n  rot.style.gridTemplateColumns = `repeat(${app.antall},1fr)`;\n  rot.style.gridTemplateRows = \"1fr\";\n  scene.appendChild(rot);\n  app.flater = [];\n\n  for (let i=0;i<app.antall;i++){\n    const lag = LAG[i];\n    const celle = document.createElement(\"div\"); celle.className = \"celle\";\n    celle.style.borderColor = lag.farge;\n    const heier = monsterBoks(lag);\n    const merke = document.createElement(\"div\");\n    merke.className = \"elevnr\"; merke.style.color = lag.morkt; merke.textContent = \"Elev 1\";\n    heier.appendChild(merke);\n    const teller = lagTeller(n => forsokFarge(i, n), false);\n    const felt = document.createElement(\"div\"); felt.className = \"felt\";\n    celle.appendChild(heier); celle.appendChild(teller); celle.appendChild(felt);\n    rot.appendChild(celle);\n\n    const st = { i, rep:0, elev:1, plass:i, lag, celle, heier, teller, felt, merke };\n    const bygg = () => {\n      st.flate = nyFlate(felt, forsokFarge(st.plass, st.rep), {\n        paaTegning: paa => heier._img.classList.toggle(\"heia\", paa),\n        paaStrek:  () => { heier._boble.textContent = tilfeldig(HEIAROP); },\n        paaBom:    () => { heier._boble.textContent = \"Start på prikken!\"; },\n        paaHint:   (t) => { heier._boble.textContent = t; },\n        paaFerdig: () => celleFerdigRunde(st, bygg)\n      });\n      app.flater[i] = st.flate;\n    };\n    bygg();\n  }\n}\n\nfunction celleFerdigRunde(st, byggPaaNytt){\n  const farge = forsokFarge(st.plass, st.rep);\n  st.rep++;\n  fyllTeller(st.teller, st.rep, farge, st.flate.mini());\n  st.heier._img.classList.add(\"heia\");\n  const r = st.celle.getBoundingClientRect();\n\n  if (st.rep < app.runder){\n    lydRunde();\n    konfetti(r.left + r.width/2, r.top + r.height/2, 25, 0.8);\n    const igjen = app.runder - st.rep;\n    st.heier._boble.textContent = igjen === 1 ? \"Én gang til!\" : `${igjen} igjen!`;\n    setTimeout(()=>{ st.heier._img.classList.remove(\"heia\"); byggPaaNytt(); }, 800);\n    return;\n  }\n\n  lydFerdig();\n  konfetti(r.left + r.width/2, r.top + r.height/2, 70, 1);\n  st.celle.classList.add(\"ferdig\");\n  st.heier._boble.textContent = tilfeldig(JUBELROP);\n  visCelleJubel(st.celle, st.lag.farge);\n  app.ferdigeSett++;\n  const alleRundt = app.ferdigeSett % app.antall === 0;\n\n  setTimeout(()=>{\n    st.rep = 0; st.elev++;\n    st.plass += app.antall;                 // ny elev = nye farger i denne kolonnen\n    st.merke.textContent = \"Elev \" + st.elev;\n    st.celle.classList.remove(\"ferdig\");\n    st.heier._img.classList.remove(\"heia\");\n    st.heier._boble.textContent = \"Din tur!\";\n    if (!alleRundt) si(\"din-tur\");\n    tomTeller(st.teller, n => forsokFarge(st.plass, n));\n    byggPaaNytt();\n  }, 1900);\n\n  if (alleRundt){\n    setTimeout(()=>{\n      lydFanfare(); storKonfetti(); si(\"alle-sammen\");\n      visJubel(\"🎉 SUPERT! 🎉\", null, null, 1700);\n    }, 350);\n  }\n}\n\nfunction visCelleJubel(celle, farge){\n  const d = document.createElement(\"div\");\n  d.className = \"cellejubel\"; d.textContent = \"NESTE ELEV!\";\n  d.style.background = farge;\n  celle.appendChild(d);\n  setTimeout(()=>d.remove(), 1800);\n}\n\n/* --- jubel --- */\nfunction visJubel(tekst, farge, knapper, tid){\n  skjulJubel();\n  const j = document.createElement(\"div\");\n  j.className = \"jubel vis\"; j.id = \"jubel\";\n  const t = document.createElement(\"div\"); t.className = \"tekst\"; t.textContent = tekst;\n  if (farge) t.style.background = farge;\n  j.appendChild(t);\n  if (knapper){\n    const v = document.createElement(\"div\"); v.className = \"valg\";\n    knapper.forEach(k => {\n      const b = document.createElement(\"button\"); b.textContent = k.tekst;\n      if (k.sek) b.className = \"sek\";\n      b.addEventListener(\"click\", () => { skjulJubel(); k.gjor(); });\n      v.appendChild(b);\n    });\n    j.appendChild(v);\n  }\n  $(\"#scene\").appendChild(j);\n  if (tid) setTimeout(skjulJubel, tid);\n}\nfunction skjulJubel(){ const j = $(\"#jubel\"); if (j) j.remove(); }\n\nfunction alleFerdige(){\n  lydFanfare(); storKonfetti();\n  si(\"neste-bokstav\");\n  visJubel(\"🎉 SUPERT! 🎉\", null, [\n    { tekst:\"Neste bokstav →\", gjor:nesteTegn },\n    { tekst:\"Samme igjen ↺\", sek:true, gjor:nyRunde }\n  ]);\n}\n\nfunction nesteTegn(){\n  const liste = SETS[app.sett];\n  velgTegn(liste[(liste.indexOf(app.tegn) + 1) % liste.length]);\n}\n\n/* --- lærerlinja --- */\n$(\"#settvelger\").addEventListener(\"click\", e => {\n  const b = e.target.closest(\"button\"); if (!b) return;\n  app.sett = b.dataset.sett;\n  document.querySelectorAll(\"#settvelger button\").forEach(x => x.setAttribute(\"aria-pressed\", x === b ? \"true\":\"false\"));\n  app.tegn = SETS[app.sett][0];\n  byggChips(); nyRunde();\n});\n$(\"#modusvelger\").addEventListener(\"click\", e => {\n  const b = e.target.closest(\"button\"); if (!b) return;\n  app.modus = b.dataset.modus;\n  document.querySelectorAll(\"#modusvelger button\").forEach(x => x.setAttribute(\"aria-pressed\", x === b ? \"true\":\"false\"));\n  nyRunde();\n});\n$(\"#metodevelger\").addEventListener(\"click\", e => {\n  const b = e.target.closest(\"button\"); if (!b) return;\n  app.frihand = b.dataset.metode === \"frihand\";\n  document.querySelectorAll(\"#metodevelger button\").forEach(x => x.setAttribute(\"aria-pressed\", x === b ? \"true\":\"false\"));\n  $(\"#modellKnapp\").style.display = app.frihand ? \"\" : \"none\";\n  nyRunde();\n});\n$(\"#modellKnapp\").addEventListener(\"click\", () => {\n  app.modell = !app.modell;\n  $(\"#modellKnapp\").textContent = app.modell ? \"👻 Modell på\" : \"👻 Modell av\";\n  $(\"#modellKnapp\").classList.toggle(\"av\", !app.modell);\n  document.querySelectorAll(\".spor .form.modell\").forEach(f => f.style.display = app.modell ? \"\" : \"none\");\n  document.querySelectorAll(\".spor .startmarkorer\").forEach(g => g.style.display = app.modell ? \"\" : \"none\");\n});\n$(\"#antallKnapp\").addEventListener(\"click\", () => {\n  app.antall = app.antall >= 4 ? 2 : app.antall + 1;\n  $(\"#antallKnapp\").textContent = `👥 ${app.antall} elever`;\n  nyRunde();\n});\n$(\"#runderKnapp\").addEventListener(\"click\", () => {\n  app.runder = app.runder >= 5 ? 1 : app.runder + 1;\n  $(\"#runderKnapp\").textContent = `🔁 ${app.runder} ${app.runder === 1 ? \"gang\" : \"ganger\"}`;\n  nyRunde();\n});\n$(\"#nesteKnapp\").addEventListener(\"click\", nesteTegn);\n$(\"#nullstillKnapp\").addEventListener(\"click\", nyRunde);\n$(\"#visKnapp\").addEventListener(\"click\", () => {\n  siTegn(app.tegn);\n  app.flater.forEach(f => f && f.visMeg());\n});\n/* Første berøring låser opp lyd i nettleseren – da henter vi replikkene samtidig */\nlet lydVarmet = false;\n[\"pointerdown\",\"keydown\"].forEach(h => addEventListener(h, () => {\n  if (lydVarmet) return;\n  lydVarmet = true;\n  lydKontekst();\n  forbered(...REPLIKKER);\n  forbered(...tegnFiler(app.tegn));\n}, { once:false, passive:true }));\n\n$(\"#lydKnapp\").addEventListener(\"click\", () => {\n  lydPaa = !lydPaa;\n  $(\"#lydKnapp\").textContent = lydPaa ? \"🔊\" : \"🔇\";\n  $(\"#lydKnapp\").classList.toggle(\"av\", !lydPaa);\n  if (lydPaa) lydKontekst();\n  else stoppTale();\n});\n$(\"#fullKnapp\").addEventListener(\"click\", () => {\n  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();\n  else document.exitFullscreen?.();\n});\n$(\"#rentKnapp\").addEventListener(\"click\", () => document.body.classList.add(\"rent\"));\n$(\"#visMenyKnapp\").addEventListener(\"click\", () => document.body.classList.remove(\"rent\"));\n\n/* --- tastatur for læreren --- */\naddEventListener(\"keydown\", e => {\n  if (e.key === \"ArrowRight\"){ nesteTegn(); return; }\n  if (e.key === \"ArrowLeft\"){\n    const liste = SETS[app.sett];\n    velgTegn(liste[(liste.indexOf(app.tegn) - 1 + liste.length) % liste.length]); return;\n  }\n  if (e.key === \" \"){ e.preventDefault(); nyRunde(); return; }\n  if (e.key.length === 1){\n    const ch = e.key;\n    for (const s of [\"store\",\"smaa\",\"tall\"]){\n      if (SETS[s].includes(ch)){\n        app.sett = s;\n        document.querySelectorAll(\"#settvelger button\").forEach(x => x.setAttribute(\"aria-pressed\", x.dataset.sett===s ? \"true\":\"false\"));\n        byggChips(); velgTegn(ch); return;\n      }\n    }\n  }\n});\n\n/* --- prøvebokstav fra bokstavtegneren (#prov=...) --- */\nfunction hentProvebokstav(){\n  const h = location.hash || \"\";\n  if (!h.startsWith(\"#prov=\")) return null;\n  try {\n    const p = JSON.parse(decodeURIComponent(h.slice(6)));\n    if (!p || !p.tegn || !Array.isArray(p.s) || !p.s.length) return null;\n    GLYPHS[p.tegn] = { w: p.w || 100, s: p.s };\n    for (const sett of [\"store\",\"smaa\",\"tall\"]){\n      if (SETS[sett].includes(p.tegn)){ app.sett = sett; break; }\n    }\n    if (!SETS.store.concat(SETS.smaa, SETS.tall).includes(p.tegn)) SETS[app.sett].push(p.tegn);\n    app.tegn = p.tegn;\n    document.querySelectorAll(\"#settvelger button\").forEach(x => x.setAttribute(\"aria-pressed\", x.dataset.sett === app.sett ? \"true\":\"false\"));\n    return p.tegn;\n  } catch(e){ return null; }\n}\n\n/* --- start --- */\n$(\"#modellKnapp\").style.display = \"none\";\nhentProvebokstav();\nbyggChips();\nnyRunde();\n<\/script>\n\n\n</body></html>"
  </script>
