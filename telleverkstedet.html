<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Telleverkstedet – Myntland</title>
<meta name="description" content="Eleven ser en mengde og finner tallet – eller lager mengden selv i tierramma. Fire oppgavetyper: Hvor mange, Fyll tierramma, Venner til 10 og Mengde-memory. For interaktiv tavle og iPad – opptil fire elever samtidig.">
<meta name="theme-color" content="#232a3f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Telleverkstedet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='114' fill='%231e0f52'/%3E%3Ctext x='256' y='360' font-family='Arial Black,sans-serif' font-size='320' font-weight='900' text-anchor='middle' fill='%23EF9F27'%3EM%3C/text%3E%3C/svg%3E" type="image/svg+xml">

<!-- Delt Myntland-styling (palett + fonter). Inline-stilene under bygger videre på denne. -->
<link rel="stylesheet" href="myntland.css">

<style>
:root{
  --navy:#232a3f; --navy-soft:#3b4560;
  --krem:#fbf1d6; --krem-dyp:#f3e2b9; --krem-lys:#fffaeb;
  --amber:#efae2a; --amber-dyp:#c4841a;
  --raud:#e8473f; --gronn:#74c043; --gronn-dyp:#4f8f28; --teal:#2bb3c0;
  --himmel-1:#a6dff0; --himmel-2:#d8f2f8; --bakke:#8cc63f;
  --text:#232a3f; --muted:#6b7690; --border:var(--navy);
  --f1:#E23B2E; --f2:#1F7AE0; --f3:#17A05C; --f4:#EF9F27;
  --skygge:0 4px 0 rgba(35,42,63,.9);
  --skygge-mjuk:0 4px 0 rgba(35,42,63,.18);
}
*{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html,body{ height:100%; overflow:hidden; }
body{
  font-family:'Nunito',system-ui,sans-serif;
  color:var(--text);
  background:linear-gradient(180deg,var(--himmel-1) 0%,var(--himmel-2) 55%,#e9f7ea 78%,var(--bakke) 100%);
  display:flex; flex-direction:column;
  height:100dvh;
  user-select:none; -webkit-user-select:none;
}

/* ---------- topnav ---------- */
.topnav{ background:var(--navy); padding:.45rem 1rem; flex:0 0 auto; }
.topnav-inner{ max-width:1600px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; gap:1rem; }
.topnav-logo{
  font-family:'Fredoka One',cursive; font-size:1.05rem; color:var(--krem); text-decoration:none;
  display:flex; align-items:center; gap:.45rem; letter-spacing:.02em;
}
.topnav-logo::before{ content:"🪙"; }
.topnav-logo span{ font-family:'Nunito',sans-serif; font-weight:800; font-size:.75rem; color:var(--amber); text-transform:uppercase; letter-spacing:.12em; }
.topnav-back{
  font-size:.75rem; font-weight:900; color:var(--navy); text-decoration:none; text-transform:uppercase; letter-spacing:.08em;
  background:var(--amber); border:2px solid var(--navy); border-radius:999px; padding:.25rem .8rem;
}

/* ---------- lærerlinje ---------- */
.laererlinje{
  background:var(--krem); border:4px solid var(--navy); border-radius:20px;
  box-shadow:var(--skygge); margin:.55rem .6rem .2rem;
  padding:.55rem .8rem .65rem; flex:0 0 auto;
  display:flex; flex-direction:column; gap:.5rem; align-items:center;
}
.rad{ display:flex; gap:.4rem; align-items:center; justify-content:center; flex-wrap:wrap; }
.seg{ display:flex; background:var(--krem-dyp); border:3px solid var(--navy); border-radius:999px; padding:3px; gap:3px; }
.seg button{
  border:0; background:transparent; font-family:inherit; font-weight:900; font-size:.78rem;
  padding:.3rem .75rem; border-radius:999px; color:var(--navy); cursor:pointer; opacity:.65;
}
.seg button[aria-pressed="true"]{ background:var(--navy); color:var(--krem); opacity:1; }
.seg.skjult{ display:none; }
.knapp{
  border:3px solid var(--navy); background:var(--krem-lys); border-radius:999px;
  font-family:inherit; font-weight:900; font-size:.78rem; padding:.28rem .7rem; cursor:pointer; color:var(--navy);
  display:inline-flex; align-items:center; gap:.35rem; box-shadow:0 3px 0 var(--navy);
  transition:transform .08s, box-shadow .08s;
}
.knapp:active{ transform:translateY(3px); box-shadow:0 0 0 var(--navy); }
.knapp:hover{ background:#fff; }
.knapp.primary{ background:var(--amber); color:var(--navy); }
.knapp.av{ opacity:.4; }
.knapp.skjult{ display:none; }

/* tall i spill */
.tallinje{ display:flex; gap:.5rem; align-items:center; flex-wrap:wrap; justify-content:center; }
.ttittel{ font-weight:900; font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--navy); }
.minik{
  font-family:inherit; font-weight:900; font-size:.72rem; color:var(--navy); cursor:pointer;
  background:var(--krem-lys); border:2px solid var(--navy); border-radius:999px;
  padding:.15rem .65rem; box-shadow:0 2px 0 var(--navy);
}
.minik:hover{ background:#fff; }
.talltall{ font-weight:900; font-size:.75rem; color:var(--muted); }
.talltall.tom{ color:var(--amber-dyp); }

.tallrad{ display:flex; flex-wrap:wrap; gap:5px; justify-content:center; max-width:1500px; }
.ttast{
  position:relative; padding:.15rem .55rem; cursor:pointer; min-width:2.4rem;
  border:3px solid var(--navy); background:var(--krem-lys); border-radius:.7rem;
  font-family:'Fredoka One',cursive; font-size:.95rem; line-height:1.25; color:var(--navy);
  display:inline-flex; align-items:center; justify-content:center; box-shadow:0 2px 0 var(--navy);
  transition:opacity .15s, background .15s;
}
.ttast:hover{ background:#fff; }
.ttast[aria-pressed="true"]{ background:var(--amber); }
.ttast[aria-pressed="false"]{ opacity:.4; }

/* ---------- scene ---------- */
.scene{ flex:1 1 auto; min-height:0; position:relative; padding:.6rem; }

/* tur for tur */
.tur{ height:100%; display:flex; flex-direction:column; gap:.5rem; }
.topplinje{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:clamp(.8rem,4vw,3rem); flex-wrap:wrap;
  background:var(--krem); border:4px solid var(--navy); border-radius:18px; box-shadow:var(--skygge-mjuk);
  padding:.35rem .9rem;
}
.oppdrag{
  font-family:'Fredoka One',cursive; font-size:clamp(.95rem,2vw,1.45rem); color:var(--navy);
  text-align:center; line-height:1.15;
}
.oppdrag em{ font-style:normal; color:var(--amber-dyp); }

.elevstripe{ display:flex; gap:.45rem; align-items:center; }
.elevmerke{
  width:46px; height:46px; border-radius:50%; background:var(--krem-lys);
  border:3px solid var(--navy); display:flex; align-items:center; justify-content:center;
  position:relative; opacity:.4; transition:transform .2s, opacity .2s;
}
.elevmerke img{ width:82%; height:82%; object-fit:contain; }
.elevmerke.aktiv{ opacity:1; transform:scale(1.18); box-shadow:0 3px 0 var(--navy); }
.elevmerke.ferdig{ opacity:1; }
.elevmerke.ferdig::after{ content:"✅"; position:absolute; right:-4px; bottom:-4px; font-size:1rem; }

/* teller 1-2-3 */
.teller{ display:flex; gap:.4rem; align-items:center; }
.tellerboks{
  width:34px; height:34px; border-radius:10px; background:var(--krem-lys);
  border:3px dashed var(--navy); display:flex; align-items:center; justify-content:center;
  position:relative; overflow:hidden; opacity:.75;
}
.tellerboks.full{ border-style:solid; opacity:1; box-shadow:0 2px 0 var(--navy); }
.tellerboks .tallet{ font-family:'Fredoka One',cursive; font-size:1rem; color:var(--muted); }
.tellerboks .hake{ font-size:1.1rem; color:#fff; font-weight:900; text-shadow:0 1px 0 rgba(0,0,0,.3); }

.arena{
  flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; gap:clamp(.5rem,3vw,2.5rem);
  background:var(--krem); border:5px solid var(--navy); border-radius:26px; padding:.7rem;
  box-shadow:var(--skygge); position:relative;
}
.arena .heier{ position:absolute; left:1.5%; top:50%; transform:translateY(-50%); z-index:2;
  width:min(15vw,150px); display:flex; flex-direction:column; align-items:center; gap:.35rem; }
.arena .felt{ width:100%; height:100%; min-width:0; padding-left:min(17vw,168px); padding-right:.6rem;
  display:flex; align-items:center; justify-content:center; }

/* monster */
.monster{ width:100%; max-width:150px; filter:drop-shadow(0 6px 8px rgba(35,42,63,.22)); animation:bob 2.6s ease-in-out infinite; }
.monster.heia{ animation:heia .45s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-7px) } }
@keyframes heia{ 0%,100%{ transform:translateY(0) rotate(-4deg) } 50%{ transform:translateY(-12px) rotate(4deg) } }
.boble{
  background:var(--krem-lys); border:3px solid var(--navy); border-radius:16px; color:var(--navy);
  padding:.32rem .75rem; font-weight:900; font-size:clamp(.8rem,1.5vw,1.05rem); text-align:center;
  position:relative; max-width:100%; box-shadow:0 3px 0 var(--navy);
}
.boble::after{ content:""; position:absolute; bottom:-11px; left:50%; transform:translateX(-50%);
  border:8px solid transparent; border-top-color:var(--navy); }
.navn{
  font-family:'Fredoka One',cursive; font-size:clamp(.85rem,1.6vw,1.15rem); color:var(--navy)!important;
  background:var(--amber); border:3px solid var(--navy); border-radius:999px; padding:.05rem .7rem;
}

/* flere samtidig */
.grid4{ height:100%; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:1fr; gap:.6rem; }
.celle{
  background:var(--krem); border:4px solid var(--navy); border-radius:22px; box-shadow:var(--skygge);
  display:flex; flex-direction:column; align-items:center; gap:.3rem;
  padding:.5rem; min-height:0; min-width:0; position:relative; overflow:hidden;
}
.celle .heier{ flex:0 0 auto; width:100%; max-width:none;
  display:flex; flex-direction:row; align-items:center; justify-content:center; gap:.4rem; }
.celle .monster{ width:auto; max-width:none; height:clamp(38px,7vh,68px); }
.celle .navn{ font-size:clamp(.7rem,1.1vw,.9rem); border-width:2px; }
.celle .boble{ font-size:clamp(.68rem,1.05vw,.85rem); padding:.22rem .5rem; box-shadow:0 2px 0 var(--navy); }
.celle .boble::after{ bottom:auto; top:50%; left:auto; right:-11px;
  transform:translateY(-50%); border-top-color:transparent; border-left-color:var(--navy); }
.celle .felt{ flex:1 1 auto; width:100%; min-height:0; min-width:0; padding:.15rem .2rem .3rem; display:flex; align-items:center; justify-content:center; }
.celle.ferdig{ background:var(--krem-lys); }
.celle .elevnr{
  font-weight:900; font-size:clamp(.62rem,.95vw,.78rem); color:var(--navy)!important; text-transform:uppercase; letter-spacing:.08em;
  background:var(--krem-dyp); border:2px solid var(--navy); border-radius:999px; padding:.05rem .5rem;
}
.celle .teller{ flex:0 0 auto; }
.celle .tellerboks{ width:24px; height:24px; border-width:2px; border-radius:8px; }
.celle .tellerboks .tallet{ font-size:.78rem; }
.cellejubel{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  font-family:'Fredoka One',cursive; color:#fff; font-size:clamp(1rem,2.2vw,1.8rem);
  padding:.5rem 1.1rem; border-radius:18px; z-index:5; text-align:center;
  border:4px solid var(--navy);
  animation:sprett .45s cubic-bezier(.2,1.6,.4,1); box-shadow:0 5px 0 var(--navy);
}

/* ---------- oppgaveflate ---------- */
.oppgave{ width:100%; height:100%; min-height:0; display:flex; gap:clamp(.4rem,2vw,1.6rem); align-items:center; justify-content:center; }
.celle .oppgave{ flex-direction:column; gap:.35rem; justify-content:center; }

/* Mengdefeltet – alt som viser en mengde, tegnes som SVG og skalerer selv.
   Boksen bestemmer bare hvor stor plass mengden får lov til å ta. */
.mengdeboks{
  position:relative; flex:1 1 auto; min-width:0; min-height:0;
  background:var(--krem-lys); border:5px solid var(--navy); border-radius:22px;
  box-shadow:var(--skygge); padding:clamp(.3rem,1vw,.8rem);
  display:flex; align-items:center; justify-content:center; overflow:hidden;
}
.celle .mengdeboks{ border-width:3px; border-radius:14px; box-shadow:0 3px 0 var(--navy); padding:.25rem; }
.mengde{ width:100%; height:100%; display:block; }

.maalboks{ display:flex; flex-direction:column; align-items:center; gap:.35rem; min-width:0; min-height:0; flex:1 1 56%; height:100%; }
.celle .maalboks{ flex:1 1 auto; width:100%; }
.maalboks .merkelapp{
  flex:0 0 auto;
  font-weight:900; font-size:clamp(.65rem,1.1vw,.85rem); text-transform:uppercase; letter-spacing:.08em;
  color:var(--navy); background:var(--krem-dyp); border:2px solid var(--navy); border-radius:999px; padding:.1rem .7rem;
}
.celle .maalboks .merkelapp{ font-size:.6rem; padding:.05rem .45rem; }

/* Svaralternativene (tallkort) i et rutenett – kolonner og rader settes fra JS. */
.kortrad{
  --kols:2; --rader:2;
  flex:0 0 auto; min-width:0; min-height:0; display:grid;
  grid-template-columns:repeat(var(--kols),auto);
  gap:clamp(.3rem,1.2vw,.9rem); place-content:center; place-items:center;
}
.celle .kortrad{ width:100%; gap:.25rem; }
.kort{ padding:0; border:0; background:transparent; cursor:pointer; font-family:inherit; transition:transform .1s; }
.tallkort{
  position:relative; background:#f9f0d5; border:5px solid var(--navy); border-radius:22px;
  box-shadow:var(--skygge); overflow:hidden; aspect-ratio:1/1;
  display:flex; align-items:center; justify-content:center;
}
.tallkort svg{ width:100%; height:100%; display:block; }
.kort .tallkort{ width:min( calc(30vw / var(--kols)), calc(38vh / var(--rader)) ); }
.celle .kort .tallkort{
  width:min( calc(15vw / var(--kols)), calc(26vh / var(--rader)) );
  border-width:3px; border-radius:14px; box-shadow:0 3px 0 var(--navy);
}
.kort:hover .tallkort{ background:#fffdf5; }
.kort.rett .tallkort{ border-color:var(--gronn-dyp); background:#e9f8dd; box-shadow:0 4px 0 var(--gronn-dyp); }
.kort.feil .tallkort{ border-color:var(--raud); opacity:.4; animation:rist .35s; }
.kort.dempet{ opacity:.35; pointer-events:none; }
.kortrad.laast .kort{ pointer-events:none; }
@keyframes rist{ 0%,100%{ transform:translateX(0) } 25%{ transform:translateX(-6px) } 75%{ transform:translateX(6px) } }

.merke-rett, .merke-feil{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) scale(0);
  font-size:clamp(1.6rem,4vw,3rem); z-index:4; pointer-events:none;
  animation:sprett .35s cubic-bezier(.2,1.6,.4,1) forwards;
}

/* ---------- Fyll tierramma ---------- */
.fyllflate{ width:100%; height:100%; min-height:0; display:flex; align-items:center; justify-content:center; gap:clamp(.4rem,2vw,1.6rem); }
.celle .fyllflate{ flex-direction:column; gap:.3rem; }
.fyllmaal{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:.3rem; }
.fyllmaal .tallkort{ width:min(20vw,26vh); border-color:var(--amber-dyp); }
.celle .fyllmaal{ flex-direction:row; gap:.35rem; }
.celle .fyllmaal .tallkort{ width:min(9vw,11vh); border-width:3px; border-radius:14px; box-shadow:0 3px 0 var(--navy); }
.fyllramme{ flex:1 1 auto; min-width:0; min-height:0; height:100%; display:flex; align-items:center; justify-content:center; }
.celle .fyllramme{ width:100%; }
.rute{ cursor:pointer; }
.fyllteller{
  flex:0 0 auto; display:flex; align-items:center; gap:.4rem;
  font-family:'Fredoka One',cursive; font-size:clamp(.9rem,2vw,1.5rem); color:var(--navy);
  background:var(--krem-dyp); border:3px solid var(--navy); border-radius:999px; padding:.05rem .8rem;
}
.celle .fyllteller{ font-size:clamp(.7rem,1.2vw,1rem); border-width:2px; padding:.02rem .5rem; }

/* ---------- mengde-memory ---------- */
.memory{ height:100%; min-height:0; display:flex; flex-direction:column; gap:.5rem; }
.memorybrett{
  flex:1 1 auto; min-height:0; display:grid; gap:clamp(.3rem,1.2vw,.8rem);
  background:var(--krem); border:5px solid var(--navy); border-radius:26px;
  box-shadow:var(--skygge); padding:clamp(.4rem,1.4vw,.9rem);
}
.mkort{ position:relative; padding:0; border:0; background:transparent; cursor:pointer; min-width:0; min-height:0; perspective:800px; }
.mkort .innside{ position:absolute; inset:0; transform-style:preserve-3d; transition:transform .38s; border-radius:16px; }
.mkort.snudd .innside, .mkort.funnet .innside{ transform:rotateY(180deg); }
.mkort .side{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border:4px solid var(--navy); border-radius:16px; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.mkort .bak{ background:var(--navy); }
.mkort .bak .mynt{
  height:min(46%,90px); aspect-ratio:1/1; border-radius:50%;
  background:var(--amber); border:3px solid #b9821c;
  display:flex; align-items:center; justify-content:center;
  font-family:'Fredoka One',cursive; font-size:clamp(.9rem,2.4vw,1.8rem); color:var(--navy);
}
.mkort .front{ transform:rotateY(180deg); background:#f9f0d5; padding:4px; }
.mkort .front svg{ width:100%; height:100%; display:block; }
.mkort.funnet .front{ border-color:var(--gronn-dyp); background:#e9f8dd; }
.mkort.funnet{ animation:sprett .4s cubic-bezier(.2,1.6,.4,1); }
.mkort.bom .front{ border-color:var(--raud); animation:rist .35s; }
.memorybrett.laast .mkort{ pointer-events:none; }
.mkort.funnet{ pointer-events:none; }

.poengrad{
  flex:0 0 auto; display:flex; align-items:center; justify-content:center; gap:clamp(.5rem,2.5vw,2rem); flex-wrap:wrap;
  background:var(--krem); border:4px solid var(--navy); border-radius:18px; box-shadow:var(--skygge-mjuk);
  padding:.3rem .9rem;
}
.poengspiller{
  display:flex; align-items:center; gap:.35rem; opacity:.45; transition:opacity .2s, transform .2s;
  border:3px solid transparent; border-radius:999px; padding:.1rem .5rem .1rem .1rem;
}
.poengspiller.aktiv{ opacity:1; transform:scale(1.06); background:var(--krem-lys); }
.poengspiller img{ width:38px; height:38px; object-fit:contain; }
.poengspiller .navn{ font-size:clamp(.7rem,1.3vw,1rem); border-width:2px; padding:.02rem .55rem; }
.poengspiller .tall{ font-family:'Fredoka One',cursive; font-size:clamp(1rem,2vw,1.5rem); color:var(--navy); min-width:1.2rem; text-align:center; }

/* ---------- overlay / jubel ---------- */
.jubel{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:.9rem; z-index:40; pointer-events:none; }
.jubel.vis{ display:flex; }
.jubel .tekst{
  font-family:'Fredoka One',cursive; color:var(--amber); text-align:center; line-height:1.1;
  font-size:clamp(2rem,7vw,5.5rem);
  padding:.35rem 1.6rem; border-radius:26px; background:var(--navy); border:5px solid var(--navy);
  box-shadow:0 8px 0 rgba(35,42,63,.35);
  animation:sprett .5s cubic-bezier(.2,1.6,.4,1);
}
@keyframes sprett{ from{ transform:scale(.4); opacity:0 } to{ transform:scale(1); opacity:1 } }
.jubel .valg{ display:flex; gap:.6rem; pointer-events:auto; flex-wrap:wrap; justify-content:center; }
.jubel .valg button{
  font-family:'Fredoka One',cursive; font-size:clamp(1rem,2.4vw,1.6rem);
  border:4px solid var(--navy); border-radius:999px; padding:.5rem 1.6rem; cursor:pointer;
  background:var(--amber); color:var(--navy); box-shadow:0 5px 0 var(--navy);
}
.jubel .valg button:active{ transform:translateY(5px); box-shadow:0 0 0 var(--navy); }
.jubel .valg button.sek{ background:var(--krem-lys); color:var(--navy); }
#konfetti{ position:fixed; inset:0; pointer-events:none; z-index:60; }

/* skjult lærerlinje */
body.rent .topnav, body.rent .laererlinje{ display:none; }
.flytknapp{
  position:fixed; top:8px; right:8px; z-index:50; display:none;
  border:3px solid var(--navy); background:var(--krem); border-radius:999px; padding:.35rem .8rem;
  font-family:inherit; font-weight:900; color:var(--navy); cursor:pointer; box-shadow:0 3px 0 var(--navy);
}
body.rent .flytknapp{ display:block; }

@media (max-width:900px){
  .oppgave, .fyllflate{ flex-direction:column; gap:.4rem; }
  .arena .heier{ width:20vw; }
  .arena .felt{ padding-left:min(22vw,150px); }
  .kort .tallkort{ width:min( calc(24vw / var(--kols)), calc(20vh / var(--rader)) ); }
  .fyllmaal .tallkort{ width:min(16vw,14vh); }
}
@media (prefers-reduced-motion:reduce){

<script>
/* ============================================================
   TELLEVERKSTEDET – Myntland
   ------------------------------------------------------------
   Fire oppgavetyper som alle handler om antall:
     1) Hvor mange?      – en mengde vises, eleven velger tallet
     2) Fyll tierramma   – tallet vises, eleven lager mengden selv
     3) Venner til 10    – hvor mange mangler for å bli 5/10/20
     4) Mengde-memory    – snu to kort: mengde + tall som hører sammen

   Mengdene tegnes som SVG rett i sida. Det gjør at de skalerer perfekt
   både på storskjerm og i firedelt visning. Eneste unntak er fingrene:
   der ligger fem monsterlabber i bilder/lyd/haand-1..5.webp – samme
   fellesmappe som ordbildene og monsteravatarene bruker. Mangler
   de, faller verktøyet tilbake på en tegnet hånd – det virker altså
   uansett, med denne fila alene.

   Lyd: tall-0 … tall-9 finnes fra før (Skriveverkstedet). tall-10 …
   tall-20 og de fire nye replikkene står i telleverkstedet-innlesing.html.
   Mangler en mp3, hopper verktøyet bare over den.
   ============================================================ */

/* ---------- Tallbanken ---------- */
const TALL_MIN = 1, TALL_MAX = 20;
const ALLE_TALL = Array.from({length:TALL_MAX - TALL_MIN + 1}, (_,i) => TALL_MIN + i);
const TALLORD = ["null","én","to","tre","fire","fem","seks","sju","åtte","ni","ti",
                 "elleve","tolv","tretten","fjorten","femten","seksten","sytten","atten","nitten","tjue"];

/* Mengdene kan vises på fire måter. Fingre stopper på 10 – to hender er nok. */
const REPR = ["ramme","terning","fingre","mynter"];
const REPR_NAVN = { blandet:"Blandet", ramme:"Tierramme", terning:"Terning", fingre:"Fingre", mynter:"Mynthaug" };
const lovligeRepr = n => REPR.filter(r => r !== "fingre" || n <= 10);

/* ---------- Elevfarger og monstre ---------- */
const LAG = [
  { navn:"Drage",   fil:"ildkatt",     farge:"#E23B2E", morkt:"#9c1f16" },
  { navn:"Bølge",   fil:"indigo",      farge:"#1F7AE0", morkt:"#0e4585" },
  { navn:"Skog",    fil:"gressgroenn", farge:"#17A05C", morkt:"#0a5b34" },
  { navn:"Stjerne", fil:"gullgul",     farge:"#EF9F27", morkt:"#a06a10" }
];
const FARGER = ["#E23B2E","#1F7AE0","#17A05C","#EF9F27","#7B4BD8","#0E9C9C","#D63F86","#C2571A"];
const forsokFarge = (plass, forsok) => FARGER[((plass * 5 + forsok) % FARGER.length + FARGER.length) % FARGER.length];

const HEIAROP  = ["Tell høyt!","Pek og tell!","Ta det rolig!","Hvor mange?","Bra!","Tell én gang til!","Så flink!","Du klarer det!"];
const JUBELROP = ["Kjempebra!","Perfekt!","Så fint!","Supert!","Bra telt!"];
const BOMROP   = ["Nesten! Tell en gang til.","Pek på hver mynt og tell.","Prøv igjen – tell rolig."];

const OPPGAVER = {
  hvormange: { tittel:() => "<em>Hvor mange</em> er det?",                                lyd:"hvor-mange" },
  fyll:      { tittel:() => "Legg <em>riktig antall</em> mynter i ramma",                 lyd:"legg-i-ramma" },
  venner:    { tittel:() => "Hvor mange <em>mangler</em> for å bli " + app.helhet + "?",  lyd:"hvor-mange-mangler" },
  memory:    { tittel:() => "Snu to kort og finn <em>mengden</em> som passer til tallet", lyd:"finn-tallpar" }
};

/* ---------- Tilstand ---------- */
const app = {
  oppgave:"hvormange", modus:"tur",
  antall:4, runder:3, valg:4, brett:12, helhet:10, repr:"blandet", visOrd:false,
  aktive:null, tur:0, rep:0, ferdigeSett:0,
  flater:[], tallko:[], sisteRepr:null
};

/* ---------- Små hjelpere ---------- */
const $ = s => document.querySelector(s);
const tilfeldig = a => a[Math.floor(Math.random()*a.length)];
const bland = a => { const b = a.slice(); for (let i=b.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [b[i],b[j]] = [b[j],b[i]]; } return b; };
const monsterUrl = fil => "bilder/lyd/monster-" + fil + ".webp";
const monsterReserve = fil => "https://myntland.no/monsters/" + fil + ".webp";
/* Liten, forutsigbar tilfeldighet: samme frø gir samme mynthaug hver gang
   den tegnes på nytt. Da hopper ikke myntene rundt når kortet snus. */
function froRekke(fro){ let s = (fro >>> 0) || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

/* ---------- Lyd ---------- */
let lydPaa = true, ac = null;
function lydKontekst(){
  if (!ac) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
  if (ac && ac.state === "suspended") ac.resume();
  return ac;
}
function tone(freq, tid=0.12, type="sine", vol=0.15, forsink=0){
  if (!lydPaa) return;
  const k = lydKontekst(); if (!k) return;
  const o = k.createOscillator(), g = k.createGain();
  o.type = type; o.frequency.value = freq;
  const t0 = k.currentTime + forsink;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + tid);
  o.connect(g); g.connect(k.destination); o.start(t0); o.stop(t0 + tid + 0.05);
}
const lydKlikk  = () => tone(560, 0.07, "triangle", 0.09);
const lydSnu    = () => tone(660, 0.09, "triangle", 0.10);
const lydRunde  = () => [660,880].forEach((f,i)=>tone(f,0.14,"triangle",0.13,i*0.09));
const lydFerdig = () => [523,659,784,1047].forEach((f,i)=>tone(f,0.18,"triangle",0.14,i*0.09));
const lydFanfare= () => [523,659,784,1047,1319,1047,1319].forEach((f,i)=>tone(f,0.24,"triangle",0.15,i*0.11));
const lydFeil   = () => [330,247].forEach((f,i)=>tone(f,0.16,"sine",0.10,i*0.10));

/* ---------- Innlest tale (mp3) ---------- */
const LYDSTI = "lyd/";
const REPLIKKER = [
  "hvor-mange","legg-i-ramma","hvor-mange-mangler","finn-tallpar","tallpar",  /* nye – leses inn */
  "riktig","proev-igjen",                                                     /* fins alt i /lyd/ */
  "din-tur","neste-elev","alle-sammen"                                        /* fins alt i /lyd/ */
];

const lydLager = new Map();
let taleNr = 0, spillerNaa = null;

function hentLyd(navn){
  let a = lydLager.get(navn);
  if (!a){ a = new Audio(LYDSTI + navn + ".mp3"); a.preload = "auto"; lydLager.set(navn, a); }
  return a;
}
function forbered(...navn){ navn.forEach(n => { try { hentLyd(n).load(); } catch(e){} }); }
function stoppTale(){
  taleNr++;
  if (spillerNaa){ try { spillerNaa.pause(); spillerNaa.currentTime = 0; } catch(e){} spillerNaa = null; }
}
/* si("riktig","tall-7") spiller filene etter hverandre. Ny si() avbryter den
   forrige, og en fil som mangler hopper vi bare over. */
function si(...navn){
  if (!lydPaa || !navn.length) return;
  stoppTale();
  const mitt = taleNr;
  const kjoer = i => {
    if (i >= navn.length || mitt !== taleNr) return;
    const a = hentLyd(navn[i]);
    let brukt = false;
    const videre = () => {
      if (brukt) return;
      brukt = true;
      a.removeEventListener("ended", videre);
      a.removeEventListener("error", videre);
      if (mitt === taleNr) kjoer(i + 1);
    };
    a.addEventListener("ended", videre);
    a.addEventListener("error", videre);
    try { a.currentTime = 0; } catch(e){}
    spillerNaa = a;
    const p = a.play();
    if (p && p.catch) p.catch(videre);
  };
  kjoer(0);
}
const siTall = n => si("tall-" + n);
/* Stemmen er med når én elev holder på om gangen. I «Flere samtidig» sitter
   fire elever ved samme skjerm, og fire stemmer oppå hverandre blir bare støy.
   Memory har ett felles brett og går tur for tur, så der beholder vi lyden. */
const talePaa = () => app.oppgave === "memory" || app.modus !== "flere";

/* ---------- Tidsutløsere som hører til runden ---------- */
let rundeTimere = [];
function senere(fn, ms){ const t = setTimeout(() => { rundeTimere = rundeTimere.filter(x => x !== t); fn(); }, ms); rundeTimere.push(t); return t; }
function stoppTimere(){ rundeTimere.forEach(clearTimeout); rundeTimere = []; }

/* ---------- Konfetti ---------- */
const kanvas = $("#konfetti"), ktx = kanvas.getContext("2d");
let biter = [], konfettiKjorer = false;
function skalerKanvas(){
  const d = window.devicePixelRatio || 1;
  kanvas.width = innerWidth * d; kanvas.height = innerHeight * d;
  kanvas.style.width = innerWidth + "px"; kanvas.style.height = innerHeight + "px";
  ktx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener("resize", skalerKanvas); skalerKanvas();
const KONFETTIFARGER = ["#E23B2E","#1F7AE0","#17A05C","#EF9F27","#534AB7","#D85A30","#ff6fb5","#25c7c7"];
function konfetti(x, y, antall=90, fart=1){
  for (let i=0;i<antall;i++){
    const v = (Math.random()*7+3)*fart, a = Math.random()*Math.PI*2;
    biter.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 4,
      st:Math.random()*8+5, f:tilfeldig(KONFETTIFARGER),
      r:Math.random()*Math.PI, vr:(Math.random()-0.5)*0.4, liv:1 });
  }
  if (!konfettiKjorer){ konfettiKjorer = true; requestAnimationFrame(tegnKonfetti); }
}
function storKonfetti(){
  const b = innerWidth, h = innerHeight;
  konfetti(b*0.2, h*0.45, 110, 1.3); konfetti(b*0.8, h*0.45, 110, 1.3);
  konfetti(b*0.5, h*0.35, 140, 1.5);
  setTimeout(()=>{ konfetti(b*0.35,h*0.5,90,1.2); konfetti(b*0.65,h*0.5,90,1.2); }, 260);
}
function tegnKonfetti(){
  ktx.clearRect(0,0,innerWidth,innerHeight);
  biter = biter.filter(p => p.liv > 0 && p.y < innerHeight + 60);
  for (const p of biter){
    p.vy += 0.22; p.x += p.vx; p.y += p.vy; p.vx *= 0.99; p.r += p.vr; p.liv -= 0.004;
    ktx.save(); ktx.translate(p.x, p.y); ktx.rotate(p.r); ktx.globalAlpha = Math.max(0, Math.min(1, p.liv*1.6));
    ktx.fillStyle = p.f; ktx.fillRect(-p.st/2, -p.st/2, p.st, p.st*0.6); ktx.restore();
  }
  if (biter.length){ requestAnimationFrame(tegnKonfetti); }
  else { konfettiKjorer = false; ktx.clearRect(0,0,innerWidth,innerHeight); }
}

/* ============================================================
   SVG – mengdene tegnes her
   ------------------------------------------------------------
   Alle fire visningene ender som en <svg> med egen viewBox og
   preserveAspectRatio. Da kan boksen rundt ha hvilken som helst
   form – mengden legger seg alltid midt i og fyller det den kan.
   ============================================================ */
const NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attr){
  const e = document.createElementNS(NS, tag);
  for (const k in attr) e.setAttribute(k, attr[k]);
  return e;
}
function nySvg(b, h){
  const s = svgEl("svg", { viewBox:"0 0 " + b + " " + h, preserveAspectRatio:"xMidYMid meet" });
  s.setAttribute("class", "mengde");
  return s;
}
/* Én mynt. Klassen «mynt» brukes også når vi teller etter i testene. */
function tegnMynt(vert, cx, cy, r){
  const g = svgEl("g", { class:"mynt" });
  g.appendChild(svgEl("circle", { cx, cy, r, fill:"#EF9F27", stroke:"#232a3f", "stroke-width":r*0.16 }));
  g.appendChild(svgEl("circle", { cx, cy, r:r*0.56, fill:"none", stroke:"#c4841a", "stroke-width":r*0.11 }));
  vert.appendChild(g);
  return g;
}

/* ---------- Tierramme ----------
   maks = 5, 10 eller 20 ruter. 5 blir én rad, 10 blir 2×5, 20 blir to
   slike rammer under hverandre. Rutene fylles radvis fra venstre. */
const RUTE = 100, RAMMEGAP = 34, KANT = 8;
function rammeOppsett(maks){
  const rader = maks === 5 ? 1 : 2;
  const rammer = maks > 10 ? 2 : 1;
  return { rader, rammer, kolonner:5, hoyde:rader*RUTE };
}
function ruteMidt(i, o){
  const perRamme = o.rader * o.kolonner;
  const ramme = Math.floor(i / perRamme), lokal = i % perRamme;
  const rad = Math.floor(lokal / o.kolonner), kol = lokal % o.kolonner;
  return {
    cx: kol*RUTE + RUTE/2,
    cy: ramme*(o.hoyde + RAMMEGAP) + rad*RUTE + RUTE/2
  };
}
function tegnRamme(antall, maks, klikkbar){
  const o = rammeOppsett(maks);
  const b = o.kolonner * RUTE, h = o.rammer*o.hoyde + (o.rammer-1)*RAMMEGAP;
  const s = nySvg(b + KANT*2, h + KANT*2);
  const g = svgEl("g", { transform:"translate(" + KANT + "," + KANT + ")" });
  s.appendChild(g);

  for (let f=0; f<o.rammer; f++){
    const y = f*(o.hoyde + RAMMEGAP);
    g.appendChild(svgEl("rect", { x:0, y, width:b, height:o.hoyde, rx:18,
      fill:"#fffaeb", stroke:"#232a3f", "stroke-width":7 }));
    for (let k=1; k<o.kolonner; k++)
      g.appendChild(svgEl("line", { x1:k*RUTE, y1:y, x2:k*RUTE, y2:y+o.hoyde,
        stroke:"#232a3f", "stroke-width":3, opacity:.35 }));
    if (o.rader > 1)
      g.appendChild(svgEl("line", { x1:0, y1:y+RUTE, x2:b, y2:y+RUTE,
        stroke:"#232a3f", "stroke-width":3, opacity:.35 }));
  }

  const myntlag = svgEl("g", {});
  g.appendChild(myntlag);
  for (let i=0; i<antall && i<maks; i++){
    const m = ruteMidt(i, o);
    tegnMynt(myntlag, m.cx, m.cy, RUTE*0.34);
  }

  if (klikkbar){
    const treff = svgEl("g", {});
    g.appendChild(treff);
    for (let i=0; i<maks; i++){
      const m = ruteMidt(i, o);
      const r = svgEl("rect", { class:"rute", x:m.cx-RUTE/2, y:m.cy-RUTE/2,
        width:RUTE, height:RUTE, fill:"transparent" });
      r.dataset.i = i;
      treff.appendChild(r);
    }
  }
  s._myntlag = myntlag; s._oppsett = o; s._maks = maks;
  return s;
}
/* Tegner om bare myntene – brukes når eleven fyller ramma. */
function settRammeAntall(svg, antall){
  const lag = svg._myntlag, o = svg._oppsett;
  lag.textContent = "";
  for (let i=0; i<antall && i<svg._maks; i++){
    const m = ruteMidt(i, o);
    tegnMynt(lag, m.cx, m.cy, RUTE*0.34);
  }
}

/* ---------- Terninger ---------- */
const OYNE = {
  1:[[.5,.5]],
  2:[[.28,.28],[.72,.72]],
  3:[[.28,.28],[.5,.5],[.72,.72]],
  4:[[.28,.28],[.72,.28],[.28,.72],[.72,.72]],
  5:[[.28,.28],[.72,.28],[.5,.5],[.28,.72],[.72,.72]],
  6:[[.28,.28],[.72,.28],[.28,.5],[.72,.5],[.28,.72],[.72,.72]]
};
function terningDeler(n){
  const d = []; let rest = n;
  while (rest > 0){ const t = Math.min(6, rest); d.push(t); rest -= t; }
  return d;
}
function tegnTerning(n){
  const deler = terningDeler(n);
  const T = 200, GAP = 26;
  const kols = deler.length <= 3 ? deler.length : Math.ceil(deler.length/2);
  const rader = Math.ceil(deler.length / kols);
  const b = kols*T + (kols-1)*GAP, h = rader*T + (rader-1)*GAP;
  const s = nySvg(b + KANT*2, h + KANT*2);
  const g = svgEl("g", { transform:"translate(" + KANT + "," + KANT + ")" });
  s.appendChild(g);

  deler.forEach((verdi, i) => {
    const kol = i % kols, rad = Math.floor(i / kols);
    const x = kol*(T+GAP), y = rad*(T+GAP);
    g.appendChild(svgEl("rect", { x, y, width:T, height:T, rx:34,
      fill:"#fffaeb", stroke:"#232a3f", "stroke-width":7 }));
    OYNE[verdi].forEach(p => {
      g.appendChild(svgEl("circle", { class:"oye mynt", cx:x + p[0]*T, cy:y + p[1]*T, r:19, fill:"#232a3f" }));
    });
  });
  return s;
}

/* ---------- Fingre ----------
   Én labb per fem: haand-1.webp viser én finger opp, haand-5.webp hele
   labben. 6–10 settes sammen av en full labb pluss resten, speilvendt.

   Finner nettleseren ikke bildene (f.eks. hvis bare HTML-fila er lastet
   opp), går verktøyet over til den tegnede reservehånda lenger nede.
   Da er antallet fortsatt riktig – det er regnet ut, ikke tegnet. */
const HAAND_B = 480, HAAND_H = 490, HAAND_GAP = 30;
const HAAND_STI = "bilder/lyd/haand-";
const HAAND_RESERVE = "https://myntland.no/bilder/lyd/haand-";
let haandKilde = HAAND_STI;

(function proevHaandbilder(){
  const prov = i => {
    if (i > 1){ haandKilde = ""; return; }          /* ingen bilder – bruk tegnet hånd */
    const sti = i === 0 ? HAAND_STI : HAAND_RESERVE;
    const im = new Image();
    im.onload  = () => { haandKilde = sti; for (let n=1;n<=5;n++) new Image().src = sti + n + ".webp"; };
    im.onerror = () => prov(i + 1);
    im.src = sti + "5.webp";
  };
  prov(0);
})();

function leggLabb(s, dx, opp, speil){
  const url = haandKilde + opp + ".webp";
  const im = svgEl("image", { class:"haand", x:0, y:0, width:HAAND_B, height:HAAND_H,
    href:url, preserveAspectRatio:"xMidYMax meet",
    transform: speil ? "translate(" + (dx + HAAND_B) + ",0) scale(-1,1)" : "translate(" + dx + ",0)" });
  im.setAttributeNS("http://www.w3.org/1999/xlink", "xlink:href", url);   /* eldre nettlesere */
  im.dataset.opp = opp;
  s.appendChild(im);
}
function tegnFingre(n){
  if (!haandKilde) return tegnFingreStrek(n);
  const hender = n <= 5 ? 1 : 2;
  const b = hender*HAAND_B + (hender-1)*HAAND_GAP;
  const s = nySvg(b, HAAND_H);
  leggLabb(s, 0, Math.min(n, 5), false);
  if (hender === 2) leggLabb(s, HAAND_B + HAAND_GAP, n - 5, true);
  return s;
}

/* ---------- Reservehånd, tegnet i SVG ----------
   Brukes bare hvis labbebildene ikke finnes. Vi teller fra tommelen,
   slik de fleste barn gjør. Løftet finger er lang og gul; bøyd finger
   er en kort, blek stubb. */
const STREK_B = 210, STREK_H = 270;
function tegnEnHaand(g, dx, opp, speil){
  const h = svgEl("g", { transform: speil
    ? "translate(" + (dx + STREK_B) + ",0) scale(-1,1)"
    : "translate(" + dx + ",0)" });
  g.appendChild(h);

  const hud = "#f7d3ab", hudMork = "#232a3f";
  /* håndflate */
  h.appendChild(svgEl("rect", { x:34, y:150, width:140, height:104, rx:38,
    fill:hud, stroke:hudMork, "stroke-width":7 }));

  /* tommel: løftet peker ut til siden, bøyd ligger inntil hånda */
  const tommelOpp = opp >= 1;
  const tommel = svgEl("rect", tommelOpp
    ? { x:-16, y:168, width:86, height:32, rx:16, transform:"rotate(24 60 184)" }
    : { x:26,  y:170, width:46, height:30, rx:15 });
  tommel.setAttribute("fill", tommelOpp ? "#EF9F27" : "#f0ddc4");
  tommel.setAttribute("stroke", hudMork);
  tommel.setAttribute("stroke-width", 7);
  tommel.setAttribute("class", "finger" + (tommelOpp ? " opp" : ""));
  h.appendChild(tommel);

  /* de fire fingrene */
  for (let f=0; f<4; f++){
    const reist = opp >= f + 2;
    const x = 44 + f*32;
    const lengde = reist ? 100 : 30;
    const r = svgEl("rect", { class:"finger" + (reist ? " opp" : ""),
      x, y:160 - lengde, width:26, height:lengde + 24, rx:13,
      fill: reist ? "#EF9F27" : "#f0ddc4", stroke:hudMork, "stroke-width":7 });
    h.appendChild(r);
  }
}
function tegnFingreStrek(n){
  const hender = n <= 5 ? 1 : 2;
  const GAP = 40, LUFT = 34;   /* tommelen stikker ut til siden – den må få plass */
  const b = hender*STREK_B + (hender-1)*GAP;
  const s = nySvg(b + (KANT+LUFT)*2, STREK_H + KANT*2);
  const g = svgEl("g", { transform:"translate(" + (KANT+LUFT) + "," + KANT + ")" });
  s.appendChild(g);
  tegnEnHaand(g, 0, Math.min(n, 5), false);
  if (hender === 2) tegnEnHaand(g, STREK_B + GAP, n - 5, true);
  return s;
}

/* ---------- Mynthaug ----------
   Uorganisert mengde: her må eleven holde styr på hva som er telt.
   Myntene ligger på et usynlig rutenett med litt slark, så de aldri
   overlapper, men heller aldri står på pinne og rad. */
function tegnHaug(n, fro){
  const rnd = froRekke(fro || n * 7919);
  const CELLE = 120, R = 42, SLARK = 15;
  const kols = Math.max(1, Math.ceil(Math.sqrt(n * 1.3)));
  const rader = Math.ceil(n / kols);
  const b = kols*CELLE, h = rader*CELLE;
  const s = nySvg(b + KANT*2, h + KANT*2);
  const g = svgEl("g", { transform:"translate(" + KANT + "," + KANT + ")" });
  s.appendChild(g);
  for (let i=0; i<n; i++){
    const kol = i % kols, rad = Math.floor(i / kols);
    const cx = kol*CELLE + CELLE/2 + (rnd()*2 - 1)*SLARK;
    const cy = rad*CELLE + CELLE/2 + (rnd()*2 - 1)*SLARK;
    tegnMynt(g, cx, cy, R);
  }
  return s;
}

/* ---------- Velg og tegn ---------- */
function velgRepr(n, unnta){
  if (app.repr !== "blandet") return lovligeRepr(n).includes(app.repr) ? app.repr : "ramme";
  const kandidater = lovligeRepr(n).filter(r => r !== unnta);
  return tilfeldig(kandidater.length ? kandidater : lovligeRepr(n));
}
function tegnMengde(n, repr, fro){
  if (repr === "terning") return tegnTerning(n);
  if (repr === "fingre")  return tegnFingre(n);
  if (repr === "mynter")  return tegnHaug(n, fro);
  return tegnRamme(n, n <= 10 ? 10 : 20, false);
}
function mengdeBoks(n, repr, fro){
  const d = document.createElement("div");
  d.className = "mengdeboks";
  d.appendChild(tegnMengde(n, repr, fro));
  return d;
}

/* ---------- Tallkort ----------
   Tallet tegnes som SVG-tekst. Da vokser sifferet med kortet, uten en
   eneste mediaspørring – også i firedelt visning. */
function tallKortSvg(n){
  const s = nySvg(100, 118);
  const t = svgEl("text", { x:50, y:78, "text-anchor":"middle",
    "font-family":"'Fredoka One', cursive", "font-size":76, fill:"#232a3f" });
  t.textContent = n;
  s.appendChild(t);
  const o = svgEl("text", { class:"tallord", x:50, y:106, "text-anchor":"middle",
    "font-family":"'Nunito', sans-serif", "font-weight":900, "font-size":17, fill:"#6b7690" });
  o.textContent = (TALLORD[n] || "").toUpperCase();
  o.style.display = app.visOrd ? "" : "none";
  s.appendChild(o);
  s._ordtekst = o;
  return s;
}
function lagTallkort(n){
  const d = document.createElement("div");
  d.className = "tallkort";
  const s = tallKortSvg(n);
  d.appendChild(s);
  d._tekst = s._ordtekst;
  return d;
}

function merke(vert, tegn){
  const d = document.createElement("div");
  d.className = tegn === "✓" ? "merke-rett" : "merke-feil";
  d.textContent = tegn;
  vert.appendChild(d);
  setTimeout(()=>d.remove(), 1400);
}

/* ============================================================
   UTVALG AV TALL
   ------------------------------------------------------------
   Læreren slår tall av og på. Jobber klassen med 1–5 denne uka,
   står bare de fem på. Valget huskes på denne maskina.
   ============================================================ */
function aktiveTall(){
  const liste = ALLE_TALL.filter(n => app.aktive.has(n));
  return liste.length ? liste : ALLE_TALL.slice();
}
function fyllTallkoe(){ app.tallko = bland(aktiveTall()); }
function nesteTall(unnta){
  if (!app.tallko.length) fyllTallkoe();
  let n = app.tallko.shift();
  if (unnta && unnta.length && unnta.includes(n) && app.tallko.length){
    const bytt = app.tallko.findIndex(x => !unnta.includes(x));
    if (bytt >= 0){ app.tallko.push(n); n = app.tallko.splice(bytt,1)[0]; }
  }
  return n;
}

/* Distraktorer: nabotall først – det er dem eleven bommer på når hen
   teller ett for mye eller ett for lite. Vi trekker blant de nærmeste
   så det ikke alltid blir nøyaktig ±1. */
function velgTallDistraktorer(fasit, antall, bassen){
  const kandidater = (bassen && bassen.length >= antall + 1 ? bassen : ALLE_TALL)
    .filter(n => n !== fasit)
    .sort((a,b) => Math.abs(a-fasit) - Math.abs(b-fasit) || a-b);
  const naere = kandidater.slice(0, Math.min(kandidater.length, antall + 2));
  const valgt = bland(naere).slice(0, antall);
  /* Skulle bassenget være for lite, fyller vi på fra hele tallområdet. */
  for (const n of ALLE_TALL){
    if (valgt.length >= antall) break;
    if (n !== fasit && !valgt.includes(n)) valgt.push(n);
  }
  return valgt.slice(0, antall);
}

/* Rutenettet for svaralternativene: 2 og 3 kort på én rad, 4 som 2×2, 5 som 3+2. */
function settRutenett(rad, n){
  const kols = n <= 3 ? n : n === 4 ? 2 : 3;
  rad.style.setProperty("--kols", kols);
  rad.style.setProperty("--rader", Math.ceil(n / kols));
}

/* ============================================================
   OPPGAVE 1 – HVOR MANGE ER DET?
   ============================================================ */
function lagHvorMangeFlate(vert, farge, valg, unnta){
  const n = nesteTall(unnta);
  const repr = velgRepr(n, app.sisteRepr); app.sisteRepr = repr;
  const svarene = bland([n, ...velgTallDistraktorer(n, app.valg - 1, aktiveTall())]);

  const rot = document.createElement("div");
  rot.className = "oppgave";

  const maalboks = document.createElement("div");
  maalboks.className = "maalboks";
  const lapp = document.createElement("div");
  lapp.className = "merkelapp"; lapp.textContent = "Hvor mange?";
  const boks = mengdeBoks(n, repr, n * 31 + Math.floor(Math.random()*1000));
  boks.style.borderColor = farge;
  maalboks.appendChild(lapp); maalboks.appendChild(boks);

  const rad = document.createElement("div");
  rad.className = "kortrad";
  settRutenett(rad, svarene.length);

  const tekster = [], kortEl = [];
  svarene.forEach(t => {
    const kn = document.createElement("button");
    kn.className = "kort"; kn.type = "button";
    const kort = lagTallkort(t);
    kn.appendChild(kort);
    tekster.push(kort._tekst);
    kn._tall = t; kn._kort = kort;
    kn.addEventListener("click", () => svar(kn, t));
    rad.appendChild(kn);
    kortEl.push(kn);
  });

  rot.appendChild(maalboks); rot.appendChild(rad);
  vert.appendChild(rot);

  let ferdig = false;
  function svar(kn, t){
    if (ferdig) return;
    if (t === n){
      ferdig = true;
      rad.classList.add("laast");
      kn.classList.add("rett");
      merke(kn._kort, "✓");
      valg.paaRiktig && valg.paaRiktig();
      if (talePaa()) si("riktig", "tall-" + n);
      valg.paaFerdig && senere(valg.paaFerdig, 700);
    } else {
      kn.classList.add("feil");
      lydFeil();
      merke(kn._kort, "✕");
      setTimeout(()=>{ kn.classList.remove("feil"); kn.classList.add("dempet"); }, 380);
      valg.paaBom && valg.paaBom();
      if (talePaa()) si("proev-igjen");
    }
  }

  return {
    fasit: n, tallKey: n, repr,
    settOrdtekst: paa => tekster.forEach(t => { t.style.display = paa ? "" : "none"; }),
    visMeg: () => {
      const treff = kortEl.find(k => k._tall === n);
      if (!treff) return;
      treff.classList.add("rett");
      if (talePaa()) siTall(n);
      setTimeout(()=>{ if (!ferdig) treff.classList.remove("rett"); }, 1600);
    },
    sporsmaal: () => { if (talePaa()) si("hvor-mange"); }
  };
}

/* ============================================================
   OPPGAVE 2 – FYLL TIERRAMMA
   ------------------------------------------------------------
   Motsatt vei: tallet står der, og eleven lager mengden selv. Hvert
   trykk legger en mynt i ramma og teller høyt. Trykker eleven på en
   full rute, tas mynten bort igjen. Ramma er nøyaktig så stor at det
   ikke går an å legge i for mange.
   ============================================================ */
function lagFyllFlate(vert, farge, valg, unnta){
  const n = nesteTall(unnta);
  /* Alltid hele tierramma (eller to av dem over ti). Da ser eleven både
     hvor mange hen har lagt, og hvor mange som mangler opp til ti. */
  const maks = n <= 10 ? 10 : 20;

  const rot = document.createElement("div");
  rot.className = "fyllflate";

  const maal = document.createElement("div");
  maal.className = "fyllmaal";
  const lapp = document.createElement("div");
  lapp.className = "merkelapp"; lapp.textContent = "Legg så mange";
  const kort = lagTallkort(n);
  const teller = document.createElement("div");
  teller.className = "fyllteller";
  teller.textContent = "0 🪙";
  maal.appendChild(lapp); maal.appendChild(kort); maal.appendChild(teller);

  const rammefelt = document.createElement("div");
  rammefelt.className = "fyllramme";
  const svg = tegnRamme(0, maks, true);
  rammefelt.appendChild(svg);

  rot.appendChild(maal); rot.appendChild(rammefelt);
  vert.appendChild(rot);

  let fylt = 0, ferdig = false;

  function tegnOm(){
    /* Myntene legger seg alltid fra venstre – da blir ramma lesbar
       uansett hvor i ramma eleven trykker. */
    settRammeAntall(svg, fylt);
    teller.textContent = fylt + " 🪙";
  }

  svg.querySelectorAll(".rute").forEach(r => {
    r.addEventListener("click", () => {
      if (ferdig) return;
      /* Trykk på en rute med mynt tar mynten bort igjen; trykk på en tom
         rute legger en ny til. Ramma har akkurat nok ruter til at det
         ikke går an å legge i for mange. */
      const i = +r.dataset.i;
      if (i < fylt) fylt--;
      else if (fylt < maks) fylt++;
      tegnOm();
      if (fylt === n){
        ferdig = true;
        kort.style.borderColor = "#4f8f28";
        merke(kort, "✓");
        valg.paaRiktig && valg.paaRiktig();
        if (talePaa()) si("riktig", "tall-" + n);
        valg.paaFerdig && senere(valg.paaFerdig, 800);
      } else {
        lydKlikk();
        if (talePaa()) siTall(fylt);
      }
    });
  });

  return {
    fasit: n, tallKey: n, repr:"ramme",
    settOrdtekst: paa => { kort._tekst.style.display = paa ? "" : "none"; },
    visMeg: () => {
      if (ferdig) return;
      settRammeAntall(svg, n);
      if (talePaa()) siTall(n);
      setTimeout(()=>{ if (!ferdig) tegnOm(); }, 1600);
    },
    /* Tallet først, så beskjeden: «Sju. Legg så mange mynter i ramma.» */
    sporsmaal: () => { if (talePaa()) si("tall-" + n, "legg-i-ramma"); }
  };
}

/* ============================================================
   OPPGAVE 3 – VENNER TIL 10
   ------------------------------------------------------------
   Ramma er delvis fylt, og eleven finner tallet som mangler for at
   det skal bli helt. Læreren velger om helheten er 5, 10 eller 20.
   ============================================================ */
function lagVennerFlate(vert, farge, valg, unnta){
  const H = app.helhet;
  const mulige = aktiveTall().filter(t => t < H);
  const bassen = mulige.length ? mulige : ALLE_TALL.filter(t => t < H);
  let k = tilfeldig(bassen);
  if (unnta && unnta.length && unnta.includes(k)){
    const fri = bassen.filter(t => !unnta.includes(t));
    if (fri.length) k = tilfeldig(fri);
  }
  const mangler = H - k;
  const svarene = bland([mangler, ...velgTallDistraktorer(mangler, app.valg - 1, ALLE_TALL.filter(t => t <= H))]);

  const rot = document.createElement("div");
  rot.className = "oppgave";

  const maalboks = document.createElement("div");
  maalboks.className = "maalboks";
  const lapp = document.createElement("div");
  lapp.className = "merkelapp"; lapp.textContent = "Skal bli " + H;
  const boks = document.createElement("div");
  boks.className = "mengdeboks";
  boks.style.borderColor = farge;
  boks.appendChild(tegnRamme(k, H, false));
  maalboks.appendChild(lapp); maalboks.appendChild(boks);

  const rad = document.createElement("div");
  rad.className = "kortrad";
  settRutenett(rad, svarene.length);

  const tekster = [], kortEl = [];
  svarene.forEach(t => {
    const kn = document.createElement("button");
    kn.className = "kort"; kn.type = "button";
    const kort = lagTallkort(t);
    kn.appendChild(kort);
    tekster.push(kort._tekst);
    kn._tall = t; kn._kort = kort;
    kn.addEventListener("click", () => svar(kn, t));
    rad.appendChild(kn);
    kortEl.push(kn);
  });

  rot.appendChild(maalboks); rot.appendChild(rad);
  vert.appendChild(rot);

  let ferdig = false;
  function svar(kn, t){
    if (ferdig) return;
    if (t === mangler){
      ferdig = true;
      rad.classList.add("laast");
      kn.classList.add("rett");
      merke(kn._kort, "✓");
      /* Fasiten fylles inn i ramma, så eleven ser at det ble helt. */
      boks.textContent = "";
      boks.appendChild(tegnRamme(H, H, false));
      valg.paaRiktig && valg.paaRiktig();
      if (talePaa()) si("riktig", "tall-" + mangler);
      valg.paaFerdig && senere(valg.paaFerdig, 900);
    } else {
      kn.classList.add("feil");
      lydFeil();
      merke(kn._kort, "✕");
      setTimeout(()=>{ kn.classList.remove("feil"); kn.classList.add("dempet"); }, 380);
      valg.paaBom && valg.paaBom();
      if (talePaa()) si("proev-igjen");
    }
  }

  return {
    fasit: mangler, tallKey: k, repr:"ramme",
    settOrdtekst: paa => tekster.forEach(t => { t.style.display = paa ? "" : "none"; }),
    visMeg: () => {
      const treff = kortEl.find(x => x._tall === mangler);
      if (!treff) return;
      treff.classList.add("rett");
      if (talePaa()) siTall(mangler);
      setTimeout(()=>{ if (!ferdig) treff.classList.remove("rett"); }, 1600);
    },
    sporsmaal: () => { if (talePaa()) si("hvor-mange-mangler"); }
  };
}

function lagOppgave(vert, farge, valg, unnta){
  if (app.oppgave === "fyll")   return lagFyllFlate(vert, farge, valg, unnta);
  if (app.oppgave === "venner") return lagVennerFlate(vert, farge, valg, unnta);
  return lagHvorMangeFlate(vert, farge, valg, unnta);
}

/* ============================================================
   FELLESDELER – monster, teller, jubel
   ============================================================ */
function monsterBoks(lag, ropTekst){
  const d = document.createElement("div");
  d.className = "heier"; d.style.color = lag.farge;
  const img = document.createElement("img");
  img.className = "monster"; img.alt = "Monsteret " + lag.navn;
  img.src = monsterUrl(lag.fil);
  img.onerror = () => { img.onerror = null; img.src = monsterReserve(lag.fil); };
  const navn = document.createElement("div");
  navn.className = "navn"; navn.style.color = lag.morkt; navn.textContent = lag.navn;
  const boble = document.createElement("div");
  boble.className = "boble"; boble.textContent = ropTekst || tilfeldig(HEIAROP);
  d.appendChild(boble); d.appendChild(img); d.appendChild(navn);
  d._boble = boble; d._img = img;
  return d;
}

function lagTeller(fargeFn){
  const t = document.createElement("div");
  t.className = "teller";
  for (let i=1;i<=app.runder;i++){
    const b = document.createElement("div");
    b.className = "tellerboks"; b.dataset.n = i;
    b.style.borderColor = fargeFn(i-1);
    b.innerHTML = '<span class="tallet">' + i + '</span>';
    t.appendChild(b);
  }
  return t;
}
function fyllTeller(teller, n, farge){
  const b = teller && teller.querySelector('.tellerboks[data-n="' + n + '"]');
  if (!b) return;
  b.classList.add("full");
  b.innerHTML = '<span class="hake">✓</span>';
  b.style.background = farge;
}
function tomTeller(teller, fargeFn){
  teller && teller.querySelectorAll(".tellerboks").forEach(b => {
    b.className = "tellerboks"; b.style.background = ""; b.style.borderColor = fargeFn(+b.dataset.n - 1);
    b.innerHTML = '<span class="tallet">' + b.dataset.n + '</span>';
  });
}

function visJubel(tekst, farge, knapper, tid){
  skjulJubel();
  const j = document.createElement("div");
  j.className = "jubel vis"; j.id = "jubel";
  const t = document.createElement("div"); t.className = "tekst"; t.textContent = tekst;
  if (farge) t.style.background = farge;
  j.appendChild(t);
  if (knapper){
    const v = document.createElement("div"); v.className = "valg";
    knapper.forEach(k => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = k.tekst;
      if (k.sek) b.className = "sek";
      b.addEventListener("click", () => { skjulJubel(); k.gjor(); });
      v.appendChild(b);
    });
    j.appendChild(v);
  }
  $("#scene").appendChild(j);
  if (tid) setTimeout(skjulJubel, tid);
}
function skjulJubel(){ const j = $("#jubel"); if (j) j.remove(); }
function visCelleJubel(celle, farge, tekst){
  const d = document.createElement("div");
  d.className = "cellejubel"; d.textContent = tekst;
  d.style.background = farge;
  celle.appendChild(d);
  setTimeout(()=>d.remove(), 1800);
}

/* ============================================================
   SCENE
   ============================================================ */
function nyRunde(){
  stoppTimere();
  app.tur = 0; app.rep = 0; app.flater = []; app.ferdigeSett = 0; app.sisteRepr = null;
  skjulJubel();
  fyllTallkoe();
  const scene = $("#scene"); scene.innerHTML = "";
  if (app.oppgave === "memory") byggMemory(scene);
  else if (app.modus === "tur") byggTur(scene);
  else byggFlere(scene);
}

/* ---------- MODUS: TUR FOR TUR ---------- */
function byggTur(scene){
  const rot = document.createElement("div"); rot.className = "tur";

  const topp = document.createElement("div"); topp.className = "topplinje";
  const stripe = document.createElement("div"); stripe.className = "elevstripe";
  for (let i=0;i<app.antall;i++){
    const m = document.createElement("div"); m.className = "elevmerke"; m.dataset.i = i;
    m.style.borderColor = LAG[i].farge;
    const img = document.createElement("img");
    img.src = monsterUrl(LAG[i].fil); img.alt = LAG[i].navn;
    img.onerror = () => { img.onerror = null; img.src = monsterReserve(LAG[i].fil); };
    m.appendChild(img);
    stripe.appendChild(m);
  }
  const oppdrag = document.createElement("div");
  oppdrag.className = "oppdrag";
  oppdrag.innerHTML = OPPGAVER[app.oppgave].tittel();
  const teller = lagTeller(n => forsokFarge(0, n));
  topp.appendChild(stripe); topp.appendChild(oppdrag); topp.appendChild(teller);

  const arena = document.createElement("div"); arena.className = "arena";
  arena.style.borderColor = forsokFarge(0, 0);
  const heier = monsterBoks(LAG[0]);
  const felt = document.createElement("div"); felt.className = "felt";
  arena.appendChild(heier); arena.appendChild(felt);

  rot.appendChild(topp); rot.appendChild(arena); scene.appendChild(rot);

  app._teller = teller; app._arena = arena; app._felt = felt;
  app._stripe = stripe; app._heier = heier; app._oppdrag = oppdrag;
  merkAktivElev();
  lagTurFlate();
}

function merkAktivElev(){
  app._stripe && app._stripe.querySelectorAll(".elevmerke").forEach(m => {
    const i = +m.dataset.i;
    m.classList.toggle("aktiv", i === app.tur);
    m.classList.toggle("ferdig", i < app.tur);
  });
}

function lagTurFlate(){
  const heier = app._heier;
  const farge = forsokFarge(app.tur, app.rep);
  app._felt.innerHTML = "";
  app._arena.style.borderColor = farge;
  app.flater = [ lagOppgave(app._felt, farge, {
    paaRiktig: () => { heier._img.classList.add("heia"); heier._boble.textContent = tilfeldig(JUBELROP); },
    paaBom:    () => { heier._boble.textContent = tilfeldig(BOMROP); },
    paaFerdig: () => turFerdigOppgave()
  }) ];
  app.flater[0].sporsmaal();
}

function turFerdigOppgave(){
  const heier = app._heier;
  const farge = forsokFarge(app.tur, app.rep);
  app.rep++;
  fyllTeller(app._teller, app.rep, farge);
  heier._img.classList.add("heia");
  const r = app._arena.getBoundingClientRect();

  if (app.rep < app.runder){
    lydRunde();
    konfetti(r.left + r.width/2, r.top + r.height/2, 30, 0.8);
    const igjen = app.runder - app.rep;
    heier._boble.textContent = igjen === 1 ? "Én igjen!" : igjen + " igjen!";
    senere(()=>{ heier._img.classList.remove("heia"); lagTurFlate(); }, 2100);
    return;
  }

  lydFerdig();
  konfetti(r.left + r.width/2, r.top + r.height/2, 80, 1.1);
  heier._boble.textContent = tilfeldig(JUBELROP);
  app.tur++; app.rep = 0;

  /* Talen skal rekke å bli ferdig før neste replikk starter – si() avbryter
     den forrige. Pausene under har litt margin på de innleste filene. */
  if (app.tur < app.antall){
    senere(()=>{
      visJubel("NESTE ELEV!", LAG[app.tur].farge, null, 2400);
      si("neste-elev");
      senere(()=>{
        const nyttLag = LAG[app.tur];
        app._arena.style.borderColor = nyttLag.farge;
        const nyHeier = monsterBoks(nyttLag);
        app._arena.replaceChild(nyHeier, app._heier);
        app._heier = nyHeier;
        tomTeller(app._teller, n => forsokFarge(app.tur, n));
        merkAktivElev();
        lagTurFlate();
      }, 2400);
    }, 2200);
  } else {
    merkAktivElev();
    senere(alleFerdige, 2200);
  }
}

/* ---------- MODUS: FLERE SAMTIDIG ---------- */
function byggFlere(scene){
  const rot = document.createElement("div"); rot.className = "grid4";
  rot.style.gridTemplateColumns = "repeat(" + app.antall + ",1fr)";
  rot.style.gridTemplateRows = "1fr";
  scene.appendChild(rot);
  app.flater = [];
  app._celler = [];

  for (let i=0;i<app.antall;i++){
    const lag = LAG[i];
    const celle = document.createElement("div"); celle.className = "celle";
    celle.style.borderColor = lag.farge;
    const heier = monsterBoks(lag);
    const merket = document.createElement("div");
    merket.className = "elevnr"; merket.style.color = lag.morkt; merket.textContent = "Elev 1";
    heier.appendChild(merket);
    const teller = lagTeller(n => forsokFarge(i, n));
    const felt = document.createElement("div"); felt.className = "felt";
    celle.appendChild(heier); celle.appendChild(teller); celle.appendChild(felt);
    rot.appendChild(celle);

    const st = { i, rep:0, elev:1, plass:i, lag, celle, heier, teller, felt, merket };
    st.bygg = () => {
      felt.innerHTML = "";
      /* De andre cellene skal ikke ha samme tall samtidig – da blir det
         fristende å skotte på naboen i stedet for å telle selv. */
      const brukte = app._celler.map(c => c.flate && c.flate.tallKey).filter(v => v != null);
      st.flate = lagOppgave(felt, forsokFarge(st.plass, st.rep), {
        paaRiktig: () => { heier._img.classList.add("heia"); heier._boble.textContent = tilfeldig(JUBELROP); },
        paaBom:    () => { heier._boble.textContent = tilfeldig(BOMROP); },
        paaFerdig: () => celleFerdigOppgave(st)
      }, brukte);
      app.flater[i] = st.flate;
    };
    app._celler.push(st);
    st.bygg();
  }
}

function celleFerdigOppgave(st){
  const farge = forsokFarge(st.plass, st.rep);
  st.rep++;
  fyllTeller(st.teller, st.rep, farge);
  st.heier._img.classList.add("heia");
  const r = st.celle.getBoundingClientRect();

  if (st.rep < app.runder){
    lydRunde();
    konfetti(r.left + r.width/2, r.top + r.height/2, 25, 0.8);
    const igjen = app.runder - st.rep;
    st.heier._boble.textContent = igjen === 1 ? "Én igjen!" : igjen + " igjen!";
    senere(()=>{ st.heier._img.classList.remove("heia"); st.bygg(); }, 1200);
    return;
  }

  lydFerdig();
  konfetti(r.left + r.width/2, r.top + r.height/2, 70, 1);
  st.celle.classList.add("ferdig");
  st.heier._boble.textContent = tilfeldig(JUBELROP);
  visCelleJubel(st.celle, st.lag.farge, "NESTE ELEV!");
  app.ferdigeSett++;
  const alleRundt = app.ferdigeSett % app.antall === 0;

  senere(()=>{
    st.rep = 0; st.elev++;
    st.plass += app.antall;
    st.merket.textContent = "Elev " + st.elev;
    st.celle.classList.remove("ferdig");
    st.heier._img.classList.remove("heia");
    st.heier._boble.textContent = "Din tur!";
    tomTeller(st.teller, n => forsokFarge(st.plass, n));
    st.bygg();
  }, 2000);

  if (alleRundt){
    senere(()=>{
      lydFanfare(); storKonfetti(); si("alle-sammen");
      visJubel("🎉 SUPERT! 🎉", null, null, 1700);
    }, 350);
  }
}

function alleFerdige(){
  lydFanfare(); storKonfetti();
  si("alle-sammen");
  visJubel("🎉 SUPERT! 🎉", null, [
    { tekst:"Nye tall →", gjor:nyRunde },
    { tekst:"Samme oppgave ↺", sek:true, gjor:nyRunde }
  ]);
}

/* ============================================================
   OPPGAVE 4 – MENGDE-MEMORY
   ------------------------------------------------------------
   Ett felles brett. Hvert tall som er med, gir to kort: en mengde og
   selve tallet. Eleven snur to kort – hører de sammen, blir de
   liggende og eleven får turen en gang til.
   ============================================================ */
function besteKolonner(n){
  const scene = $("#scene");
  const B = Math.max(scene.clientWidth  - 40, 200);
  const H = Math.max(scene.clientHeight - 90, 160);
  let best = n, poeng = Infinity;
  for (let k = 1; k <= n; k++){
    if (n % k) continue;
    const r = n / k;
    const avvik = Math.abs(Math.log((B / k) / (H / r)));
    if (avvik < poeng){ poeng = avvik; best = k; }
  }
  return best;
}

function lagMemoryData(){
  const tall = bland(aktiveTall());
  const par = Math.min(Math.floor(app.brett / 2), tall.length);
  const kort = [];
  for (let i=0;i<par;i++){
    const n = tall[i];
    const repr = velgRepr(n, null);
    kort.push({ n, type:"mengde", repr, fro: n*137 + i*31 });
    kort.push({ n, type:"tall" });
  }
  return { kort:bland(kort), par };
}

function byggMemory(scene){
  const data = lagMemoryData();
  const rot = document.createElement("div"); rot.className = "memory";

  const poeng = document.createElement("div"); poeng.className = "poengrad";
  const spillere = [];
  for (let i=0;i<app.antall;i++){
    const lag = LAG[i];
    const d = document.createElement("div"); d.className = "poengspiller"; d.dataset.i = i;
    const img = document.createElement("img");
    img.src = monsterUrl(lag.fil); img.alt = lag.navn;
    img.onerror = () => { img.onerror = null; img.src = monsterReserve(lag.fil); };
    const navn = document.createElement("span");
    navn.className = "navn"; navn.style.color = lag.morkt; navn.textContent = lag.navn;
    const tall = document.createElement("span");
    tall.className = "tall"; tall.textContent = "0";
    d.appendChild(img); d.appendChild(navn); d.appendChild(tall);
    poeng.appendChild(d);
    spillere.push({ lag, el:d, tall, poeng:0 });
  }

  const brett = document.createElement("div"); brett.className = "memorybrett";
  const kolonner = besteKolonner(data.kort.length);
  brett.style.gridTemplateColumns = "repeat(" + kolonner + ",minmax(0,1fr))";
  brett.style.gridTemplateRows = "repeat(" + Math.ceil(data.kort.length / kolonner) + ",minmax(0,1fr))";

  const kortEl = [];
  data.kort.forEach(k => {
    const kn = document.createElement("button");
    kn.className = "mkort"; kn.type = "button";
    const inn = document.createElement("div"); inn.className = "innside";
    const bak = document.createElement("div"); bak.className = "side bak";
    bak.innerHTML = '<div class="mynt">?</div>';
    const front = document.createElement("div"); front.className = "side front";
    if (k.type === "tall"){
      const s = tallKortSvg(k.n);
      front.appendChild(s);
      kn._tekst = s._ordtekst;
    } else {
      front.appendChild(tegnMengde(k.n, k.repr, k.fro));
    }
    inn.appendChild(bak); inn.appendChild(front);
    kn.appendChild(inn);
    kn._data = k;
    kn.addEventListener("click", () => snu(kn));
    brett.appendChild(kn);
    kortEl.push(kn);
  });

  rot.appendChild(poeng); rot.appendChild(brett);
  scene.appendChild(rot);

  let aapne = [], funnet = 0, spiller = 0, laast = false;
  function merkSpiller(){ spillere.forEach((s,i) => s.el.classList.toggle("aktiv", i === spiller)); }
  merkSpiller();
  si("finn-tallpar");

  function snu(kn){
    if (laast || kn.classList.contains("snudd") || kn.classList.contains("funnet")) return;
    kn.classList.add("snudd");
    lydSnu();
    siTall(kn._data.n);
    aapne.push(kn);
    if (aapne.length < 2) return;

    laast = true;
    const [a, b] = aapne;
    /* Et par er ett mengdekort og ett tallkort med samme antall. */
    const par = a._data.n === b._data.n && a._data.type !== b._data.type;
    if (par){
      senere(()=>{
        a.classList.add("funnet"); b.classList.add("funnet");
        funnet++;
        spillere[spiller].poeng++;
        spillere[spiller].tall.textContent = spillere[spiller].poeng;
        lydRunde();
        const r = b.getBoundingClientRect();
        konfetti(r.left + r.width/2, r.top + r.height/2, 35, 0.9);
        si("tallpar", "tall-" + a._data.n);
        aapne = []; laast = false;
        if (funnet >= data.par) senere(memoryFerdig, 1500);
      }, 900);
    } else {
      senere(()=>{
        a.classList.add("bom"); b.classList.add("bom");
        lydFeil();
        senere(()=>{
          a.classList.remove("snudd","bom"); b.classList.remove("snudd","bom");
          aapne = []; laast = false;
          spiller = (spiller + 1) % app.antall;
          merkSpiller();
          if (app.antall > 1) si("din-tur");
        }, 900);
      }, 900);
    }
  }

  function memoryFerdig(){
    lydFanfare(); storKonfetti(); si("alle-sammen");
    const best = Math.max(...spillere.map(s => s.poeng));
    const vinnere = spillere.filter(s => s.poeng === best);
    const tekst = app.antall === 1 ? "🎉 ALLE PAR FUNNET! 🎉"
      : vinnere.length > 1 ? "🎉 UAVGJORT! 🎉"
      : "🎉 " + vinnere[0].lag.navn.toUpperCase() + " VANT! 🎉";
    visJubel(tekst, null, [
      { tekst:"Nytt brett →", gjor:nyRunde },
      { tekst:"Se kortene ↺", sek:true, gjor:()=>{} }
    ]);
  }

  app._memory = {
    settOrdtekst: paa => kortEl.forEach(k => { if (k._tekst) k._tekst.style.display = paa ? "" : "none"; }),
    visMeg: () => {
      if (laast) return;
      laast = true;
      const skjulte = kortEl.filter(k => !k.classList.contains("snudd") && !k.classList.contains("funnet"));
      skjulte.forEach(k => k.classList.add("snudd"));
      senere(()=>{ skjulte.forEach(k => k.classList.remove("snudd")); laast = false; }, 1400);
    }
  };
  app.flater = [];
}

/* ---------- neste oppgave uten å telle den som ferdig ----------
   Trykker læreren «Neste» rett etter at eleven svarte riktig, ligger det
   fortsatt en utløser og venter på å telle svaret ferdig. Den må dø her –
   ellers teller den på oppgaven som nettopp ble bygd i stedet. */
function hoppTilNeste(){
  stoppTimere();
  if (app.oppgave === "memory"){ nyRunde(); return; }
  if (app.modus === "tur"){
    lagTurFlate();
  } else {
    app._celler.forEach(st => st.bygg());
  }
}

/* ============================================================
   TALL I SPILL
   ============================================================ */
const TALL_NOKKEL = "myntland-telleverkstedet-tall-v1";

function lastTall(){
  try {
    const a = JSON.parse(localStorage.getItem(TALL_NOKKEL));
    if (Array.isArray(a) && a.length) return new Set(a.filter(n => ALLE_TALL.includes(n)));
  } catch(e){}
  return new Set(ALLE_TALL.filter(n => n <= 10));   /* 1–10 er et trygt utgangspunkt */
}
function lagreTall(){
  try { localStorage.setItem(TALL_NOKKEL, JSON.stringify([...app.aktive])); } catch(e){}
}

function byggTallknapper(){
  const boks = $("#tallrad"); boks.innerHTML = "";
  ALLE_TALL.forEach(n => {
    const kn = document.createElement("button");
    kn.type = "button";
    kn.className = "ttast";
    kn.dataset.n = n;
    kn.textContent = n;
    kn.setAttribute("aria-pressed", app.aktive.has(n) ? "true" : "false");
    kn.title = TALLORD[n];
    kn.addEventListener("click", () => vekslTall(n));
    boks.appendChild(kn);
  });
  oppdaterTalltall();
}
function tegnTallknapper(){
  document.querySelectorAll(".ttast").forEach(kn => {
    kn.setAttribute("aria-pressed", app.aktive.has(+kn.dataset.n) ? "true" : "false");
  });
}
function oppdaterTalltall(){
  const n = ALLE_TALL.filter(t => app.aktive.has(t)).length;
  const felt = $("#talltall");
  if (!n){
    felt.textContent = "ingen tall valgt – bruker 1–20";
    felt.classList.add("tom");
    return;
  }
  felt.textContent = n + (n === 1 ? " tall i spill" : " tall i spill");
  felt.classList.remove("tom");
  if (app.oppgave === "memory" && n < app.brett/2)
    felt.textContent += " · brettet får " + (n*2) + " kort";
}

/* Å skru et tall av og på skal ikke rive scenen fra eleven som holder på –
   vi bytter bare ut køen, så slår det inn fra neste oppgave. Memory er
   unntaket: der bygges hele brettet på nytt. */
function vekslTall(n){
  if (app.aktive.has(n)) app.aktive.delete(n); else app.aktive.add(n);
  lagreTall(); tegnTallknapper(); oppdaterTalltall(); fyllTallkoe();
}
function settTall(liste){
  app.aktive = new Set(liste);
  lagreTall(); tegnTallknapper(); oppdaterTalltall(); fyllTallkoe();
}

/* ============================================================
   LÆRERLINJA
   ============================================================ */
function oppdaterKnapper(){
  const memory = app.oppgave === "memory";
  const venner = app.oppgave === "venner";
  const fyll   = app.oppgave === "fyll";
  $("#modusvelger").classList.toggle("skjult", memory);
  $("#antallKnapp").classList.toggle("skjult", !memory && app.modus !== "flere");
  $("#runderKnapp").classList.toggle("skjult", memory);
  $("#valgKnapp").classList.toggle("skjult", memory || fyll);
  $("#helhetKnapp").classList.toggle("skjult", !venner);
  $("#brettKnapp").classList.toggle("skjult", !memory);
  $("#reprKnapp").classList.toggle("skjult", fyll || venner);
  $("#antallKnapp").textContent = "👥 " + app.antall + (memory ? " spillere" : " elever");
  $("#runderKnapp").textContent = "🔁 " + app.runder + (app.runder === 1 ? " oppgave" : " oppgaver");
  $("#valgKnapp").textContent = "🔢 " + app.valg + " valg";
  $("#helhetKnapp").textContent = "🤝 Til " + app.helhet;
  $("#brettKnapp").textContent = "🃏 " + app.brett + " kort";
  $("#reprKnapp").textContent = "🎲 " + REPR_NAVN[app.repr];
  $("#nesteKnapp").textContent = memory ? "Nytt brett →" : "Neste oppgave →";
  $("#ordKnapp").textContent = app.visOrd ? "📝 Tallord på" : "📝 Tallord av";
  $("#ordKnapp").classList.toggle("av", !app.visOrd);
  /* Oppgavevelgeren viser hva «Venner» gjelder akkurat nå. */
  const vennerKnapp = document.querySelector('#oppgavevelger button[data-oppgave="venner"]');
  if (vennerKnapp) vennerKnapp.textContent = "🤝 Venner til " + app.helhet;
}

$("#oppgavevelger").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  app.oppgave = b.dataset.oppgave;
  document.querySelectorAll("#oppgavevelger button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true":"false"));
  oppdaterKnapper(); oppdaterTalltall(); nyRunde();
});
$("#modusvelger").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  app.modus = b.dataset.modus;
  document.querySelectorAll("#modusvelger button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true":"false"));
  oppdaterKnapper(); nyRunde();
});
$("#tall5").addEventListener("click",  () => { settTall(ALLE_TALL.filter(n => n <= 5));  if (app.oppgave === "memory") nyRunde(); });
$("#tall10").addEventListener("click", () => { settTall(ALLE_TALL.filter(n => n <= 10)); if (app.oppgave === "memory") nyRunde(); });
$("#tall20").addEventListener("click", () => { settTall(ALLE_TALL.slice());               if (app.oppgave === "memory") nyRunde(); });
$("#tallIngen").addEventListener("click", () => { settTall([]);                           if (app.oppgave === "memory") nyRunde(); });
$("#antallKnapp").addEventListener("click", () => {
  app.antall = app.antall >= 4 ? (app.oppgave === "memory" ? 1 : 2) : app.antall + 1;
  oppdaterKnapper(); nyRunde();
});
$("#runderKnapp").addEventListener("click", () => {
  app.runder = app.runder >= 5 ? 1 : app.runder + 1;
  oppdaterKnapper(); nyRunde();
});
$("#valgKnapp").addEventListener("click", () => {
  app.valg = app.valg >= 5 ? 2 : app.valg + 1;
  oppdaterKnapper(); nyRunde();
});
$("#helhetKnapp").addEventListener("click", () => {
  app.helhet = app.helhet === 5 ? 10 : app.helhet === 10 ? 20 : 5;
  oppdaterKnapper(); nyRunde();
});
$("#brettKnapp").addEventListener("click", () => {
  app.brett = app.brett >= 20 ? 8 : app.brett + 4;
  oppdaterKnapper(); oppdaterTalltall(); nyRunde();
});
$("#reprKnapp").addEventListener("click", () => {
  const rekke = ["blandet", ...REPR];
  app.repr = rekke[(rekke.indexOf(app.repr) + 1) % rekke.length];
  oppdaterKnapper(); nyRunde();
});
$("#ordKnapp").addEventListener("click", () => {
  app.visOrd = !app.visOrd;
  oppdaterKnapper();
  app.flater.forEach(f => f && f.settOrdtekst && f.settOrdtekst(app.visOrd));
  if (app._memory && app.oppgave === "memory") app._memory.settOrdtekst(app.visOrd);
});
$("#visKnapp").addEventListener("click", () => {
  if (app.oppgave === "memory"){ app._memory && app._memory.visMeg(); return; }
  app.flater.forEach(f => f && f.visMeg());
});
$("#nesteKnapp").addEventListener("click", hoppTilNeste);
$("#nullstillKnapp").addEventListener("click", nyRunde);

/* Første berøring låser opp lyd i nettleseren – da henter vi replikkene samtidig */
let lydVarmet = false;
["pointerdown","keydown"].forEach(h => addEventListener(h, () => {
  if (lydVarmet) return;
  lydVarmet = true;
  lydKontekst();
  forbered(...REPLIKKER);
  forbered(...ALLE_TALL.map(n => "tall-" + n));
}, { once:false, passive:true }));

$("#lydKnapp").addEventListener("click", () => {
  lydPaa = !lydPaa;
  $("#lydKnapp").textContent = lydPaa ? "🔊" : "🔇";
  $("#lydKnapp").classList.toggle("av", !lydPaa);
  if (lydPaa) lydKontekst();
  else stoppTale();
});
$("#fullKnapp").addEventListener("click", () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  else document.exitFullscreen && document.exitFullscreen();
});
$("#rentKnapp").addEventListener("click", () => document.body.classList.add("rent"));
$("#visMenyKnapp").addEventListener("click", () => document.body.classList.remove("rent"));

/* --- tastatur for læreren --- */
addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight"){ hoppTilNeste(); return; }
  if (e.key === " "){ e.preventDefault(); nyRunde(); return; }
  if (e.key === "Enter"){ $("#visKnapp").click(); return; }
});

/* --- start --- */
app.aktive = lastTall();
byggTallknapper();
oppdaterKnapper();
nyRunde();
</script>
